<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>สตูดิโอ · SMART SHOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600&family=Sarabun:wght@400;600&display=swap">
<style>
:root{
  --bg:#0E0B14; --card:rgba(30,24,40,.92); --card2:#1b1626; --line:rgba(220,200,255,.14);
  --ink:#F4EFFA; --muted:#A99FBC; --acc:#FF8FB1; --acc2:#8FD3FF; --you:#FFC24B; --ok:#4ADE80; --red:#FF6B7A; --todo:#7d7590;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,system-ui,sans-serif;font-size:17px;line-height:1.55}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:Kanit,Sarabun,sans-serif;font-weight:600;margin:0;line-height:1.3}
h2{font-size:21px}h3{font-size:17px}
a{color:var(--acc2)}
/* header */
#top{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 70%,rgba(14,11,20,0));padding:calc(8px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left));display:grid;gap:8px}
.bar{display:flex;align-items:center;gap:10px}
.logo{font-family:Kanit,sans-serif;font-size:20px;display:flex;gap:8px;align-items:center}
.logo i{font-style:normal;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#ff8fb1,#8f7bff)}
.grow{flex:1}
.ib{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);display:inline-grid;place-items:center;text-decoration:none;color:var(--ink);font-size:18px;cursor:pointer}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{border:0;background:none;padding:8px 1px;font-size:14px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;min-height:44px;white-space:nowrap}
.tabs button.on{background:#2e2540;color:var(--ink)}
.tabs b{font-size:12px;background:var(--you);color:#1d1400;border-radius:999px;padding:0 6px;margin-left:3px}
main{max-width:1000px;margin:0 auto;padding:4px max(12px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;min-width:0}
.muted{color:var(--muted)}.small{font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:#2a2238;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn.main{background:linear-gradient(135deg,#ff7aa8,#8f7bff);border-color:transparent;color:#fff}
.btn.ok{background:#16a34a;border-color:#16a34a;color:#fff}
.btn.sm{min-height:38px;padding:5px 12px;font-size:15px}
.btn:disabled{opacity:.6}
textarea,input[type=text],input[type=email],input[type=password],select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#141019}
textarea{min-height:90px;resize:vertical}
input[type=number]{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#141019}
.lab{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.sec{display:grid;gap:8px}
.report{border-left:3px solid var(--acc2);padding:6px 10px;background:rgba(143,211,255,.07);border-radius:0 10px 10px 0}
.mem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.04)}
.mem b{display:block;line-height:1.25}.mem small{color:var(--muted);display:block}
.mem .on{margin-left:auto;font-size:13px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}

/* ===== ธีมใหม่: นุ่ม อ่านง่าย กดง่าย ===== */
body{background:radial-gradient(900px 500px at 10% -10%,rgba(255,122,168,.16),transparent 60%),radial-gradient(800px 500px at 110% 10%,rgba(143,123,255,.16),transparent 60%),var(--bg);background-attachment:fixed}
.tabs button{display:grid;justify-items:center;gap:1px;font-size:12.5px;padding:6px 1px;transition:background .2s,color .2s}
.tabs button{position:relative}.tabs button b{position:absolute;top:3px;right:6px;margin:0}
.boardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.boardgrid .lab{grid-column:1/-1}
.tabs button i{font-style:normal;font-size:19px;line-height:1.1;filter:grayscale(.6);transition:filter .2s,transform .2s}
.tabs button.on{background:linear-gradient(135deg,rgba(255,122,168,.25),rgba(143,123,255,.25));color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,180,220,.25)}
.tabs button.on i{filter:none;transform:scale(1.08)}
.card{box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 10px 30px rgba(0,0,0,.25)}
.btn{transition:transform .1s,filter .2s}.btn:active{transform:scale(.97)}.btn.main:hover{filter:brightness(1.08)}
.hero{display:flex;align-items:center;gap:12px}.hero .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,rgba(255,122,168,.3),rgba(143,123,255,.3));flex:none}
.hero p{margin:0}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat .t{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:2px}
.stat .t b{font-family:Kanit,sans-serif;font-size:22px;line-height:1.2}.stat .t span{font-size:13px;color:var(--muted)}
.stat .t.warn{border-color:rgba(255,107,122,.45);background:rgba(255,107,122,.08)}
.stat .t.good{border-color:rgba(74,222,128,.35)}
.mini{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.mini i{display:block;height:100%;background:linear-gradient(90deg,#ff7aa8,#8f7bff)}
.errl{font-size:13px;color:#ffb3bc;background:rgba(255,107,122,.08);border-radius:10px;padding:6px 10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:grid}
.panel .pic{aspect-ratio:16/9;background:#120e19;display:grid;place-items:center;position:relative;overflow:hidden}
.panel .pic img,.panel .pic video{width:100%;height:100%;object-fit:cover}
.panel .pic .ph{padding:18px;text-align:center;color:var(--muted);font-size:15px}
.panel .bubble{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,.94);color:#1a1424;border-radius:16px;padding:8px 12px;font-size:15px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.panel .bubble b{color:#7a3fd1}
.panel .info{padding:10px 14px;display:grid;gap:6px}
.panel.ok{border-color:rgba(74,222,128,.5)}.panel.fix{border-color:rgba(255,194,75,.6)}
.pnote{font-size:14px;background:rgba(255,194,75,.1);border-radius:10px;padding:6px 10px;color:#ffd98a}
.modal[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,6,12,.72);display:grid;place-items:center;padding:16px}
.modal .box{width:min(640px,100%);max-height:90vh;overflow:auto;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px}
/* ===== ห้องสตูดิโอ ===== */
.room{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/3.3;border:1px solid var(--line);
  background:radial-gradient(120% 70% at 50% 0%,#3a2a52 0%,#1d1529 55%,#120d1a 100%)}
@media (min-width:760px){.room{aspect-ratio:16/8}}
.room .wall{position:absolute;inset:0 0 28% 0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 60px)}
.room .floor{position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(#2a1f36,#160f1f);border-top:2px solid rgba(255,200,230,.08)}
.room .rug{position:absolute;left:18%;right:18%;bottom:4%;height:12%;border-radius:50%;background:radial-gradient(#4a2f55,#2b1d36);opacity:.8}
.room .win{position:absolute;left:4%;top:8%;width:17%;height:40%;border-radius:10px;border:3px solid #4a3a5f;background:linear-gradient(#0b1530,#1f2c55);overflow:hidden}
.room .win::after{content:'';position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.6px);background-size:14px 14px;opacity:.55;animation:snow 6s linear infinite}
@keyframes snow{to{background-position:6px 70px}}
.room .shelf{position:absolute;right:4%;top:12%;width:16%;display:grid;gap:6px}
.room .shelf div{height:6px;border-radius:3px;background:#4a3a5f}
.room .shelf span{font-size:clamp(14px,3vw,24px);line-height:1}
.room .onair{position:absolute;left:50%;top:3.5%;transform:translateX(-50%);font-family:Kanit,sans-serif;font-size:clamp(11px,2.4vw,15px);letter-spacing:.12em;padding:2px 12px;border-radius:8px;border:2px solid #5a4870;color:#7a6890;background:#1a1323}
.room .onair.live{color:#fff;background:#e0245e;border-color:#ff7aa8;box-shadow:0 0 18px #ff3d7f;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 6px #ff3d7f}}
.room .screen{position:absolute;left:50%;top:12%;transform:translateX(-50%);height:62%;aspect-ratio:9/16;background:#05030a;border:6px solid #2b2238;border-radius:12px;box-shadow:0 0 0 2px #463a58,0 0 40px rgba(143,123,255,.35);overflow:hidden;display:grid;place-items:center}
.room .screen video{width:100%;height:100%;object-fit:cover;display:block}
.room .screen .idle{color:var(--muted);font-size:13px;text-align:center;padding:10px}
.room .desk{position:absolute;left:24%;right:24%;bottom:13%;height:7%;border-radius:8px 8px 4px 4px;background:linear-gradient(#5a3f3a,#3a2826)}
.room .lamp{position:absolute;left:27%;bottom:20%;font-size:clamp(16px,4vw,28px)}
.room .mic{position:absolute;right:28%;bottom:20%;font-size:clamp(16px,4vw,28px)}
.room .plant{position:absolute;left:6%;bottom:10%;font-size:clamp(22px,6vw,44px)}
.room .cam{position:absolute;right:7%;bottom:10%;font-size:clamp(22px,6vw,44px)}
.room .cap{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;font-size:14px;background:linear-gradient(transparent,rgba(0,0,0,.65));text-align:center}

/* progress */
.pbar{height:12px;border-radius:999px;background:#2a2238;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#ff7aa8,#8f7bff);border-radius:999px;transition:width .4s}
.big{font-family:Kanit,sans-serif;font-size:26px;line-height:1.2}
.stages{display:grid;gap:8px}
.stage{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid transparent}
.stage .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:#2a2238}
.stage b{display:block;line-height:1.25}.stage small{color:var(--muted);display:block;line-height:1.35}
.st{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st.done{background:rgba(74,222,128,.15);color:var(--ok)}
.st.doing{background:rgba(143,211,255,.15);color:var(--acc2)}
.st.you{background:rgba(255,194,75,.18);color:var(--you)}
.st.todo{background:rgba(255,255,255,.06);color:var(--todo)}
.stage.you{border-color:rgba(255,194,75,.45);background:rgba(255,194,75,.06)}
.stage.doing{border-color:rgba(143,211,255,.3)}

/* stories */
.epcard{display:grid;gap:8px;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.subtabs{display:flex;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto}
.subtabs button{border:0;background:none;padding:8px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap;min-height:40px}
.subtabs button.on{background:#2e2540;color:var(--ink)}
.prompt{background:#141019;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.prompt code{font-family:ui-monospace,Menlo,monospace;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.prompt .k{font-size:13px;font-weight:600;color:var(--muted)}
details.more summary{cursor:pointer;color:var(--muted);font-size:14px;padding:4px 0}
.shot{border:1px solid var(--line);border-radius:16px;overflow:hidden;display:grid;grid-template-columns:58px minmax(0,1fr);background:rgba(255,255,255,.03)}
.shot .no{display:grid;align-content:start;justify-items:center;gap:2px;padding:12px 4px;border-right:1px solid var(--line)}
.shot .no b{font-family:Kanit,sans-serif;font-size:24px}
.shot .bd{padding:12px;display:grid;gap:8px;min-width:0}
.shot.now{border-color:var(--acc)}
.media{display:flex;gap:10px;flex-wrap:wrap}
.slot{width:110px;aspect-ratio:9/16;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;font-size:13px;color:var(--muted);overflow:hidden;cursor:pointer;padding:6px}
.slot.wide{width:100%;max-width:340px;aspect-ratio:auto;min-height:70px}
.slot img,.slot video{width:100%;height:100%;object-fit:cover}
.slot audio{width:100%}
.stp{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(255,194,75,.15);color:var(--you)}
.stp.approved,.stp.posted{background:rgba(74,222,128,.15);color:var(--ok)}
.stp.revise{background:rgba(255,107,122,.15);color:var(--red)}
.howto{margin:0;padding-left:22px;display:grid;gap:4px}

/* bot */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.bimg{border:2px solid transparent;border-radius:12px;overflow:hidden;background:#000;display:grid;align-content:start}
.bimg.star{border-color:var(--you)}
.bimg img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:zoom-in}
.bimg .bb{display:flex;gap:4px;padding:4px;flex-wrap:wrap;justify-content:space-between;background:#141019}
.bimg .bb button{min-height:34px;padding:2px 9px;border-radius:9px;border:1px solid var(--line);background:#2a2238;cursor:pointer;font-size:14px}
.bimg .bb .use{flex:1 1 100%;background:#16a34a;border-color:#16a34a;color:#fff;font-weight:600}
.botthumbs:empty,.vidthumbs:empty{display:none}.vidthumbs{display:grid;gap:6px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.vcard{border:2px solid transparent;border-radius:12px;overflow:hidden;background:#000;display:grid}
.vcard video{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#000}
.vcard .bb{display:flex;gap:4px;padding:4px;flex-wrap:wrap;background:#141019}.vcard .bb button{min-height:34px;padding:2px 9px;border-radius:9px;border:1px solid var(--line);background:#2a2238;cursor:pointer;font-size:14px}.vcard .bb .use{flex:1 1 100%;background:#16a34a;border-color:#16a34a;color:#fff;font-weight:600}
.botthumbs{display:grid;gap:6px}
#bview{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.9);display:grid;place-items:center;padding:16px}
#bview img{max-width:100%;max-height:88vh;border-radius:12px}

/* player */
#player{position:fixed;inset:0;background:#000;z-index:40;display:grid;grid-template-rows:1fr auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.stg{position:relative;margin:auto;height:100%;max-height:calc(100vh - 130px);aspect-ratio:9/16;max-width:100vw;overflow:hidden;background:#111;border-radius:8px}
.stg img,.stg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stg img.kb{animation:kb 6s ease-out forwards}@keyframes kb{to{transform:scale(1.12)}}
.stg .sk{position:absolute;inset:0;display:grid;align-content:center;gap:12px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 40%,#2a1f3d,#0b0810)}
.stg .ost{position:absolute;left:8%;right:8%;top:16%;text-align:center;font-family:Kanit,sans-serif;font-size:26px;color:#fff;text-shadow:0 0 4px #000,0 2px 6px #000}
.stg .sub{position:absolute;left:6%;right:6%;bottom:9%;text-align:center;font-size:17px;color:#fff;text-shadow:0 0 4px #000,0 1px 4px #000}
.ctrl{display:flex;gap:8px;justify-content:center;align-items:center;padding:10px;flex-wrap:wrap}
.prog{flex:1;max-width:420px;height:6px;border-radius:3px;background:#333;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--acc)}

#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;background:#2e2540;border:1px solid var(--line);border-radius:14px;padding:10px 16px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
/* คลังไอเดีย */
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (max-width:420px){.igrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.icard{display:grid;gap:6px;cursor:pointer;text-align:left;background:none;border:0;padding:0;color:var(--ink);min-width:0}
.icov{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#241c33;border:1px solid var(--line)}
.icov img{width:100%;height:100%;object-fit:cover;display:block}
.icov .ph{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:8px;padding:12px;text-align:center}
.icov .ph i{font-style:normal;font-size:34px}.icov .ph p{margin:0;font-size:13px;line-height:1.45;color:#e9e2f5;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.icov .badge{position:absolute;right:6px;bottom:6px;font-size:12px;font-weight:600;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:1px 7px}
.icov .ty{position:absolute;left:6px;top:6px;font-size:14px;background:rgba(0,0,0,.5);border-radius:8px;padding:2px 6px}
.icard b{font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.icard small{color:var(--muted);font-size:12.5px;margin-top:-4px}
#iview{position:fixed;inset:0;z-index:60;background:rgba(8,6,12,.96);display:grid;grid-template-rows:minmax(0,1fr) auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
#iview .iv{display:grid;place-items:center;min-height:0;overflow:auto}
#iview .iv img,#iview .iv video{max-width:100%;max-height:100%;border-radius:12px}
#iview .iv pre{white-space:pre-wrap;word-break:break-word;font-family:Sarabun,sans-serif;font-size:18px;max-width:720px;width:100%;background:var(--card2);padding:16px;border-radius:14px;margin:0}
#iview .ib2{display:grid;gap:8px;max-width:720px;width:100%;margin:10px auto 0}
/* คลัง: หน้าโหลดแบบเกม */
.lload{background:linear-gradient(160deg,#2a1d42,#16101f);border-color:rgba(255,143,177,.35)}
.lbig{font-family:Kanit,sans-serif;font-size:21px;line-height:1.3}
.lbar{height:14px;border-radius:999px;background:#120d1a;border:1px solid var(--line);overflow:hidden;position:relative}
.lbar i{display:block;height:100%;background:linear-gradient(90deg,#ff7aa8,#8f7bff,#8fd3ff);background-size:200% 100%;animation:lflow 2.4s linear infinite;border-radius:999px;transition:width .6s}
.lbar.thin{height:6px}
@keyframes lflow{to{background-position:-200% 0}}
.ltip{font-size:14px;color:#d9cdee;border-left:3px solid var(--acc);padding:4px 10px;background:rgba(255,255,255,.04);border-radius:0 8px 8px 0}
.lprev{position:relative;border-radius:14px;overflow:hidden;max-height:260px}
.lprev img{width:100%;height:260px;object-fit:cover;display:block;filter:saturate(1.1)}
.lprev span{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;font-size:13px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
@media (max-width:420px){.lgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}

.vx{position:relative;height:min(68vh,560px);overflow:hidden;border-radius:24px;border:1px solid var(--line);touch-action:none;cursor:grab;
  background:radial-gradient(120% 80% at 50% 0%,#CFE6FF 0%,#EADFFF 45%,#FFE3EF 100%);box-shadow:0 10px 30px rgba(124,77,255,.15)}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';
/* ================= พื้นฐาน ================= */
const sb=window.supabase.createClient('https://tnfjosnpjjrmyxshfzlz.supabase.co','sb_publishable_UnlipRW9A797QdkeNpixug_goq2D5-8',{auth:{persistSession:true,autoRefreshToken:true}});
const BUCKET='studio-media';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null,eps=[],ep=null,epTab='overview',urls={},view='studio',claudeTasks=[],curId=null,screenKey='';
try{curId=localStorage.getItem('ss_curep');}catch(e){}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200);}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('คัดลอกแล้ว');}catch(e){toast('คัดลอกไม่ได้ ให้กดค้างที่ข้อความแล้วเลือกคัดลอก');}}
function copyBox(k,t){return t?`<div class="prompt"><span class="k">${esc(k)}</span><code>${esc(t)}</code><div><button class="btn sm" data-copy="${esc(t)}">คัดลอก</button></div></div>`:'';}
const EPST={draft:'ฉบับร่าง',revise:'รอ Claude แก้',approved:'อนุมัติแล้ว',posted:'โพสต์แล้ว'};
const fmtS=s=>{s=Math.round(+s||0);return s>=60?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} นาที`:`${s} วิ`;};

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('#login').hidden=false;return;}
  user=session.user;$('#login').hidden=true;
  await refresh();render();
  setInterval(()=>{if(!document.hidden)refresh(true);},20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh(true);});
}
$('#loginForm').onsubmit=async e=>{e.preventDefault();
  const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error){$('#loginErr').textContent='เข้าสู่ระบบไม่สำเร็จ ตรวจอีเมลและรหัสผ่านอีกครั้ง';return;}boot();};

async function refresh(quiet){
  const [e,t]=await Promise.all([
    sb.from('studio_episodes').select('*').order('created_at',{ascending:false}),
    sb.from('studio_tasks').select('*').eq('team','brain').order('created_at',{ascending:false}).limit(6)
  ]);
  if(e.error){if(!quiet)toast('โหลดข้อมูลไม่สำเร็จ');return;}
  eps=e.data||[];claudeTasks=t.data||[];
  if(!curId||!eps.some(x=>x.id===curId))curId=eps[0]&&eps[0].id;
  if(ep){const f=eps.find(x=>x.id===ep.id);if(f)ep=f;}
  await signAll();header();
  if(quiet){if(view==='studio')renderStudio(true);else if(view==='eps'&&!ep)renderEpList();}
}
/* signed URL ของไฟล์ทุกตอน (ใช้ทั้งจอฉายและหน้าตอน) */
async function signAll(){const paths=[];eps.forEach(e=>{const m=e.media||{};for(const k in m)for(const t in m[k])if(m[k][t]&&!/^https?:/.test(m[k][t]))paths.push(m[k][t]);});
  const need=paths.filter(p=>!urls[p]);if(!need.length)return;
  const {data}=await sb.storage.from(BUCKET).createSignedUrls(need,3600*6);(data||[]).forEach(d=>{if(d.signedUrl)urls[d.path]=d.signedUrl;});}
async function signMedia(){await signAll();}
// media เก็บได้ 2 แบบ: path ใน Supabase Storage หรือ URL เต็ม (เช่นคลิปที่ Claude ส่งขึ้น GitHub)
function mUrlOf(e,k,t){const p=e.media&&e.media[k]&&e.media[k][t];return p?(/^https?:/.test(p)?p:urls[p]):null;}
function mUrl(k,t){return ep?mUrlOf(ep,k,t):null;}

/* ================= ความคืบหน้า ================= */
function prog(e){const S=e.shots||[],m=e.media||{},N=S.length;
  const total=S.reduce((a,s)=>a+(+s.sec||0),0);
  const img=S.filter(s=>m[String(s.n)]&&m[String(s.n)].image).length;

  const checks={...(e.checks||{})};const steps={...(checks.steps||{})};if(on)steps[k]=new Date().toISOString();else delete steps[k];checks.steps=steps;
  const f={checks,updated_at:new Date().toISOString()};
  if(k==='script')f.status=on?'approved':'draft';if(k==='script'&&on)f.approved_at=new Date().toISOString();

async function upload(k,ty,file){if(file.size>50*1024*1024)return toast('ไฟล์ใหญ่เกิน 50MB');toast('กำลังอัปโหลด…');

  const {error}=await sb.storage.from(BUCKET).upload(path,file,{contentType:file.type||undefined,upsert:true});if(error)return toast('อัปโหลดไม่สำเร็จ: '+error.message);
  const media={...(ep.media||{})},old=media[k]&&media[k][ty];media[k]={...(media[k]||{}),[ty]:path};

const PL={i:0,playing:false,voice:true,timer:null,t0:0,dur:0,raf:null};
function stopAll(){clearTimeout(PL.timer);cancelAnimationFrame(PL.raf);try{speechSynthesis.cancel();}catch(e){}const v=$('#stage video');if(v)v.pause();}
function startPlayer(){PL.i=0;PL.playing=true;$('#player').hidden=false;$('#pPlay').textContent='หยุด';showShot();}
function showShot(){stopAll();const S=ep.shots||[];if(PL.i>=S.length){PL.playing=false;$('#pPlay').textContent='เล่นใหม่';$('#progT').textContent='จบฉบับร่าง';return;}
  const s=S[PL.i],k=String(s.n),vid=mUrl(k,'video'),img=mUrl(k,'image');
  $('#stage').innerHTML=(vid?`<video src="${vid}" autoplay muted playsinline></video>`:img?`<img class="kb" src="${img}" alt="">`:`<div class="sk"><div class="muted">ช็อต ${esc(s.n)}${s.shot?' · '+esc(s.shot):''}</div><div>${esc(s.action)}</div><div class="muted small">ยังไม่มีภาพ</div></div>`)+(s.text?`<div class="ost">${esc(s.text)}</div>`:'')+(s.narration?`<div class="sub">${esc(s.narration)}</div>`:'');
  PL.dur=(+s.sec||2)*1000;PL.t0=performance.now();
  if(PL.voice&&s.narration&&'speechSynthesis' in window){try{const u=new SpeechSynthesisUtterance(s.narration);u.lang='th-TH';const tv=speechSynthesis.getVoices().find(x=>/^th/i.test(x.lang));if(tv)u.voice=tv;u.rate=1.1;speechSynthesis.speak(u);}catch(e){}}
  const tick=()=>{const el=performance.now()-PL.t0;$('#progBar').style.width=((PL.i+Math.min(1,el/PL.dur))/S.length*100)+'%';$('#progT').textContent=`ช็อต ${s.n} · ${(el/1000).toFixed(1)}/${s.sec} วิ`;if(PL.playing)PL.raf=requestAnimationFrame(tick);};tick();
  if(PL.playing)PL.timer=setTimeout(()=>{PL.i++;showShot();},PL.dur);}
$('#pPlay').onclick=()=>{if(PL.playing){PL.playing=false;stopAll();$('#pPlay').textContent='เล่นต่อ';}else{if(PL.i>=(ep.shots||[]).length)PL.i=0;PL.playing=true;$('#pPlay').textContent='หยุด';showShot();}};
$('#pNext').onclick=()=>{PL.i=Math.min(PL.i+1,(ep.shots||[]).length-1);showShot();};
$('#pPrev').onclick=()=>{PL.i=Math.max(PL.i-1,0);showShot();};
$('#pVoice').onclick=()=>{PL.voice=!PL.voice;$('#pVoice').textContent='เสียงอ่าน: '+(PL.voice?'เปิด':'ปิด');if(!PL.voice)try{speechSynthesis.cancel();}catch(e){}};
$('#pClose').onclick=()=>{PL.playing=false;stopAll();$('#player').hidden=true;};

function jpgB64(url,max){return new Promise(async(ok,no)=>{try{const bl=await (await fetch(url)).blob();const im=new Image();im.onload=()=>{const r=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*r);c.height=Math.round(im.naturalHeight*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.9).split(',')[1]);URL.revokeObjectURL(im.src);};im.onerror=()=>no(new Error('เปิดภาพคีย์ไม่ได้'));im.src=URL.createObjectURL(bl);}catch(e){no(e);}});}

function b64utf8(str){return btoa(unescape(encodeURIComponent(str)));}

async function sendToClaude(b){
  if(!botCfg().url)return toast('เชื่อมบอทเจนภาพก่อน (แท็บเจนภาพ)');
  const ping=await botApi('/api/ping');if(!ping.github)return toast('บอทยังไม่ได้ตั้ง GH_TOKEN / GH_REPO ใน Cloudflare');
  const dir='ep-'+String(ep.id).replace(/[^A-Za-z0-9]/g,'').slice(0,10);
  await signMedia();const m=ep.media||{},files=[];
  for(const k in m)for(const t of ['image','video','audio'])if(m[k]&&m[k][t]&&urls[m[k][t]])files.push({k,t,u:urls[m[k][t]],p:m[k][t]});
  const sent=[],total=files.length+1;let n=0,fail=0;b.disabled=true;
  for(const f of files){b.textContent=`กำลังส่ง ${n+1}/${total}…`;
    try{const bl=await (await fetch(f.u)).blob();if(bl.size>45e6){fail++;continue;}
      const ext=(f.p.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
      const name=(f.k==='char'?'char':'shot'+String(f.k).replace(/[^A-Za-z0-9]/g,'').padStart(2,'0'))+'-'+f.t+'.'+ext;
      await botApi('/api/push',{path:`${dir}/${name}`,b64:await blobB64(bl),message:`${ep.title}: ${name}`});sent.push({shot:f.k,type:f.t,file:name});n++;}
    catch(e){fail++;}}
  const {media,...info}=ep;
  const man={...info,exported_at:new Date().toISOString(),files:sent};
  b.textContent=`กำลังส่ง ${total}/${total}…`;
  await botApi('/api/push',{path:`${dir}/manifest.json`,b64:b64utf8(JSON.stringify(man,null,2)),message:`${ep.title}: manifest`});
  await botApi('/api/push',{path:'latest.json',b64:b64utf8(JSON.stringify({dir,title:ep.title,at:man.exported_at},null,2)),message:`latest: ${ep.title}`});
  b.disabled=false;b.textContent='📤 ส่งภาพและคลิปของตอนนี้ให้ Claude';
  toast(fail?`ส่งแล้ว ${n} ไฟล์ (ไม่สำเร็จ ${fail}) · บอก Claude ว่า "ส่งตอนแล้ว"`:`ส่งครบ ${n} ไฟล์ + บท · บอก Claude ในแชทว่า "ส่งตอนแล้ว"`);}

/* ================= คลังไอเดีย =================
   อัปโหลดไฟล์ → ขึ้นเป็นการ์ดปกเรียงกัน (ใหม่สุดอยู่บน)
   ไฟล์เก็บใน Supabase Storage: {uid}/ideas/  · รายการเก็บใน {uid}/ideas/index.json (ไม่ต้องสร้างตารางใหม่) */
const IDEA={list:null,busy:'',note:false};
const ideaDir=()=>`${user.id}/ideas`;
const ICOL=['#3a2a5c','#5c2a45','#2a4a5c','#2a5c46','#5c4a2a','#4a2a5c'];
const IICON={image:'🖼️',video:'🎞️',pdf:'📄',text:'📝',file:'📎'};
async function ideasLoad(){
  const {data,error}=await sb.storage.from(BUCKET).download(`${ideaDir()}/index.json`);
  if(error||!data){IDEA.list=IDEA.list||[];return;}
  try{const j=JSON.parse(await data.text());IDEA.list=Array.isArray(j)?j:[];}catch(e){IDEA.list=[];}
  const paths=[];IDEA.list.forEach(x=>{[x.path,x.cover].forEach(p=>{if(p&&!urls[p])paths.push(p);});});
  if(paths.length){const {data:d}=await sb.storage.from(BUCKET).createSignedUrls(paths,3600*6);(d||[]).forEach(o=>{if(o.signedUrl)urls[o.path]=o.signedUrl;});}}
async function ideasSave(){
  const bl=new Blob([JSON.stringify(IDEA.list)],{type:'application/json'});
  const {error}=await sb.storage.from(BUCKET).upload(`${ideaDir()}/index.json`,bl,{upsert:true,contentType:'application/json',cacheControl:'0'});
  if(error)throw new Error('บันทึกรายการไม่สำเร็จ: '+error.message);}
/* คลิปที่ Kaggle ทำเสร็จ โชว์ในคลังไอเดียด้วย (ไฟล์อยู่ที่บอท) */
function ideaBotVids(){const V=BOT.v;if(!V||!V.videos)return [];
  return V.videos.map(v=>({id:'v'+v.id,bot:v.id,title:`${v.project||'วิดีโอ'} · ช็อต ${v.shot}`,at:+v.created,type:'video',dur:v.w?5:0,src:botU('/vid/'+v.id)}));}
function ideaCard(x){if(x.bot)return `<button class="icard" data-idea="${esc(x.id)}"><div class="icov"><video src="${esc(x.src)}#t=1" muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:cover;display:block"></video><span class="ty">🎞️ บอท</span><span class="badge">0:05</span></div><b>${esc(x.title)}</b><small>${new Date(x.at).toLocaleDateString('th-TH',{day:'numeric',month:'short'})} · ทำโดย Kaggle</small></button>`;
  const cu=x.cover&&urls[x.cover],col=ICOL[(+String(x.id).slice(-3)||0)%ICOL.length];
  const d=new Date(x.at).toLocaleDateString('th-TH',{day:'numeric',month:'short'});
  const inner=cu?`<img loading="lazy" src="${esc(cu)}" alt="">`:`<div class="ph" style="background:${col}"><i>${IICON[x.type]||'📎'}</i>${x.text?`<p>${esc(x.text)}</p>`:`<p>${esc(x.title)}</p>`}</div>`;
  return `<button class="icard" data-idea="${esc(x.id)}"><div class="icov">${inner}${cu?`<span class="ty">${IICON[x.type]||''}</span>`:''}${x.dur?`<span class="badge">${fmtDur(x.dur)}</span>`:''}</div><b>${esc(x.title)}</b><small>${d}</small></button>`;}
const fmtDur=s=>{s=Math.round(+s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
async function renderIdeas(){
  if(!IDEA.list){$('#vw').innerHTML='<div class="card"><p class="muted" style="margin:0">กำลังโหลดคลังไอเดีย…</p></div>';await ideasLoad();if(view!=='ideas')return;}
  if(botCfg().url&&!IDEA.vfetched){IDEA.vfetched=true;try{BOT.v=await botApi('/api/vstate');}catch(e){}if(view!=='ideas')return;}
  const L=[...IDEA.list,...ideaBotVids()].sort((a,b)=>b.at-a.at);
  $('#vw').innerHTML=`<div class="card"><div class="row"><h2 style="margin-right:auto">คลังไอเดีย</h2>
      <label class="btn main" for="ideaFile">⬆️ อัปโหลด</label><button class="btn" data-inote>✏️ จด</button></div>
    <input type="file" id="ideaFile" multiple accept="image/*,video/*,application/pdf,.pdf,text/plain,.txt,.md" hidden>
    ${IDEA.busy?`<div class="report">${esc(IDEA.busy)}</div>`:''}
    <div id="inoteBox" ${IDEA.note?'':'hidden'} class="sec"><input type="text" id="inoteT" placeholder="ชื่อไอเดีย"><textarea id="inoteX" placeholder="แม่กับลูกดูหิมะครั้งสุดท้าย"></textarea><div><button class="btn ok" data-inotesave>บันทึก</button></div></div></div>
  ${L.length?`<div class="igrid">${L.map(ideaCard).join('')}</div>`:`<div class="card"><h3>เริ่มเก็บไอเดียแรก</h3><p class="muted" style="margin:0">อัปโหลดรูป คลิป PDF หรือจดเป็นข้อความ จะขึ้นเป็นการ์ดเรียงกันที่นี่</p></div>`}`;}

/* ทำภาพปก: รูป → ย่อเป็น JPG (แปลง HEIC ด้วย) · คลิป → เฟรมแรก + ความยาว */
function toJpg(src,max,q){const c=document.createElement('canvas');let w=src.videoWidth||src.naturalWidth||src.width,h=src.videoHeight||src.naturalHeight||src.height;
  const r=Math.min(1,max/Math.max(w,h));c.width=Math.round(w*r);c.height=Math.round(h*r);c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return new Promise(ok=>c.toBlob(b=>ok(b),'image/jpeg',q||.85));}
function loadImg(file){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('เปิดรูปไม่ได้'));i.src=URL.createObjectURL(file);});}
function videoThumb(file){return new Promise(ok=>{const v=document.createElement('video');let done=false;
  const fin=async(b)=>{if(done)return;done=true;ok({blob:b,dur:isFinite(v.duration)?v.duration:0});try{URL.revokeObjectURL(v.src);}catch(e){}};
  v.muted=true;v.playsInline=true;v.preload='auto';v.src=URL.createObjectURL(file);
  v.onloadeddata=()=>{try{v.currentTime=Math.min(0.5,(v.duration||1)/2);}catch(e){}};
  v.onseeked=async()=>{fin(v.videoWidth?await toJpg(v,600,.8):null);};
  v.onerror=()=>fin(null);setTimeout(()=>fin(null),12000);v.load();});}
async function upFile(path,blob,type){const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:type||undefined,upsert:true});if(error)throw new Error(error.message);}
async function ideasUpload(files){
  if(!IDEA.list)await ideasLoad();let ok=0,bad=0;
  for(let i=0;i<files.length;i++){const f=files[i];IDEA.busy=`กำลังอัปโหลด ${i+1}/${files.length} · ${f.name}`;renderIdeas();
    try{const isVid=/^video\//.test(f.type)||/\.(mp4|mov|m4v|webm)$/i.test(f.name||'');
      if(f.size>48*1024*1024&&!isVid)throw new Error('ใหญ่เกิน 48MB');
      const id=Date.now()+''+Math.floor(Math.random()*90+10),base=`${ideaDir()}/${id}`;
      const nm=(f.name||'ไอเดีย').replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim().slice(0,60)||'ไอเดีย';
      const ext=((f.name.split('.').pop()||'').toLowerCase().replace(/[^a-z0-9]/g,''))||'bin';
      const it={id,title:nm,at:Date.now(),type:'file'};
      if(/^image\//.test(f.type)||/^(heic|heif|jpe?g|png|webp|gif)$/.test(ext)){it.type='image';
        const im=await loadImg(f);const big=/heic|heif/.test(ext)||f.size>4e6?await toJpg(im,2560,.9):f;
        it.path=`${base}.${big===f?ext:'jpg'}`;await upFile(it.path,big,big===f?f.type:'image/jpeg');
        it.cover=`${base}-cover.jpg`;await upFile(it.cover,await toJpg(im,600,.82),'image/jpeg');}
      else if(/^video\//.test(f.type)||/^(mp4|mov|m4v|webm)$/.test(ext)){it.type='video';
        let vf=f,vext=ext,vtype=f.type||'video/mp4';
        if(f.size>45*1024*1024){
          vf=await shrinkVideo(f,p=>{IDEA.busy=`กำลังย่อวิดีโอ ${f.name} ${Math.round(p*100)}% (ใช้เวลาเท่าความยาวคลิป อย่าสลับแอป)`;renderIdeas();});
          vtype=vf.type.split(';')[0];vext=vtype.includes('webm')?'webm':'mp4';
          if(vf.size>48*1024*1024)throw new Error('ย่อแล้วยังเกิน 48MB ลองตัดคลิปให้สั้นลง');
          IDEA.busy=`กำลังอัปโหลด ${f.name} (${(vf.size/1048576).toFixed(1)} MB)`;renderIdeas();}
        it.path=`${base}.${vext}`;await upFile(it.path,vf,vtype);
        const t=await videoThumb(f);if(t.dur)it.dur=t.dur;if(t.blob){it.cover=`${base}-cover.jpg`;await upFile(it.cover,t.blob,'image/jpeg');}}
      else if(f.type==='application/pdf'||ext==='pdf'){it.type='pdf';it.path=`${base}.pdf`;await upFile(it.path,f,'application/pdf');}
      else if(/^text\//.test(f.type)||/^(txt|md)$/.test(ext)){it.type='text';it.text=(await f.text()).slice(0,4000);}
      else{it.path=`${base}.${ext}`;await upFile(it.path,f,f.type);}
      IDEA.list.push(it);await ideasSave();ok++;
    }catch(e){bad++;toast(`${f.name}: ${e.message||e}`);}}
  IDEA.busy='';await ideasLoad();renderIdeas();toast(bad?`อัปโหลดแล้ว ${ok} ไฟล์ · ไม่สำเร็จ ${bad}`:`เพิ่ม ${ok} ไอเดียแล้ว`);}
function ideaOpen(id){const x=[...IDEA.list,...ideaBotVids()].find(y=>String(y.id)===String(id));if(!x)return;const u=x.bot?x.src:x.path&&urls[x.path];
  let v=$('#iview');if(!v){v=document.createElement('div');v.id='iview';document.body.appendChild(v);}
  const body=x.type==='image'?`<img src="${esc(u)}" alt="">`:x.type==='video'?`<video src="${esc(u)}" controls playsinline autoplay></video>`:x.type==='text'?`<pre>${esc(x.text)}</pre>`:`<div class="card" style="text-align:center"><div style="font-size:48px">${IICON[x.type]||'📎'}</div><a class="btn main" href="${esc(u)}" target="_blank" rel="noopener">เปิดไฟล์</a></div>`;
  v.innerHTML=x.bot?`<div class="iv">${body}</div><div class="ib2"><b>${esc(x.title)}</b>
    <div class="row"><a class="btn sm" href="${esc(u)}" download="clip-${x.bot}.mp4" target="_blank" rel="noopener">ดาวน์โหลด</a><button class="btn sm" data-ivdel="${x.bot}">ลบ</button><span class="grow"></span><button class="btn sm main" data-iclose>ปิด</button></div></div>`:`<div class="iv">${body}</div><div class="ib2"><input type="text" id="ivT" value="${esc(x.title)}" aria-label="ชื่อไอเดีย">
    <div class="row"><button class="btn sm ok" data-isave="${esc(x.id)}">บันทึกชื่อ</button>${u?`<a class="btn sm" href="${esc(u)}" download target="_blank" rel="noopener">ดาวน์โหลด</a>`:''}<button class="btn sm" data-idel="${esc(x.id)}">ลบ</button><span class="grow"></span><button class="btn sm main" data-iclose>ปิด</button></div></div>`;
  v.hidden=false;}
function ideaClose(){const v=$('#iview');if(v){v.innerHTML='';v.hidden=true;}}
document.addEventListener('change',e=>{if(e.target.id==='ideaFile'&&e.target.files.length){const fs=[...e.target.files];e.target.value='';ideasUpload(fs);}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-idea],[data-inote],[data-inotesave],[data-isave],[data-idel],[data-iclose],[data-ivdel]');if(!b)return;
  try{
    if(b.dataset.ivdel){if(!sure(b,'กดอีกครั้งเพื่อลบ'))return;await botApi('/api/vdel',{id:+b.dataset.ivdel});BOT.v=await botApi('/api/vstate');ideaClose();renderIdeas();return toast('ลบคลิปแล้ว');}
    if(b.dataset.idea)return ideaOpen(b.dataset.idea);
    if(b.hasAttribute('data-iclose'))return ideaClose();
    if(b.hasAttribute('data-inote')){IDEA.note=!IDEA.note;$('#inoteBox').hidden=!IDEA.note;if(IDEA.note)$('#inoteX').focus();return;}
    if(b.hasAttribute('data-inotesave')){const tx=$('#inoteX').value.trim();if(!tx)return toast('พิมพ์ไอเดียก่อน');
      const ti=$('#inoteT').value.trim()||tx.split('\n')[0].slice(0,40);
      IDEA.list.push({id:Date.now()+'',title:ti,at:Date.now(),type:'text',text:tx.slice(0,4000)});await ideasSave();IDEA.note=false;renderIdeas();return toast('จดไอเดียแล้ว');}
    if(b.dataset.isave){const x=IDEA.list.find(y=>String(y.id)===b.dataset.isave);if(!x)return;x.title=($('#ivT').value.trim()||x.title).slice(0,60);await ideasSave();renderIdeas();return toast('บันทึกชื่อแล้ว');}
    if(b.dataset.idel){if(!sure(b,'กดอีกครั้งเพื่อลบ'))return;const x=IDEA.list.find(y=>String(y.id)===b.dataset.idel);if(!x)return;
      IDEA.list=IDEA.list.filter(y=>y!==x);await ideasSave();const rm=[x.path,x.cover].filter(Boolean);if(rm.length)sb.storage.from(BUCKET).remove(rm);
      ideaClose();renderIdeas();return toast('ลบแล้ว');}
  }catch(err){toast(String(err.message||err));}});

  return `<div class="bx${o.cls?' '+o.cls:''}" style="transform:translate3d(${x}px,${y}px,${z}px)"${o.id?` id="${o.id}"`:''}>`+

function imgToJpegB64(file,max){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const r=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*r);c.height=Math.round(im.naturalHeight*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);

function sfxClean(n){return n.replace(/\.[a-z0-9]+$/i,'').replace(/[_\-]+/g,' ').replace(/\s+/g,' ').trim().slice(0,80);}
function sfxMime(n){const e=(n.match(/\.([a-z0-9]+)$/i)||[])[1];return {ogg:'audio/ogg',mp3:'audio/mpeg',wav:'audio/wav',m4a:'audio/mp4',aac:'audio/aac',flac:'audio/flac'}[(e||'').toLowerCase()]||'';}
function u8b64(u){let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
async function unzipAll(file){const buf=new Uint8Array(await file.arrayBuffer()),dv=new DataView(buf.buffer),out=[];
  let e=buf.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('zip เสีย');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
  for(let i=0;i<n;i++){if(dv.getUint32(p,true)!==0x02014b50)break;const meth=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(buf.subarray(p+46,p+46+nl));p+=46+nl+el+cl;
    const base=name.split('/').pop();if(!base||name.endsWith('/')||name.startsWith('__MACOSX')||base.startsWith('.')||!sfxMime(base))continue;
    const lo=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true),raw=buf.subarray(lo,lo+csz);let data=raw;
    if(meth===8){data=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());}else if(meth!==0)continue;
    out.push({name:base,data});}
  return out;}

/* ---------- แผนทำมังงะ 3 วัน: เรียงช่องสำคัญก่อน แบ่งตามจำนวนต่อวันที่ตั้งไว้ ---------- */
const MGORDER=[2,3,4,5,7,8,6,9,11,13,14,15,17,18,19,20,21,22];
function mgPlanHtml(){
  if(!MG||!(MG.panels||[]).length)return '';
  const P=MG.panels,left=P.filter(x=>!x.image_id).map(x=>x.n),n=handN(),have=P.length-left.length;
  const ord=[...MGORDER.filter(k=>left.includes(k)),...left.filter(k=>!MGORDER.includes(k))];
  if(!ord.length)return `<div class="card"><h3>📖 แผนมังงะ</h3><p class="muted" style="margin:0">🎉 ครบ ${P.length} ช่องแล้ว พร้อมอ่านทั้งตอน</p></div>`;
  const days=[],d0=new Date(Date.now()+7*3600000),nm=['อา','จ','อ','พ','พฤ','ศ','ส'];
  for(let i=0;i<3;i++){const ch=ord.slice(i*n,i*n+n),d=new Date(d0.getTime()+i*86400000);if(!ch.length)break;
    days.push(`<div class="row" style="justify-content:space-between;align-items:flex-start"><b>${i===0?'วันนี้':i===1?'พรุ่งนี้':'มะรืน'} <span class="muted small">(${nm[d.getUTCDay()]} ${d.getUTCDate()}/${d.getUTCMonth()+1})</span></b><span class="small" style="text-align:right">ช่อง ${ch.join(', ')} <span class="muted">(${ch.length} ภาพ)</span></span></div>`);}
  const rest=ord.length-3*n,all=Math.ceil(ord.length/n);
  return `<div class="card"><div class="row" style="justify-content:space-between"><h3>📖 แผนมังงะ 3 วัน</h3><span class="muted small">มีภาพ ${have}/${P.length}</span></div>
  ${days.join('<hr style="border:0;border-top:1px solid #eee;margin:6px 0">')}
  <span class="muted small">ทำวันละ ${n} ภาพ ${rest>0?`หลัง 3 วันนี้ยังเหลืออีก ${rest} ช่อง จะครบในประมาณ ${all} วัน`:`ครบทั้งตอนภายใน ${all} วัน`} · เรียงช่องสำคัญของเรื่องก่อน ปรับจำนวนต่อวันได้ที่แท็บ 🎯 ภารกิจ (ภารกิจเด่นที่แนะนำ) วันไหนไม่ว่างก็ข้ามได้ ตารางเลื่อนตามเอง</span></div>`;}

  const img=(id,alt)=>id?`<img src="${esc(botU('/img/'+id))}" alt="${esc(alt)}" loading="lazy" data-bot="view" style="width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:8px;background:#eee">`:`<div style="width:100%;aspect-ratio:1;border-radius:8px;background:#f1eef9;display:flex;align-items:center;justify-content:center"><span class="spin"></span></div>`;
  return `<div class="card"><div class="row" style="justify-content:space-between"><h3>🎭 ห้องออดิชัน</h3><button class="btn sm" data-fkgo2="1">🎨 ${esc(stCur()[1])}</button></div><span class="muted small">แต่ละบทมีผู้สมัครที่หน้าตาและบุคลิกต่างกัน กด ⭐ เก็บเข้าคลัง คนที่ชอบ แล้วไปใส่บทในแท็บ 📚 คลังของเรา ทีหลัง ใส่บทแล้วภารกิจ "ชีตใหม่" จะได้พรอมต์ตรงกับนักแสดง ให้แนบรูปของเขาไปใน GPT</span><label class="muted">ผู้สมัครใหม่ทุกวันหลัง 07:00 รวม <select id="audDaily" style="width:auto">${[4,5,6,7,8].map(x=>`<option${x===(AUDS.daily||6)?' selected':''}>${x}</option>`).join('')}</select> คน (เฉพาะบทที่ยังไม่ได้เลือก)</label>${AUDS.err?`<div class="errl">⚠️ ${esc(AUDS.err)}</div>`:''}</div>`+
  (AUDS.roles||[]).map(R=>{const cs=(AUDS.cands||[]).filter(c=>c.role===R.key),ch=cs.find(c=>+c.kept);
    const body=(cs.length?`<div style="display:grid;grid-template-columns:1fr;gap:12px">`+cs.map(c=>`<div style="border:2px solid ${+c.kept?'#f5b301':'#e5e0f3'};border-radius:12px;padding:8px;background:${+c.kept?'#fffbea':'#fff'}">
      <div class="row" style="justify-content:space-between"><b>${+c.kept?'⭐ ':''}${esc(c.name)}</b><span class="muted small">อายุ ${c.age} · ${esc(String(c.traits).split(',').join(' · '))}</span></div>
      <div style="margin:6px 0;max-width:340px">${img(c.aud||c.card,c.name)}</div>
      <div class="small" style="font-style:italic;margin:4px 0">“${esc(c.intro)}”</div>
      ${c.cast_role?`<div class="small" style="margin:4px 0">🎬 รับบท <b>${esc(c.cast_role)}</b> ใน ${esc(c.cast_story||'')}</div>`:''}<div class="row"><button class="btn sm${+c.kept?'':' main'}" data-aud="keep|${c.id}"${c.pending?' disabled':''}>${+c.kept?'✅ อยู่ในคลังแล้ว':'⭐ เก็บเข้าคลัง'}</button><button class="btn sm" data-aud="del|${c.id}">🗑</button></div></div>`).join('')+`</div>`:'<p class="muted small" style="margin:6px 0">ยังไม่มีผู้สมัคร</p>')
      +`<div class="row" style="margin-top:8px"><button class="btn sm main" data-aud="gen|${esc(R.key)}">🔄 เรียกผู้สมัครเพิ่ม 4 คน</button></div>`;
    return det('aud|'+R.key,`🎬 ${esc(R.key)}<small>${esc(R.role)}${cs.length?` · ผู้สมัคร ${cs.length} คน`:''}${cs.filter(c=>+c.kept).length?` · เก็บแล้ว ${cs.filter(c=>+c.kept).length}`:''}</small>`,body,false);}).join('');}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-aud]');if(!b)return;const [a,v]=b.dataset.aud.split('|');
  try{b.disabled=true;
    if(a==='gen'){const r=await botApi('/api/vcastaud',{act:'gen',role:v,n:4});if(r.error)throw new Error(r.error);toast('เรียกผู้สมัครแล้ว ⏳ ภาพจะทยอยขึ้น (ราว 2 นาทีต่อภาพ)');}
    if(a==='keep'){await botApi('/api/vcastaud',{act:'keep',id:+v});}
    if(a==='del'){if(!sure(b,'กดอีกครั้งเพื่อลบ')){b.disabled=false;return;}await botApi('/api/vcastaud',{act:'del',id:+v});}
    await audLoad();}catch(err){toast(botErr(err));b.disabled=false;}});

document.addEventListener('change',async e=>{if(e.target.id!=='audDaily')return;try{await botApi('/api/vcastaud',{act:'daily',n:+e.target.value});toast('บันทึกแล้ว');}catch(err){toast(botErr(err));}});

/* ---------- สไตล์ลายเส้นกลาง (ใช้กับทุกอย่าง) ---------- */
const STYLES=[
 ['soft','🌸 นุ่มละเอียด','ลายเส้นบาง นุ่ม ผมแยกเส้น แสงนุ่มแบบภาพยนตร์ (แบบภาพสาวถือแก้วกาแฟ)','soft anime style, beautiful detailed anime illustration, delicate fine line art, detailed hair strands and fabric folds, soft cinematic lighting, gentle shading'],
 ['tv','📺 อนิเมะทีวีสีสด','เส้นคม ลงสีเซล สีอิ่ม สดใส แบบอนิเมะแฟนตาซีทีวี','bright colourful modern TV fantasy anime style, crisp clean line art, cel shading with soft gradients, vivid saturated colours, sparkling light'],
 ['film','🎬 อนิเมะภาพยนตร์','แสงเงาลึก ฉากหลังละเอียดแบบภาพวาด ท้องฟ้าสวย บรรยากาศอลังการ','cinematic anime film style, painterly highly detailed backgrounds, dramatic volumetric lighting, rich atmospheric colours, fine line art, emotional mood'],
 ['webtoon','📱 เว็บตูน','ลงสีพาสเทลนุ่ม เส้นบาง ตัวละครหน้าสวยหล่อ แบบเว็บตูนเกาหลี','korean webtoon style, soft pastel colouring, thin clean line art, pretty refined faces, airy light, gentle gradients'],
 ['dark','🌑 ดาร์กแฟนตาซี','เส้นหนักคม คอนทราสต์สูง เงาเข้ม แสงเรืองในที่มืด','dark fantasy anime style, bold sharp line art, high contrast, deep shadows, glowing rim light, gritty atmospheric detail'],
 ['chibi','🍡 จิบิน่ารัก','ตัวเตี้ย หัวโต ตาโตเงา สีหวาน ใช้กับฉากตลก','cute chibi anime style, super deformed proportions, big glossy eyes, soft pastel colours, rounded clean lines, playful'],
];
function stCur(){const st=(BOT.s&&BOT.s.settings)||{};return STYLES.find(x=>x[0]===st.style_preset)||(st.style?['custom','✏️ กำหนดเอง','ข้อความสไตล์ที่พิมพ์เอง',st.style]:STYLES[0]);}
function stFill(){const el=document.getElementById('stBox');if(!el)return;const c=stCur();
  el.innerHTML=`<h3>🎨 สไตล์ลายเส้น (ใช้กับทุกอย่าง)</h3><span class="muted small">เลือกครั้งเดียว ใช้กับภาพที่ระบบสร้าง (คลัง ออดิชัน ชุด ภาพร่าง) และพรอมต์ที่ให้ GPT (ชีตตัวละคร มังงะ ภารกิจ) รวมถึงงานที่ยังรอคิว ภาพที่เสร็จแล้วไม่เปลี่ยน</span>
  ${STYLES.map(x=>{const im=((BOT.s&&BOT.s.images)||[]).filter(i=>i.project==='ตัวอย่างสไตล์·'+x[0]).pop(),pend=((BOT.s&&BOT.s.jobs)||[]).some(j=>j.project==='ตัวอย่างสไตล์·'+x[0]);return `<div class="arow" style="border:2px solid ${c[0]===x[0]?'#8b5cf6':'transparent'};border-radius:10px">${im?`<img src="${esc(botU('/img/'+im.id))}" alt="${esc(x[1])}" loading="lazy" data-bot="view" style="width:100%;max-height:260px;object-fit:cover;border-radius:8px;margin-bottom:6px">`:pend?'<div class="row" style="margin-bottom:6px"><span class="spin"></span><span class="muted small">กำลังวาดภาพตัวอย่าง…</span></div>':''}<div class="row" style="justify-content:space-between"><b>${x[1]}</b>${c[0]===x[0]?'<span class="st done">ใช้อยู่</span>':`<button class="btn sm main" data-sty="${x[0]}">ใช้สไตล์นี้</button>`}</div><div class="muted small">${x[2]}</div></div>`;}).join('')}
  <span class="muted small">ปรับละเอียดเองได้ที่ช่อง "สไตล์" ในการ์ดตั้งค่าบอทด้านบน</span>`;}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-sty]');if(!b)return;const x=STYLES.find(q=>q[0]===b.dataset.sty);if(!x)return;
  try{b.disabled=true;await botApi('/api/settings',{style:x[3],style_preset:x[0]});await botLoad();const t=$('#bStyle');if(t)t.value=x[3];stFill();toast('เปลี่ยนสไตล์เป็น '+x[1]);}catch(err){toast(botErr(err));b.disabled=false;}});

document.addEventListener('click',e=>{if(!e.target.closest('[data-fkgo2]'))return;SV.gen='set';try{localStorage.setItem('ss_sv',JSON.stringify(SV));}catch(_){}const t=document.querySelector('#tabs [data-v=gen]');if(t)t.click();setTimeout(()=>{gpApply();const b=document.getElementById('stBox');if(b)b.scrollIntoView({behavior:'smooth'});},600);});

/* ---------- 📚 คลังของเรา: ของที่เก็บไว้ (⭐) แล้วค่อยหยิบใส่แต่ละเรื่อง ---------- */
let STY=null,STCUR=localStorage.getItem('ss_story')||'';
async function styLoad(){try{STY=await botApi('/api/vcaststory',{act:'list'});}catch(e){STY=STY||{stories:['สาเหตุที่ฉันรัก'],assets:[],err:botErr(e)};}
  if(!STCUR||!STY.stories.includes(STCUR))STCUR=STY.stories[0];if(view==='lib'&&SV.lib==='keep'){const y=window.scrollY;renderLib(true);window.scrollTo(0,y);}}
function imgCat(p){p=String(p||'');let m=p.match(/^คลัง·([^·]+)·/);if(m)return m[1];if(p.startsWith('✋·'))return 'ภาพจาก GPT';if(p.startsWith('ตัวอย่างสไตล์')||p.startsWith('ออดิชัน·')||p.startsWith('🗄️'))return '';return 'อื่นๆ';}
function keepHtml(){
  if(!botCfg().url)return '<div class="card"><p class="muted" style="margin:0">เชื่อมบอทในแท็บเจนภาพก่อน</p></div>';
  if(!STY){styLoad();return '<div class="card"><p class="muted" style="margin:0">กำลังเปิดคลัง…</p></div>';}
  if(!AUDS)audLoad();
  const S=BOT.s||{images:[]},st=STCUR,A=(STY.assets||[]).filter(a=>a.story===st),used=new Set(A.map(a=>+a.image_id));
  const roles=(AUDS&&AUDS.roles)||[],kept=((AUDS&&AUDS.cands)||[]).filter(c=>+c.kept),thumb=(id,h)=>id?`<img src="${esc(botU('/img/'+id))}" alt="" loading="lazy" data-bot="view" style="width:100%;height:${h||150}px;object-fit:cover;object-position:top;border-radius:8px">`:'<div style="height:120px;border-radius:8px;background:#f1eef9"></div>';
  const head=`<div class="card"><h3>📚 คลังของเรา</h3><span class="muted small">เก็บของที่ชอบไว้ก่อน (กด ⭐ ที่ภาพในแท็บโลก คลังภาพ หรือเก็บนักแสดงในห้องออดิชัน) แล้วค่อยหยิบมาใส่แต่ละเรื่อง ของชิ้นเดียวใช้ได้หลายเรื่อง</span>
   <div class="row" style="margin-top:6px"><label class="muted">เรื่อง <select id="stSel" style="width:auto">${STY.stories.map(x=>`<option${x===st?' selected':''}>${esc(x)}</option>`).join('')}</select></label><button class="btn sm" data-keep="newstory|0">➕ เรื่องใหม่</button></div>${STY.err?`<div class="errl">⚠️ ${esc(STY.err)}</div>`:''}</div>`;
  // นักแสดงในเรื่องนี้
  const castRows=roles.map(R=>{const c=kept.find(x=>x.cast_role===R.key&&x.cast_story===st);
    return `<div class="arow"><div class="row" style="justify-content:space-between"><b>${esc(R.key)}</b><span class="muted small">${esc(R.role)}</span></div>${c?`<div class="row" style="gap:8px;align-items:center"><div style="width:70px">${thumb(c.aud||c.card,90)}</div><span>🎭 ${esc(c.name)}</span><button class="btn sm" data-keep="unassign|${c.id}">เอาออก</button></div>`:`<span class="muted small">ยังไม่มีนักแสดง</span>`}
      ${kept.length?`<div class="row"><select class="kRole" data-role="${esc(R.key)}" style="width:auto;max-width:60%"><option value="">เลือกนักแสดงจากคลัง…</option>${kept.map(k=>`<option value="${k.id}">${esc(k.name)}${k.cast_role?` (บท ${esc(k.cast_role)})`:''}</option>`).join('')}</select><button class="btn sm main" data-keep="assign|${esc(R.key)}">ใส่บท</button></div>`:''}</div>`;}).join('');
  const castSec=det('kp|cast',`🎬 นักแสดงในเรื่องนี้ <span class="dn">${kept.filter(c=>c.cast_story===st).length}/${roles.length}</span>`,castRows+(kept.length?'':'<p class="muted small">ยังไม่มีนักแสดงในคลัง ไปกด ⭐ เก็บเข้าคลัง ในห้องออดิชันก่อน</p>'),true);
  const actorSec=det('kp|actors',`🎭 นักแสดงในคลัง <span class="dn">${kept.length}</span>`,kept.length?`<div class="wgrid">${kept.map(c=>`<div class="witem">${thumb(c.aud||c.card)}<b>${esc(c.name)}</b><span class="muted small">อายุ ${c.age}${c.cast_role?` · บท ${esc(c.cast_role)}`:''}</span><button class="btn sm" data-aud="keep|${c.id}">เอาออกจากคลัง</button></div>`).join('')}</div>`:'<p class="muted small">ยังไม่มี</p>');
  // ของที่ติดดาว แยกหมวด
  const starred=(S.images||[]).filter(i=>+i.starred&&imgCat(i.project)),cats={};
  starred.forEach(i=>{const c=imgCat(i.project);(cats[c]=cats[c]||[]).push(i);});
  const itemSecs=Object.entries(cats).map(([c,L])=>det('kp|c|'+c,`⭐ ${esc(c)} <span class="dn">${L.length}</span><small>ใช้ในเรื่องนี้ ${L.filter(i=>used.has(i.id)).length}</small>`,`<div class="wgrid">${L.map(i=>{const a=A.find(x=>+x.image_id===i.id);const nm=String(i.project).replace(/^คลัง·[^·]+·/,'').replace(/^✋·/,'');
      return `<div class="witem">${thumb(i.id)}<b class="small">${esc(nm)}</b>${a?`<button class="btn sm" data-keep="del|${a.id}">✓ ใช้แล้ว · เอาออก</button>`:`<button class="btn sm main" data-keep="add|${i.id}|${esc(c)}|${esc(nm.slice(0,50))}">➕ ใช้ในเรื่อง</button>`}</div>`;}).join('')}</div>`)).join('');
  const none=starred.length?'':'<div class="card"><p class="muted" style="margin:0">ยังไม่มีของที่ติดดาว กด ⭐ ที่ภาพในแท็บ 🌌 โลก หรือ เจนภาพ → คลังภาพ แล้วจะมาแสดงที่นี่</p></div>';
  return head+`<div class="card">${castSec}${actorSec}</div>`+(starred.length?`<div class="card"><h3>⭐ ของที่เก็บไว้</h3>${itemSecs}</div>`:none);}
document.addEventListener('change',e=>{if(e.target.id==='stSel'){STCUR=e.target.value;localStorage.setItem('ss_story',STCUR);renderLib(true);}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-keep]');if(!b)return;const [a,v,c,l]=b.dataset.keep.split('|');
  try{b.disabled=true;
    if(a==='newstory'){const n=prompt('ชื่อเรื่องใหม่');if(!n){b.disabled=false;return;}await botApi('/api/vcaststory',{act:'newstory',name:n});STCUR=n.trim();localStorage.setItem('ss_story',STCUR);}
    if(a==='add')await botApi('/api/vcaststory',{act:'add',story:STCUR,image_id:+v,cat:c,label:l||''});
    if(a==='del')await botApi('/api/vcaststory',{act:'del',id:+v});
    if(a==='assign'){const sel=document.querySelector(`.kRole[data-role="${CSS.escape(v)}"]`);if(!sel||!sel.value){toast('เลือกนักแสดงก่อน');b.disabled=false;return;}
      const r=await botApi('/api/vcastaud',{act:'pick',id:+sel.value,role:v,story:STCUR});if(r.error)throw new Error(r.error);toast('ใส่บทแล้ว ภารกิจชีตใหม่อัปเดตพรอมต์ให้แล้ว');HAND=null;}
    if(a==='unassign')await botApi('/api/vcastaud',{act:'unassign',id:+v});
    await Promise.all([styLoad(),audLoad()]);}catch(err){toast(botErr(err));b.disabled=false;}});

new MutationObserver(()=>{document.querySelectorAll('.seg').forEach(n=>{const on=n.querySelector('button.on');if(on&&!n.dataset.sc){n.dataset.sc='1';const l=on.offsetLeft-n.clientWidth/2+on.clientWidth/2;if(l>0)n.scrollLeft=l;}});}).observe(document.body,{childList:true,subtree:true});
boot();
})();
</script>
