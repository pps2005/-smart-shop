<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>สตูดิโอ · SMART SHOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600&family=Sarabun:wght@400;600&display=swap">
<style>
:root{
  --bg:#0E0B14; --card:rgba(30,24,40,.92); --card2:#1b1626; --line:rgba(220,200,255,.14);
  --ink:#F4EFFA; --muted:#A99FBC; --acc:#FF8FB1; --acc2:#8FD3FF; --you:#FFC24B; --ok:#4ADE80; --red:#FF6B7A; --todo:#7d7590;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,system-ui,sans-serif;font-size:17px;line-height:1.55}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:Kanit,Sarabun,sans-serif;font-weight:600;margin:0;line-height:1.3}
h2{font-size:21px}h3{font-size:17px}
a{color:var(--acc2)}
/* header */
#top{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 70%,rgba(14,11,20,0));padding:calc(8px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left));display:grid;gap:8px}
.bar{display:flex;align-items:center;gap:10px}
.logo{font-family:Kanit,sans-serif;font-size:20px;display:flex;gap:8px;align-items:center}
.logo i{font-style:normal;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#ff8fb1,#8f7bff)}
.grow{flex:1}
.ib{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);display:inline-grid;place-items:center;text-decoration:none;color:var(--ink);font-size:18px;cursor:pointer}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{border:0;background:none;padding:8px 4px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;min-height:44px;white-space:nowrap}
.tabs button.on{background:#2e2540;color:var(--ink)}
.tabs b{font-size:12px;background:var(--you);color:#1d1400;border-radius:999px;padding:0 6px;margin-left:3px}
main{max-width:1000px;margin:0 auto;padding:4px max(12px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;min-width:0}
.muted{color:var(--muted)}.small{font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:#2a2238;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn.main{background:linear-gradient(135deg,#ff7aa8,#8f7bff);border-color:transparent;color:#fff}
.btn.ok{background:#16a34a;border-color:#16a34a;color:#fff}
.btn.sm{min-height:38px;padding:5px 12px;font-size:15px}
.btn:disabled{opacity:.6}
textarea,input[type=text],input[type=email],input[type=password],select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#141019}
textarea{min-height:90px;resize:vertical}
input[type=number]{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#141019}
.lab{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.sec{display:grid;gap:8px}
.report{border-left:3px solid var(--acc2);padding:6px 10px;background:rgba(143,211,255,.07);border-radius:0 10px 10px 0}
.mem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.04)}
.mem b{display:block;line-height:1.25}.mem small{color:var(--muted);display:block}
.mem .on{margin-left:auto;font-size:13px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}

/* ===== ห้องสตูดิโอ ===== */
.room{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:4/3.3;border:1px solid var(--line);
  background:radial-gradient(120% 70% at 50% 0%,#3a2a52 0%,#1d1529 55%,#120d1a 100%)}
@media (min-width:760px){.room{aspect-ratio:16/8}}
.room .wall{position:absolute;inset:0 0 28% 0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 60px)}
.room .floor{position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(#2a1f36,#160f1f);border-top:2px solid rgba(255,200,230,.08)}
.room .rug{position:absolute;left:18%;right:18%;bottom:4%;height:12%;border-radius:50%;background:radial-gradient(#4a2f55,#2b1d36);opacity:.8}
.room .win{position:absolute;left:4%;top:8%;width:17%;height:40%;border-radius:10px;border:3px solid #4a3a5f;background:linear-gradient(#0b1530,#1f2c55);overflow:hidden}
.room .win::after{content:'';position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.6px);background-size:14px 14px;opacity:.55;animation:snow 6s linear infinite}
@keyframes snow{to{background-position:6px 70px}}
.room .shelf{position:absolute;right:4%;top:12%;width:16%;display:grid;gap:6px}
.room .shelf div{height:6px;border-radius:3px;background:#4a3a5f}
.room .shelf span{font-size:clamp(14px,3vw,24px);line-height:1}
.room .onair{position:absolute;left:50%;top:3.5%;transform:translateX(-50%);font-family:Kanit,sans-serif;font-size:clamp(11px,2.4vw,15px);letter-spacing:.12em;padding:2px 12px;border-radius:8px;border:2px solid #5a4870;color:#7a6890;background:#1a1323}
.room .onair.live{color:#fff;background:#e0245e;border-color:#ff7aa8;box-shadow:0 0 18px #ff3d7f;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 6px #ff3d7f}}
.room .screen{position:absolute;left:50%;top:12%;transform:translateX(-50%);height:62%;aspect-ratio:9/16;background:#05030a;border:6px solid #2b2238;border-radius:12px;box-shadow:0 0 0 2px #463a58,0 0 40px rgba(143,123,255,.35);overflow:hidden;display:grid;place-items:center}
.room .screen video{width:100%;height:100%;object-fit:cover;display:block}
.room .screen .idle{color:var(--muted);font-size:13px;text-align:center;padding:10px}
.room .desk{position:absolute;left:24%;right:24%;bottom:13%;height:7%;border-radius:8px 8px 4px 4px;background:linear-gradient(#5a3f3a,#3a2826)}
.room .lamp{position:absolute;left:27%;bottom:20%;font-size:clamp(16px,4vw,28px)}
.room .mic{position:absolute;right:28%;bottom:20%;font-size:clamp(16px,4vw,28px)}
.room .plant{position:absolute;left:6%;bottom:10%;font-size:clamp(22px,6vw,44px)}
.room .cam{position:absolute;right:7%;bottom:10%;font-size:clamp(22px,6vw,44px)}
.room .cap{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;font-size:14px;background:linear-gradient(transparent,rgba(0,0,0,.65));text-align:center}

/* progress */
.pbar{height:12px;border-radius:999px;background:#2a2238;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#ff7aa8,#8f7bff);border-radius:999px;transition:width .4s}
.big{font-family:Kanit,sans-serif;font-size:26px;line-height:1.2}
.stages{display:grid;gap:8px}
.stage{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid transparent}
.stage .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:#2a2238}
.stage b{display:block;line-height:1.25}.stage small{color:var(--muted);display:block;line-height:1.35}
.st{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st.done{background:rgba(74,222,128,.15);color:var(--ok)}
.st.doing{background:rgba(143,211,255,.15);color:var(--acc2)}
.st.you{background:rgba(255,194,75,.18);color:var(--you)}
.st.todo{background:rgba(255,255,255,.06);color:var(--todo)}
.stage.you{border-color:rgba(255,194,75,.45);background:rgba(255,194,75,.06)}
.stage.doing{border-color:rgba(143,211,255,.3)}

/* stories */
.epcard{display:grid;gap:8px;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.subtabs{display:flex;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto}
.subtabs button{border:0;background:none;padding:8px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap;min-height:40px}
.subtabs button.on{background:#2e2540;color:var(--ink)}
.prompt{background:#141019;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.prompt code{font-family:ui-monospace,Menlo,monospace;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.prompt .k{font-size:13px;font-weight:600;color:var(--muted)}
details.more summary{cursor:pointer;color:var(--muted);font-size:14px;padding:4px 0}
.shot{border:1px solid var(--line);border-radius:16px;overflow:hidden;display:grid;grid-template-columns:58px minmax(0,1fr);background:rgba(255,255,255,.03)}
.shot .no{display:grid;align-content:start;justify-items:center;gap:2px;padding:12px 4px;border-right:1px solid var(--line)}
.shot .no b{font-family:Kanit,sans-serif;font-size:24px}
.shot .bd{padding:12px;display:grid;gap:8px;min-width:0}
.shot.now{border-color:var(--acc)}
.media{display:flex;gap:10px;flex-wrap:wrap}
.slot{width:110px;aspect-ratio:9/16;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;font-size:13px;color:var(--muted);overflow:hidden;cursor:pointer;padding:6px}
.slot.wide{width:100%;max-width:340px;aspect-ratio:auto;min-height:70px}
.slot img,.slot video{width:100%;height:100%;object-fit:cover}
.slot audio{width:100%}
.stp{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(255,194,75,.15);color:var(--you)}
.stp.approved,.stp.posted{background:rgba(74,222,128,.15);color:var(--ok)}
.stp.revise{background:rgba(255,107,122,.15);color:var(--red)}
.howto{margin:0;padding-left:22px;display:grid;gap:4px}

/* bot */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.bimg{border:2px solid transparent;border-radius:12px;overflow:hidden;background:#000;display:grid;align-content:start}
.bimg.star{border-color:var(--you)}
.bimg img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:zoom-in}
.bimg .bb{display:flex;gap:4px;padding:4px;flex-wrap:wrap;justify-content:space-between;background:#141019}
.bimg .bb button{min-height:34px;padding:2px 9px;border-radius:9px;border:1px solid var(--line);background:#2a2238;cursor:pointer;font-size:14px}
.bimg .bb .use{flex:1 1 100%;background:#16a34a;border-color:#16a34a;color:#fff;font-weight:600}
.botthumbs:empty{display:none}.botthumbs{display:grid;gap:6px}
#bview{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.9);display:grid;place-items:center;padding:16px}
#bview img{max-width:100%;max-height:88vh;border-radius:12px}

/* player */
#player{position:fixed;inset:0;background:#000;z-index:40;display:grid;grid-template-rows:1fr auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.stg{position:relative;margin:auto;height:100%;max-height:calc(100vh - 130px);aspect-ratio:9/16;max-width:100vw;overflow:hidden;background:#111;border-radius:8px}
.stg img,.stg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stg img.kb{animation:kb 6s ease-out forwards}@keyframes kb{to{transform:scale(1.12)}}
.stg .sk{position:absolute;inset:0;display:grid;align-content:center;gap:12px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 40%,#2a1f3d,#0b0810)}
.stg .ost{position:absolute;left:8%;right:8%;top:16%;text-align:center;font-family:Kanit,sans-serif;font-size:26px;color:#fff;text-shadow:0 0 4px #000,0 2px 6px #000}
.stg .sub{position:absolute;left:6%;right:6%;bottom:9%;text-align:center;font-size:17px;color:#fff;text-shadow:0 0 4px #000,0 1px 4px #000}
.ctrl{display:flex;gap:8px;justify-content:center;align-items:center;padding:10px;flex-wrap:wrap}
.prog{flex:1;max-width:420px;height:6px;border-radius:3px;background:#333;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--acc)}

#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:70;background:#2e2540;border:1px solid var(--line);border-radius:14px;padding:10px 16px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header id="top">
  <div class="bar">
    <a class="ib" href="index.html" aria-label="กลับหน้าร้าน">←</a>
    <div class="logo"><i>🎬</i><span>สตูดิโอ</span></div>
    <span class="grow"></span>
    <span class="chip" id="liveChip"><span class="dot"></span><span id="liveT">กำลังโหลด…</span></span>
  </div>
  <nav class="tabs" id="tabs">
    <button data-v="studio" class="on">สตูดิโอ</button>
    <button data-v="eps">เรื่อง<b id="youN" hidden>0</b></button>
    <button data-v="gen">เจนภาพ</button>
    <button data-v="set">ตั้งค่า</button>
  </nav>
</header>
<main id="vw"></main>

<div id="player" hidden>
  <div class="stg" id="stage"></div>
  <div>
    <div class="ctrl"><div class="prog"><i id="progBar"></i></div><span id="progT" style="color:#ccc;font-size:14px"></span></div>
    <div class="ctrl"><button class="btn sm" id="pPrev">ช็อตก่อน</button><button class="btn sm main" id="pPlay">หยุด</button><button class="btn sm" id="pNext">ช็อตถัดไป</button><button class="btn sm" id="pVoice">เสียงอ่าน: เปิด</button><button class="btn sm" id="pClose">ปิด</button></div>
  </div>
</div>
<div id="login" hidden><form class="card" id="loginForm" style="width:min(420px,100%)">
  <h2>เข้าสู่ระบบสตูดิโอ</h2><p class="muted" style="margin:0">ใช้อีเมลและรหัสผ่านเดียวกับหน้าหลัก SMART SHOP</p>
  <input type="email" id="em" placeholder="อีเมล" autocomplete="username" required>
  <input type="password" id="pw" placeholder="รหัสผ่าน" autocomplete="current-password" required>
  <button class="btn main" type="submit">เข้าสู่ระบบ</button><p class="muted" id="loginErr" style="margin:0"></p></form></div>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';
/* ================= พื้นฐาน ================= */
const sb=window.supabase.createClient('https://tnfjosnpjjrmyxshfzlz.supabase.co','sb_publishable_UnlipRW9A797QdkeNpixug_goq2D5-8',{auth:{persistSession:true,autoRefreshToken:true}});
const BUCKET='studio-media';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null,eps=[],ep=null,epTab='overview',urls={},view='studio',claudeTasks=[],curId=null,screenKey='';
try{curId=localStorage.getItem('ss_curep');}catch(e){}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200);}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('คัดลอกแล้ว');}catch(e){toast('คัดลอกไม่ได้ ให้กดค้างที่ข้อความแล้วเลือกคัดลอก');}}
function copyBox(k,t){return t?`<div class="prompt"><span class="k">${esc(k)}</span><code>${esc(t)}</code><div><button class="btn sm" data-copy="${esc(t)}">คัดลอก</button></div></div>`:'';}
const EPST={draft:'ฉบับร่าง',revise:'รอ Claude แก้',approved:'อนุมัติแล้ว',posted:'โพสต์แล้ว'};
const fmtS=s=>{s=Math.round(+s||0);return s>=60?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')} นาที`:`${s} วิ`;};

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('#login').hidden=false;return;}
  user=session.user;$('#login').hidden=true;
  await refresh();render();
  setInterval(()=>{if(!document.hidden)refresh(true);},20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh(true);});
}
$('#loginForm').onsubmit=async e=>{e.preventDefault();
  const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error){$('#loginErr').textContent='เข้าสู่ระบบไม่สำเร็จ ตรวจอีเมลและรหัสผ่านอีกครั้ง';return;}boot();};

async function refresh(quiet){
  const [e,t]=await Promise.all([
    sb.from('studio_episodes').select('*').order('created_at',{ascending:false}),
    sb.from('studio_tasks').select('*').eq('team','brain').order('created_at',{ascending:false}).limit(6)
  ]);
  if(e.error){if(!quiet)toast('โหลดข้อมูลไม่สำเร็จ');return;}
  eps=e.data||[];claudeTasks=t.data||[];
  if(!curId||!eps.some(x=>x.id===curId))curId=eps[0]&&eps[0].id;
  if(ep){const f=eps.find(x=>x.id===ep.id);if(f)ep=f;}
  await signAll();header();
  if(quiet){if(view==='studio')renderStudio(true);else if(view==='eps'&&!ep)renderEpList();}
}
/* signed URL ของไฟล์ทุกตอน (ใช้ทั้งจอฉายและหน้าตอน) */
async function signAll(){const paths=[];eps.forEach(e=>{const m=e.media||{};for(const k in m)for(const t in m[k])if(m[k][t])paths.push(m[k][t]);});
  const need=paths.filter(p=>!urls[p]);if(!need.length)return;
  const {data}=await sb.storage.from(BUCKET).createSignedUrls(need,3600*6);(data||[]).forEach(d=>{if(d.signedUrl)urls[d.path]=d.signedUrl;});}
async function signMedia(){await signAll();}
function mUrlOf(e,k,t){const p=e.media&&e.media[k]&&e.media[k][t];return p?urls[p]:null;}
function mUrl(k,t){return ep?mUrlOf(ep,k,t):null;}

/* ================= ความคืบหน้า ================= */
function prog(e){const S=e.shots||[],m=e.media||{},N=S.length;
  const total=S.reduce((a,s)=>a+(+s.sec||0),0);
  const img=S.filter(s=>m[String(s.n)]&&m[String(s.n)].image).length;
  const vidS=S.filter(s=>m[String(s.n)]&&m[String(s.n)].video);
  const vid=vidS.length,doneSec=vidS.reduce((a,s)=>a+(+s.sec||0),0);
  const voice=!!(m.voice&&(m.voice.audio||m.voice.video)),final=!!(m.final&&m.final.video);
  const nowIdx=S.findIndex(s=>!(m[String(s.n)]&&m[String(s.n)].video));
  const ok=e.status==='approved'||e.status==='posted';
  const st=[];
  st.push(N?(e.status==='draft'?{k:'you',t:'รอคุณอ่านและอนุมัติ'}:e.status==='revise'?{k:'doing',t:'Claude กำลังแก้ตามที่สั่ง'}:{k:'done',t:`${N} ช็อต · ${fmtS(total)}`}):{k:'doing',t:'Claude กำลังเขียนบท'});
  st.push(!N?{k:'todo',t:'รอบท'}:img===N?{k:'done',t:`ครบ ${N} ช็อต`}:img?{k:'doing',t:`${img}/${N} ช็อต · บอทกำลังเจน`}:ok?{k:'you',t:'กด "ให้บอทเจนภาพทุกช็อต" ในหน้าเรื่อง'}:{k:'todo',t:'รออนุมัติบท'});
  st.push(!N?{k:'todo',t:'รอบท'}:vid===N?{k:'done',t:`ครบ ${N} ช็อต · ${fmtS(total)}`}:vid?{k:'doing',t:`${vid}/${N} ช็อต · ${fmtS(doneSec)} จาก ${fmtS(total)}`}:img?{k:'doing',t:'รอทำวิดีโอจากภาพคีย์'}:{k:'todo',t:'รอภาพคีย์'});
  st.push(voice?{k:'done',t:'อัปโหลดเสียงพากย์แล้ว'}:ok?{k:'you',t:'ให้ GPT อ่านบทแล้วอัปโหลดเสียง'}:{k:'todo',t:'รออนุมัติบท'});

  const media={...(ep.media||{})},old=media[k]&&media[k][ty];media[k]={...(media[k]||{}),[ty]:path};

  if(b.dataset.goep)return openEp(b.dataset.goep,b.dataset.tab);
  if(b.dataset.open)return openEp(b.dataset.open);
  if(b.dataset.eptab){epTab=b.dataset.eptab;return renderEp();}
  if(b.hasAttribute('data-cmd')){const v=($('#cmd').value||'').trim();if(!v)return toast('พิมพ์คำสั่งก่อน');
    const {error}=await sb.from('studio_tasks').insert({team:'brain',title:v.slice(0,200),detail:v.length>200?v:null,status:'todo',sort:999});
    if(error)return toast('ส่งไม่สำเร็จ');$('#cmd').value='';toast('ส่งแล้ว ไปบอก Claude ในแชทว่า "ทำงานในสตูดิโอ"');await refresh(true);return;}
  const a=b.dataset.act;if(!a)return;
  if(a==='eplist'){ep=null;return renderEpList();}
  if(a==='play')return startPlayer();
  if(a==='logout'){await sb.auth.signOut();location.reload();return;}
  if(a==='feedback'){const t=$('#fb').value.trim();if(!t)return toast('พิมพ์สิ่งที่อยากให้แก้ก่อน');return saveEp({feedback:t,feedback_at:new Date().toISOString(),status:'revise'},'ส่งแล้ว บอก Claude ในแชทว่า "ทำงานในสตูดิโอ"');}
  if(a==='approve'){if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='กดอีกครั้งเพื่อยืนยัน';setTimeout(()=>{if(b.isConnected){b.dataset.sure='';b.textContent='✓ อนุมัติบท';}},4000);return;}
    return saveEp({status:'approved',approved_at:new Date().toISOString()},'อนุมัติบทแล้ว');}
  if(a==='posted')return saveEp({status:'posted'},'บันทึกว่าโพสต์แล้ว');});

/* ================= ฉบับร่าง (เล่นช็อตเรียงกัน) ================= */
const PL={i:0,playing:false,voice:true,timer:null,t0:0,dur:0,raf:null};
function stopAll(){clearTimeout(PL.timer);cancelAnimationFrame(PL.raf);try{speechSynthesis.cancel();}catch(e){}const v=$('#stage video');if(v)v.pause();}
function startPlayer(){PL.i=0;PL.playing=true;$('#player').hidden=false;$('#pPlay').textContent='หยุด';showShot();}
function showShot(){stopAll();const S=ep.shots||[];if(PL.i>=S.length){PL.playing=false;$('#pPlay').textContent='เล่นใหม่';$('#progT').textContent='จบฉบับร่าง';return;}
  const s=S[PL.i],k=String(s.n),vid=mUrl(k,'video'),img=mUrl(k,'image');
  $('#stage').innerHTML=(vid?`<video src="${vid}" autoplay muted playsinline></video>`:img?`<img class="kb" src="${img}" alt="">`:`<div class="sk"><div class="muted">ช็อต ${esc(s.n)}${s.shot?' · '+esc(s.shot):''}</div><div>${esc(s.action)}</div><div class="muted small">ยังไม่มีภาพ</div></div>`)+(s.text?`<div class="ost">${esc(s.text)}</div>`:'')+(s.narration?`<div class="sub">${esc(s.narration)}</div>`:'');
  PL.dur=(+s.sec||2)*1000;PL.t0=performance.now();
  if(PL.voice&&s.narration&&'speechSynthesis' in window){try{const u=new SpeechSynthesisUtterance(s.narration);u.lang='th-TH';const tv=speechSynthesis.getVoices().find(x=>/^th/i.test(x.lang));if(tv)u.voice=tv;u.rate=1.1;speechSynthesis.speak(u);}catch(e){}}
  const tick=()=>{const el=performance.now()-PL.t0;$('#progBar').style.width=((PL.i+Math.min(1,el/PL.dur))/S.length*100)+'%';$('#progT').textContent=`ช็อต ${s.n} · ${(el/1000).toFixed(1)}/${s.sec} วิ`;if(PL.playing)PL.raf=requestAnimationFrame(tick);};tick();
  if(PL.playing)PL.timer=setTimeout(()=>{PL.i++;showShot();},PL.dur);}
$('#pPlay').onclick=()=>{if(PL.playing){PL.playing=false;stopAll();$('#pPlay').textContent='เล่นต่อ';}else{if(PL.i>=(ep.shots||[]).length)PL.i=0;PL.playing=true;$('#pPlay').textContent='หยุด';showShot();}};
$('#pNext').onclick=()=>{PL.i=Math.min(PL.i+1,(ep.shots||[]).length-1);showShot();};
$('#pPrev').onclick=()=>{PL.i=Math.max(PL.i-1,0);showShot();};
$('#pVoice').onclick=()=>{PL.voice=!PL.voice;$('#pVoice').textContent='เสียงอ่าน: '+(PL.voice?'เปิด':'ปิด');if(!PL.voice)try{speechSynthesis.cancel();}catch(e){}};
$('#pClose').onclick=()=>{PL.playing=false;stopAll();$('#player').hidden=true;};

// ตั้งลิงก์บอท + รหัสผ่านครั้งเดียว เก็บใน localStorage 'ss_imgbot' (ต่อเครื่อง)
const BOT={s:null,err:'',star:false,proj:'',filled:false};
const tTH=ms=>new Date(+ms).toLocaleString('th-TH',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'});
function botCfg(){try{return JSON.parse(localStorage.getItem('ss_imgbot')||'{}')||{};}catch(e){return {};}}
function botSave(c){try{localStorage.setItem('ss_imgbot',JSON.stringify(c));}catch(e){}}
function botU(p){const c=botCfg();return String(c.url||'').replace(/\/+$/,'')+p+(p.includes('?')?'&':'?')+'k='+encodeURIComponent(c.key||'');}
function botErr(e){const m=String(e&&e.message||e);return /failed to fetch|load failed|networkerror|network request/i.test(m)?'ติดต่อบอทไม่ได้ ตรวจลิงก์บอท หรือบอทยังไม่ได้ deploy':m;}
async function botApi(p,body){
  const r=await fetch(botU(p),body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{});
  if(r.status===401)throw new Error('รหัสผ่านบอทไม่ถูกต้อง');
  const j=await r.json().catch(()=>({error:'บอทตอบกลับไม่ถูกต้อง (ลิงก์ถูกไหม?)'}));
  if(!r.ok||j.error)throw new Error(j.error||('HTTP '+r.status));return j;}
async function botLoad(){if(!botCfg().url)return;
  try{BOT.s=await botApi('/api/state');BOT.err='';}catch(e){BOT.err=botErr(e);}
  if(view==='gen'){if($('#botStat'))botParts();else renderGen();}
  if(view==='eps'&&ep)botThumbsFill();}
setInterval(()=>{if(document.hidden||!botCfg().url)return;
  if(view==='gen'||(view==='eps'&&ep&&(epTab==='shots'||epTab==='overview')))botLoad();},20000);
function epBotProject(){return String(ep&&ep.title||'ตอน').slice(0,50);}
function botBtn(a,n,label,main){return botCfg().url?`<div><button class="btn sm${main?' main':''}" data-bot="${a}" data-n="${esc(n)}">${label}</button></div>`:`<div><button class="btn sm" data-bot="gotogen">🎨 เชื่อมบอทเจนภาพก่อน</button></div>`;}
function botCard(i,useK){return `<div class="bimg${i.starred?' star':''}"><img loading="lazy" src="${esc(botU('/img/'+i.id))}" alt="ภาพ ${i.id}" data-bot="view">
  <div class="bb"><button data-bot="star" data-id="${i.id}" aria-label="เลือก">${i.starred?'⭐':'☆'}</button><button data-bot="regen" data-id="${i.id}" aria-label="เจนใหม่">🔁</button><button data-bot="del" data-id="${i.id}" aria-label="ลบ">🗑</button>
  ${useK!==undefined?`<button class="use" data-use="${esc(useK)}|${i.id}|${i.starred?1:0}">ใช้ภาพนี้</button>`:''}</div></div>`;}

function renderGen(){const c=botCfg();BOT.filled=false;

    <input type="text" id="botUrl" placeholder="https://anime-image-bot.xxxx.workers.dev" autocapitalize="off" autocomplete="off" spellcheck="false">

    <div><button class="btn main" data-bot="enqueue">เพิ่มเข้าคิว</button></div>
    <p class="muted" style="margin:0">มีตอนที่ Claude เขียนแล้ว? เปิดแท็บ "ตอน" → "ช็อตและ prompt" แล้วกด "ให้บอทเจนภาพทุกช็อต" ได้เลย</p></div>

    <span class="muted">คำอธิบายตัวละคร (ใส่หน้าทุก prompt เพื่อให้หน้าตาใกล้เคียงกัน)</span><textarea id="bChar" placeholder="1girl, short black bob hair, low side ponytail, brown eyes, white hoodie"></textarea>

function botParts(){const st=$('#botStat');if(!st)return;const S=BOT.s;
  if(BOT.err&&!S){st.innerHTML=`<h3>เชื่อมบอทไม่ได้</h3><p class="muted" style="margin:0">${esc(BOT.err)}</p><div class="row"><button class="btn sm" data-bot="reload">ลองใหม่</button><button class="btn sm" data-bot="disconnect">แก้ลิงก์/รหัส</button></div>`;return;}
  if(!S){st.innerHTML='<p class="muted" style="margin:0">กำลังเชื่อมบอท…</p>';return;}
  const s=S.settings,qd=S.jobs.filter(j=>j.status!=='failed').length,fail=S.jobs.length-qd,paused=S.now<+s.paused_until;
  const line=paused?`⏸ พักอยู่ (โควตาฟรีวันนี้หมด) · ทำต่อเองประมาณ ${tTH(s.paused_until)}`:qd?`▶️ กำลังทำงาน · เหลือ ${qd} ภาพ · ภาพถัดไปประมาณ ${tTH(Math.max(S.now,+s.last_run+s.interval_min*60000))}`:'✅ คิวว่าง';
  st.innerHTML=`<div class="row"><h3 style="margin-right:auto">🎨 บอทเจนภาพ</h3><span class="chip"><span class="dot"></span>${S.images.length} ภาพในคลัง</span></div>
    <div>${line}${fail?` · <span style="color:var(--red)">พัง ${fail}</span>`:''}${S.hasPassword?'':' · <span style="color:var(--you)">⚠️ บอทยังไม่ได้ตั้งรหัสผ่าน</span>'}</div>
    <div class="row"><button class="btn sm" data-bot="runnow">สร้างภาพถัดไปเดี๋ยวนี้</button><button class="btn sm" data-bot="resume">ทำต่อ / ลองใหม่ที่พัง</button><button class="btn sm" data-bot="clearq">ล้างคิว</button></div>
    ${S.notices.length?S.notices.slice(0,4).map(n=>`<div class="report">${esc(n.msg)} <span class="muted">${tTH(n.created)}</span></div>`).join('')+'<div><button class="btn sm" data-bot="clearn">ล้างแจ้งเตือน</button></div>':''}`;
  const ST={queued:'รอคิว',running:'กำลังสร้าง',failed:'พัง'};
  $('#botQ').innerHTML=S.jobs.length?S.jobs.slice(0,40).map(j=>`<div class="mem"><span style="min-width:0"><b>${esc(j.project)} · ฉาก ${esc(j.scene)}</b><small>${esc(String(j.prompt).slice(0,110))}${j.error?' — '+esc(j.error):''}</small></span><span class="on" style="color:${j.status==='failed'?'var(--red)':j.status==='running'?'var(--you)':'var(--muted)'}">${ST[j.status]||esc(j.status)}</span></div>`).join('')+(S.jobs.length>40?`<p class="muted" style="margin:0">และอีก ${S.jobs.length-40} งาน</p>`:''):'<p class="muted" style="margin:0">ไม่มีงานในคิว</p>';
  const projs=[...new Set(S.images.map(i=>i.project))];if(BOT.proj&&!projs.includes(BOT.proj))BOT.proj='';
  $('#bGP').innerHTML='<option value="">ทุกโปรเจกต์</option>'+projs.map(p=>`<option value="${esc(p)}"${p===BOT.proj?' selected':''}>${esc(p)}</option>`).join('');
  const im=S.images.filter(i=>(!BOT.proj||i.project===BOT.proj)&&(!BOT.star||i.starred)),g={};
  im.forEach(i=>{const k=i.project+' · '+(+i.scene?'ฉาก '+i.scene:'ภาพต้นแบบ');(g[k]=g[k]||[]).push(i);});
  $('#botG').innerHTML=Object.keys(g).length?Object.entries(g).map(([k,a])=>`<div class="sec"><span class="lab">${esc(k)}</span><span class="muted" style="font-size:13px">${esc(String(a[0].prompt).slice(0,140))}</span><div class="bgrid">${a.map(i=>botCard(i)).join('')}</div></div>`).join(''):'<p class="muted" style="margin:0">ยังไม่มีภาพ</p>';
  const sb_=document.querySelector('[data-bot="staronly"]');if(sb_)sb_.classList.toggle('main',BOT.star);
  if(!BOT.filled){$('#bChar').value=s.character||'';$('#bStyle').value=s.style||'';$('#bInt').value=s.interval_min||2;$('#bSteps').value=s.steps||4;BOT.filled=true;}}

function botThumbsFill(){const els=document.querySelectorAll('.botthumbs');if(!els.length)return;const S=BOT.s,proj=epBotProject();
  els.forEach(el=>{const k=el.dataset.k,sc=k==='char'?0:(+k||0);
    if(!S){el.innerHTML='';return;}
    const im=S.images.filter(i=>i.project===proj&&+i.scene===sc),q=S.jobs.filter(j=>j.project===proj&&+j.scene===sc&&j.status!=='failed').length;
    el.innerHTML=(im.length||q)?`<span class="lab">ภาพจากบอท ${im.length}${q?` · รอคิว ${q}`:''}</span>${im.length?`<div class="bgrid">${im.map(i=>botCard(i,k)).join('')}</div>`:''}`:'';});}

async function botEnqueueEp(items,label){if(!items.length)return toast('ยังไม่มี prompt ให้เจน');
  const r=await botApi('/api/enqueue',{project:epBotProject(),items,variants:3,raw:true});
  const m=+((BOT.s&&BOT.s.settings&&BOT.s.settings.interval_min)||2);
  toast(`ส่ง${label}เข้าคิวแล้ว ${r.added} ภาพ · ใช้เวลาประมาณ ${Math.round(r.added*m)} นาที`);}

function b64utf8(str){return btoa(unescape(encodeURIComponent(str)));}
function blobB64(bl){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=no;r.readAsDataURL(bl);});}
async function sendToClaude(b){
  if(!botCfg().url)return toast('เชื่อมบอทเจนภาพก่อน (แท็บเจนภาพ)');
  const ping=await botApi('/api/ping');if(!ping.github)return toast('บอทยังไม่ได้ตั้ง GH_TOKEN / GH_REPO ใน Cloudflare');
  const dir='ep-'+String(ep.id).replace(/[^A-Za-z0-9]/g,'').slice(0,10);
  await signMedia();const m=ep.media||{},files=[];
  for(const k in m)for(const t of ['image','video','audio'])if(m[k]&&m[k][t]&&urls[m[k][t]])files.push({k,t,u:urls[m[k][t]],p:m[k][t]});
  const sent=[],total=files.length+1;let n=0,fail=0;b.disabled=true;
  for(const f of files){b.textContent=`กำลังส่ง ${n+1}/${total}…`;
    try{const bl=await (await fetch(f.u)).blob();if(bl.size>45e6){fail++;continue;}
      const ext=(f.p.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
      const name=(f.k==='char'?'char':'shot'+String(f.k).replace(/[^A-Za-z0-9]/g,'').padStart(2,'0'))+'-'+f.t+'.'+ext;
      await botApi('/api/push',{path:`${dir}/${name}`,b64:await blobB64(bl),message:`${ep.title}: ${name}`});sent.push({shot:f.k,type:f.t,file:name});n++;}
    catch(e){fail++;}}
  const {media,...info}=ep;
  const man={...info,exported_at:new Date().toISOString(),files:sent};
  b.textContent=`กำลังส่ง ${total}/${total}…`;
  await botApi('/api/push',{path:`${dir}/manifest.json`,b64:b64utf8(JSON.stringify(man,null,2)),message:`${ep.title}: manifest`});
  await botApi('/api/push',{path:'latest.json',b64:b64utf8(JSON.stringify({dir,title:ep.title,at:man.exported_at},null,2)),message:`latest: ${ep.title}`});
  b.disabled=false;b.textContent='📤 ส่งภาพและคลิปของตอนนี้ให้ Claude';
  toast(fail?`ส่งแล้ว ${n} ไฟล์ (ไม่สำเร็จ ${fail}) · บอก Claude ว่า "ส่งตอนแล้ว"`:`ส่งครบ ${n} ไฟล์ + บท · บอก Claude ในแชทว่า "ส่งตอนแล้ว"`);}

function botView(src){let v=$('#bview');if(!v){v=document.createElement('div');v.id='bview';v.onclick=()=>v.remove();document.body.appendChild(v);}v.innerHTML=`<img src="${esc(src)}" alt="">`;}

function sure(b,txt){if(b.dataset.sure==='1')return true;const o=b.textContent;b.dataset.sure='1';b.textContent=txt;setTimeout(()=>{if(b.isConnected){b.dataset.sure='';b.textContent=o;}},4000);return false;}

document.addEventListener('change',e=>{if(e.target.id==='bGP'){BOT.proj=e.target.value;botParts();}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-bot],[data-use]');if(!b)return;
  try{
    if(b.dataset.use){const [k,id,starred]=b.dataset.use.split('|');if(!ep)return;
      b.disabled=true;b.textContent='กำลังใส่…';
      const r=await fetch(botU('/img/'+id));if(!r.ok)throw new Error('โหลดภาพจากบอทไม่ได้');
      const bl=await r.blob(),ty=bl.type||'image/jpeg',f=new File([bl],`flux-${id}.${ty.includes('png')?'png':ty.includes('webp')?'webp':'jpg'}`,{type:ty});
      if(starred!=='1')botApi('/api/star',{id:+id}).catch(()=>{});
      await upload(k,'image',f);return botLoad();}
    const a=b.dataset.bot,id=+b.dataset.id;
    switch(a){
      case 'view':return botView(b.src);
      case 'gotogen':return setView('gen');
      case 'sendclaude':return await sendToClaude(b);
      case 'connect':{let u=$('#botUrl').value.trim();const k=$('#botKey').value;if(!u)return toast('ใส่ลิงก์บอทก่อน');
        if(!/^https?:\/\//i.test(u))u='https://'+u;u=u.replace(/\/+$/,'');botSave({url:u,key:k});$('#botMsg').textContent='กำลังทดสอบ…';
        try{await botApi('/api/ping');BOT.s=null;BOT.err='';toast('เชื่อมบอทแล้ว');renderGen();}catch(err){botSave({});$('#botMsg').textContent='เชื่อมไม่ได้: '+botErr(err);}return;}
      case 'disconnect':if(!sure(b,'กดอีกครั้งเพื่อยืนยัน'))return;botSave({});BOT.s=null;BOT.err='';return view==='set'?renderSet():renderGen();
      case 'reload':BOT.err='';BOT.s=null;botParts();break;
      case 'staronly':BOT.star=!BOT.star;return botParts();
      case 'zipstar':case 'zipall':location.href=botU('/api/zip?project='+encodeURIComponent(BOT.proj)+(a==='zipstar'?'&starred=1':''));return;
      case 'enqueue':{const lines=$('#bLines').value;if(!lines.trim())return toast('ใส่ prompt ก่อน');
        const proj=$('#bProj').value.trim()||'โปรเจกต์ใหม่',add=$('#bAdd').checked,variants=+$('#bVar').value;
        let r;if(add)r=await botApi('/api/enqueue',{project:proj,lines,variants});
        else{const L=lines.split('\n').map(x=>x.trim()).filter(Boolean),S=BOT.s||{images:[],jobs:[]};
          let mx=0;[...S.images,...S.jobs].forEach(x=>{if(x.project===proj)mx=Math.max(mx,+x.scene||0);});
          r=await botApi('/api/enqueue',{project:proj,items:L.map((p,i)=>({scene:mx+i+1,prompt:p})),variants,raw:true});}
        $('#bLines').value='';toast(`เพิ่มเข้าคิว ${r.added} ภาพ`);break;}
      case 'runnow':{b.disabled=true;b.textContent='กำลังสร้าง… (5–20 วินาที)';const r=await botApi('/api/runnow',{});
        toast(r.done?'ได้ภาพใหม่แล้ว':r.paused?'โควตาฟรีวันนี้หมดแล้ว':r.skipped==='empty'?'ไม่มีงานในคิว':r.error?'สร้างไม่สำเร็จ: '+r.error:'เรียบร้อย');break;}
      case 'resume':await botApi('/api/resume',{});toast('บอทกลับมาทำงานต่อแล้ว');break;
      case 'clearq':if(!sure(b,'กดอีกครั้งเพื่อล้างคิว'))return;await botApi('/api/clearqueue',{});toast('ล้างคิวแล้ว');break;
      case 'clearn':await botApi('/api/clearnotices',{});break;
      case 'star':await botApi('/api/star',{id});break;
      case 'regen':await botApi('/api/regen',{id});toast('เพิ่มเข้าคิวเจนใหม่แล้ว');break;
      case 'del':if(!sure(b,'ลบ?'))return;await botApi('/api/delete',{id});break;
      case 'save':await botApi('/api/settings',{character:$('#bChar').value,style:$('#bStyle').value,interval_min:Math.max(1,+$('#bInt').value||1),steps:Math.min(8,Math.max(1,+$('#bSteps').value||4))});toast('บันทึกแล้ว');BOT.filled=false;break;
      case 'epall':await botEnqueueEp((ep.shots||[]).filter(s=>s.image_prompt).map(s=>({scene:+s.n||0,prompt:s.image_prompt})),'ทุกช็อต');break;
      case 'epone':{const s=(ep.shots||[]).find(x=>String(x.n)===b.dataset.n);if(!s)return;await botEnqueueEp([{scene:+s.n||0,prompt:s.image_prompt}],`ช็อต ${s.n} `);break;}
      case 'epchar':await botEnqueueEp([{scene:0,prompt:ep.character_sheet_prompt}],'ภาพต้นแบบ');break;
      default:return;}
    await botLoad();
  }catch(err){toast(botErr(err));if(b.dataset.use){b.disabled=false;b.textContent='ใช้ภาพนี้';}if(b.dataset.bot==='runnow'){botLoad();}if(b.dataset.bot==='sendclaude'){b.disabled=false;b.textContent='📤 ส่งภาพและคลิปของตอนนี้ให้ Claude';}}
});

boot();
})();
</script>
</body>
</html>
