<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>สตูดิโอ</title>
<style>
:root{color-scheme:light;--bg:#faf9fe;--fg:#1c1c24;--card:#fff;--mu:#6b6980;--ac:#7c5cff;--ac2:#ff7aa8;--ok:#1a9d5c;--warn:#c77700;--bad:#d33;--bd:#ddd9ee}
*{box-sizing:border-box}body{margin:0;padding:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Noto Sans Thai",sans-serif;max-width:720px;margin:auto}
h1{font-size:22px;margin:4px 0}h2{font-size:17px;margin:0 0 6px}small,.mu{color:var(--mu);font-size:13px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 6px #7c5cff12}
button{font:inherit;border:1px solid var(--bd);background:transparent;color:var(--fg);padding:9px 13px;border-radius:10px;margin:3px 4px 3px 0}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.45}
button.go{width:100%;padding:16px;font-size:17px;font-weight:600;border:0;color:#fff;background:linear-gradient(135deg,var(--ac2),var(--ac))}
input[type=text],input[type=password]{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:#fff;color:var(--fg);font:inherit;margin:4px 0}
.drop{border:2px dashed var(--ac);border-radius:16px;padding:34px 14px;text-align:center;font-size:17px}.drop.over{background:#7c5cff1a}
.sm{font-size:13px;padding:5px 10px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.sp{justify-content:space-between}
.it{padding:10px 0;border-top:1px solid var(--bd)}.it:first-child{border-top:0}
.bar{height:8px;border-radius:6px;background:var(--bd);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac))}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
#toast{position:fixed;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));background:#222;color:#fff;padding:12px 14px;border-radius:12px;display:none;z-index:9;font-size:14px}
.kd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kd button{margin:0;padding:12px 2px;text-align:center}.kd button b{display:block;font-size:26px;line-height:1.2}
.sbg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}.sbg>div{border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:#fff;display:flex;flex-direction:column}.sbg img,.sbg .ph{width:100%;display:block;background:#eeeaf8}.sbg .ph{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:22px}
.sbg .tx{font-size:11px;line-height:1.35;padding:4px 6px;color:var(--mu);flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.sbg button{margin:0;border:0;border-top:1px solid var(--bd);border-radius:0;font-size:13px;padding:7px 0;width:100%}
.sbb{display:flex}.sbb button:last-child{flex:0 0 38px;border-left:1px solid var(--bd)}
.wt{margin:12px -14px;background:#fff;padding-bottom:6px}.wth{padding:14px;font-size:18px;border-top:3px solid var(--ac);border-bottom:1px solid var(--bd);margin-bottom:18px}.wp{position:relative;margin:0 0 30px}.wp .im{position:relative}.wp img{width:100%;display:block}.wp .ph{aspect-ratio:16/9;background:#eeeaf8;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:13px;padding:10px;text-align:center}
.bb{position:relative;width:fit-content;max-width:80%;margin:8px 16px;padding:10px 15px;border:2px solid #1c1c24;border-radius:22px;background:#fff;font-size:15.5px;line-height:1.42;color:#1c1c24}.bb b{display:block;font-size:11.5px;color:var(--ac);margin-bottom:1px}
.bb.r{margin-left:auto}.bb::before{content:'';position:absolute;top:-11px;left:24px;border:6px solid transparent;border-bottom-color:#1c1c24;border-top:0;border-bottom-width:11px}.bb.r::before{left:auto;right:24px}.im+.bb{margin-top:-14px}
.dir{margin:6px 18px;font-size:12.5px;color:#555;line-height:1.55}.dir summary{cursor:pointer;color:#6b5fd0}.dir b{color:#333;font-weight:600}.sbdraft .wp img,.sbdraft #anp .fr img,.sbdraft .sbimg{filter:grayscale(1) contrast(1.05)}.nv{margin:10px 18px;font-size:15px;line-height:1.7;color:#2a2a35;font-style:italic;font-family:Georgia,'Sarabun',serif}.tk{margin:8px 18px 8px 34px;font-size:14.5px;line-height:1.6;color:#4a4a5a;font-style:italic}.tk b{display:block;font-size:11.5px;color:#8a7fc8;font-style:normal}.nr{width:fit-content;max-width:88%;margin:8px 16px;padding:7px 11px;border:1.5px solid #1c1c24;background:#fff8dc;font-size:14px;line-height:1.4;color:#1c1c24}
.fx1,.fx2{position:absolute;font-weight:800;-webkit-text-stroke:3px #fff;paint-order:stroke fill;pointer-events:none;line-height:1.1}.fx1{top:6%;left:5%;color:#ff4fa3;font-size:17px;transform:rotate(-7deg);max-width:55%}.fx2{top:8%;right:5%;color:#2f8cff;font-size:27px;transform:rotate(9deg)}
.stp{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:var(--ac);color:#fff;font-size:14px;margin-right:6px}
a.btn{display:inline-block;text-decoration:none;border:1px solid var(--bd);color:var(--fg);padding:9px 13px;border-radius:10px;margin:3px 4px 3px 0}
</style></head><body>
<h1>🎬 สตูดิโอ</h1><div class="mu">เลือกประเภทงาน → ใส่บทและเลือก LoRA → ดูสตอรีบอร์ด 1 ตอนก่อน แล้วค่อยสั่งทำทั้งตอน</div>
<div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=x=>String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ตัวเล่นแบบอนิเมะ: ภาพ 16:9 เต็มจอ ซับขึ้นทีละบรรทัด (บทเล่า = ตัวเอียง · บทพูด = ชื่อ: ข้อความ · ในใจ = วงเล็บ) แตะขวา/ล่าง = ถัดไป แตะซ้าย = ย้อน
/* ===== เสียงในตัวเล่นอนิเมะ: เสียงประกอบ/บรรยากาศ/ดนตรี สร้างสดด้วย WebAudio (ฟรี ไม่มีลิขสิทธิ์) + ผสมเสียง (ลดดนตรีตอนมีคนพูด) ===== */
function showQc(R,C,n){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9998;display:flex;align-items:flex-end;justify-content:center';
  const sev={สูง:'#d33',กลาง:'#e90',ต่ำ:'#888'},rows=(R&&R.items)||[];
  o.innerHTML=`<div style="background:#fff;max-width:760px;width:100%;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 18px calc(16px + env(safe-area-inset-bottom));font-size:14.5px;line-height:1.55"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:17px">📋 ตรวจความต่อเนื่อง ตอน ${n}</b><button data-c>ปิด</button></div>
  ${R?`<div class="mu" style="margin:4px 0 10px">ตรวจ ${R.panels} ช่อง · ${esc(R.at||'')} · ต้องแก้ ${rows.filter(x=>x.status!=='แก้แล้ว').length} · แก้แล้ว ${rows.filter(x=>x.status==='แก้แล้ว').length}</div>
  ${(R.checks||[]).map(c=>`<div>${c.ok?'✅':'⚠️'} ${esc(c.name)}</div>`).join('')}
  <div style="margin-top:10px">${rows.map(x=>`<div style="border-left:4px solid ${sev[x.sev]||'#888'};padding:6px 10px;margin:8px 0;background:#faf9fd;border-radius:6px"><b>${esc(x.id)}</b> · <span style="color:${sev[x.sev]||'#888'}">${esc(x.sev)}</span> · ${x.status==='แก้แล้ว'?'✅ แก้แล้ว':'⏳ รอแก้'}<div>${esc(x.issue)}</div><div class="mu">วิธีแก้: ${esc(x.fix)}</div></div>`).join('')||'<div>ไม่พบข้อผิดพลาด</div>'}</div>`:'<div style="margin-top:10px">ยังไม่มีรายงานของตอนนี้</div>'}
  ${C?`<details style="margin-top:12px"><summary><b>📚 สิ่งที่ต้องต่อเนื่องไปตอนถัดไป</b></summary>${Object.entries(C).map(([k,v])=>`<div><b>${esc(k)}:</b> ${esc(Array.isArray(v)?v.join(' · '):typeof v==='object'?JSON.stringify(v):v)}</div>`).join('')}</details>`:''}</div>`;
  o.onclick=e=>{if(e.target===o||e.target.closest('[data-c]'))o.remove();};document.body.appendChild(o);}
function mkAudio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;const ac=new AC();
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(ac.destination);
  const bus=k=>{const g=ac.createGain();g.connect(comp);return g;},B={bgm:bus(),sfx:bus(),amb:bus()};
  let mix={bgm:.2,sfx:.6,amb:.16};try{Object.assign(mix,JSON.parse(localStorage.getItem('ss_mix')||'{}'));}catch(e){}
  let duck=1;const apply=(f=.25)=>{const t=ac.currentTime;B.bgm.gain.setTargetAtTime(mix.bgm*duck,t,f/3);B.sfx.gain.setTargetAtTime(mix.sfx,t,.03);B.amb.gain.setTargetAtTime(mix.amb*(duck<1?.7:1),t,f/3);};apply(.01);
  const NB=(()=>{const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;})();
  const noise=(t,dur,out,{type='bandpass',f=1000,f2,q=1,a=.01,v=1}={})=>{const s=ac.createBufferSource();s.buffer=NB;s.loop=true;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q;const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(out);s.start(t,Math.random());s.stop(t+dur+.05);return g;};
  const tone=(t,dur,out,{type='sine',f=440,f2,v=.5,a=.005,det=0}={})=>{const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);o.detune.value=det;const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+.05);return o;};
  /* คลังเสียงประกอบ (key → เสียง) */
  const SFX={
    whoosh:(t,o,v)=>noise(t,.45,o,{f:300,f2:3000,q:2,a:.15,v:v}),
    swish:(t,o,v)=>noise(t,.18,o,{f:1500,f2:5000,q:3,a:.02,v:v}),
    impact:(t,o,v)=>{tone(t,.7,o,{f:110,f2:40,v:v});noise(t,.35,o,{type:'lowpass',f:1200,v:v*.8});},
    boom:(t,o,v)=>{tone(t,1.6,o,{f:70,f2:28,v:v});noise(t,1.4,o,{type:'lowpass',f:500,f2:80,v:v*.9,a:.01});},
    sting:(t,o,v)=>{[55,58.3,82.4].forEach(f=>tone(t,1.6,o,{type:'sawtooth',f,v:v*.25}));noise(t,.5,o,{type:'lowpass',f:2500,v:v*.6});tone(t,1.2,o,{f:880,f2:860,v:v*.12,type:'square'});},
    reveal:(t,o,v)=>{tone(t,1.8,o,{type:'triangle',f:220,v:v*.35});tone(t+.12,1.6,o,{type:'triangle',f:311,v:v*.3});tone(t+.24,1.5,o,{type:'triangle',f:466,v:v*.25});},
    knock:(t,o,v)=>{[0,.32].forEach(d=>{noise(t+d,.09,o,{type:'bandpass',f:350,q:4,v:v});tone(t+d,.08,o,{f:180,f2:120,v:v*.6});});},
    heartbeat:(t,o,v)=>{[0,.28,.9,1.18].forEach((d,i)=>tone(t+d,.18,o,{f:i%2?55:65,f2:40,v:v*(i%2?.7:1)}));},
    bell:(t,o,v)=>{[[1,1],[2.76,.5],[5.4,.25],[8.9,.12]].forEach(([m,a])=>tone(t,4.5/m**.3,o,{f:196*m,v:v*a*.5,a:.002}));},
    chime:(t,o,v)=>{[1568,2093,2637,3136].forEach((f,i)=>tone(t+i*.07,.9,o,{f,v:v*.18}));},
    can:(t,o,v)=>{[1,2.3,3.9].forEach(m=>tone(t,.25,o,{type:'square',f:620*m,v:v*.06}));tone(t+.18,.2,o,{f:120,f2:70,v:v*.5});noise(t+.18,.12,o,{type:'lowpass',f:900,v:v*.4});},
    click:(t,o,v)=>tone(t,.05,o,{type:'square',f:2200,v:v*.25}),
    paper:(t,o,v)=>{for(let i=0;i<5;i++)noise(t+i*.09,.07,o,{type:'highpass',f:2500,v:v*.5});},
    steps:(t,o,v)=>{for(let i=0;i<4;i++)noise(t+i*.42,.1,o,{type:'lowpass',f:450,v:v*.8});},
    run:(t,o,v)=>{for(let i=0;i<8;i++)noise(t+i*.17,.07,o,{type:'lowpass',f:700,v:v*.7});},
    creak:(t,o,v)=>{const x=tone(t,1.1,o,{type:'sawtooth',f:260,f2:420,v:v*.12});const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=23;lg.gain.value=30;l.connect(lg);lg.connect(x.frequency);l.start(t);l.stop(t+1.2);},
    fire:(t,o,v)=>{noise(t,2.2,o,{type:'lowpass',f:900,v:v*.7,a:.15});for(let i=0;i<14;i++)noise(t+Math.random()*2,.03,o,{type:'highpass',f:3000,v:v*.6});},
    flame:(t,o,v)=>{noise(t,1.2,o,{f:200,f2:2500,q:.8,a:.05,v:v});tone(t,1,o,{f:90,f2:45,v:v*.5});},
    boing:(t,o,v)=>{const x=tone(t,.55,o,{f:180,f2:520,v:v*.4});const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=18;lg.gain.value=40;l.connect(lg);lg.connect(x.frequency);l.start(t);l.stop(t+.6);},
    pop:(t,o,v)=>tone(t,.12,o,{f:900,f2:220,v:v*.5}),
    pops:(t,o,v)=>{for(let i=0;i<3;i++)tone(t+i*.16,.1,o,{f:700+i*200,f2:250,v:v*.4});},
    fail:(t,o,v)=>{[392,370,349,330].forEach((f,i)=>tone(t+i*.28,i<3?.26:.9,o,{type:'triangle',f,v:v*.3}));},
    wind:(t,o,v)=>noise(t,2.2,o,{f:400,f2:1200,q:1.5,a:.7,v:v*.8}),
    gasp:(t,o,v)=>{tone(t,.25,o,{f:500,f2:1400,v:v*.3});noise(t,.2,o,{type:'highpass',f:2000,v:v*.3});},
    shock:(t,o,v)=>{tone(t,.4,o,{type:'square',f:1200,f2:300,v:v*.15});noise(t,.3,o,{type:'bandpass',f:1800,q:2,v:v*.5});},
    sparkle:(t,o,v)=>{for(let i=0;i<6;i++)tone(t+i*.06,.5,o,{f:2000+Math.random()*2500,v:v*.1});},
    hum:(t,o,v)=>tone(t,2,o,{type:'sawtooth',f:100,v:v*.04,a:.4}),
    glitch:(t,o,v)=>{for(let i=0;i<6;i++)tone(t+i*.05,.04,o,{type:'square',f:200+Math.random()*1800,v:v*.15});},
    crowd:(t,o,v)=>noise(t,1.5,o,{f:600,q:.6,a:.3,v:v*.3}),
    door:(t,o,v)=>{SFX.creak(t,o,v);noise(t+1,.15,o,{type:'lowpass',f:300,v:v});},
    bag:(t,o,v)=>{for(let i=0;i<3;i++)noise(t+i*.11,.12,o,{type:'bandpass',f:3500,q:.7,v:v*.4});},
    bite:(t,o,v)=>{noise(t,.08,o,{type:'highpass',f:1800,v:v*.6});noise(t+.25,.08,o,{type:'highpass',f:1800,v:v*.5});},
    scream:(t,o,v)=>{const x=tone(t,1.1,o,{type:'sawtooth',f:520,f2:300,v:v*.2});noise(t,1,o,{f:1200,q:1,v:v*.4});},
  };
  /* เสียงบรรยากาศตามสถานที่ (วนจนกว่าจะเปลี่ยนฉาก) */
  let ambNodes=[],ambKey='',ambT=0;
  const AMB={
    office:()=>[loopNoise({type:'lowpass',f:400,v:.25}),tick(1,'tick')],
    dark:()=>[loopNoise({type:'lowpass',f:220,v:.4}),tick(3.7,'creak')],
    night:()=>[loopNoise({type:'bandpass',f:120,q:3,v:.5}),tick(.22,'cricket')],
    outside:()=>[loopNoise({type:'bandpass',f:500,q:.8,v:.5,lfo:.08}),loopTone(55,.08)],
    bakery:()=>[loopNoise({type:'bandpass',f:700,q:.5,v:.18}),tick(1.6,'bird')],
    city:()=>[loopNoise({type:'bandpass',f:450,q:.7,v:.35,lfo:.05})],
    bedroom:()=>[loopNoise({type:'lowpass',f:300,v:.15}),tick(5,'wind')],
    tower:()=>[loopNoise({type:'bandpass',f:350,q:1,v:.45,lfo:.1})],
  };
  function loopNoise({type,f,q=1,v,lfo}){const s=ac.createBufferSource();s.buffer=NB;s.loop=true;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=ac.createGain();g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(ambOut);s.start();let l;if(lfo){l=ac.createOscillator();const lg=ac.createGain();l.frequency.value=lfo;lg.gain.value=f*.6;l.connect(lg);lg.connect(fl.frequency);l.start();}return {stop:()=>{try{s.stop();l&&l.stop();}catch(e){}}};}
  function loopTone(f,v){const o=ac.createOscillator();o.frequency.value=f;const g=ac.createGain();g.gain.value=v;o.connect(g);g.connect(ambOut);o.start();return {stop:()=>{try{o.stop();}catch(e){}}};}
  function tick(every,kind){let on=true;const go=()=>{if(!on)return;const t=ac.currentTime+.02;
      if(kind==='tick')tone(t,.03,ambOut,{type:'square',f:3200,v:.05});
      else if(kind==='cricket'){if(Math.random()<.6)for(let i=0;i<3;i++)tone(t+i*.035,.025,ambOut,{f:4400+Math.random()*300,v:.05});}
      else if(kind==='bird'){if(Math.random()<.5){const b=2500+Math.random()*1500;tone(t,.12,ambOut,{f:b,f2:b*1.4,v:.06});tone(t+.15,.1,ambOut,{f:b*1.2,f2:b*.9,v:.05});}}
      else if(kind==='creak'){if(Math.random()<.4)SFX.creak(t,ambOut,.25);}
      else if(kind==='wind'){if(Math.random()<.5)SFX.wind(t,ambOut,.4);}
      tid=setTimeout(go,every*1000*(.7+Math.random()*.6));};let tid=setTimeout(go,200);return {stop:()=>{on=false;clearTimeout(tid);}};}
  const ambOut=ac.createGain();ambOut.connect(B.amb);
  /* ดนตรีพื้นหลัง: สร้างโน้ตสดตามแนว (ตั้งเวลาล่วงหน้าทีละนิด) */
  const SC={maj:[0,2,4,5,7,9,11],min:[0,2,3,5,7,8,10],pent:[0,2,4,7,9],minp:[0,3,5,7,10]};
  const hz=n=>440*2**((n-69)/12);
  const pluck=(t,n,o,v,d=1.2,type='triangle')=>{tone(t,d,o,{type,f:hz(n),v,a:.004});tone(t,d*.6,o,{type:'sine',f:hz(n+12),v:v*.25,a:.004});};
  const pad=(t,ns,o,v,d)=>ns.forEach(n=>{const x=ac.createOscillator();x.type='sawtooth';x.frequency.value=hz(n);x.detune.value=(Math.random()-.5)*14;const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=900;const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+d*.3);g.gain.linearRampToValueAtTime(0,t+d);x.connect(fl);fl.connect(g);g.connect(o);x.start(t);x.stop(t+d+.05);});

  try{const r=await botApi('/api/vcastaud',{act:'wipe_all',confirm:'ลบทั้งหมด'});
    if(ST.plan)for(const E of ST.plan.eps){if(ST.epst[E.no])await api('stop',{ep:E.no});}
    await api('autos_off');ST.onlyReady=false;localStorage.setItem('ss_onlyready','0');LG.clear();for(const k in LT)delete LT[k];ST.lib=[];
    toast('ลบแล้ว '+(r.removed||0)+' คน เริ่มเรียกนักแสดงใหม่');ST.busy='';await load();await startAll();
  }catch(e){ST.busy='';ST.msg='⚠️ '+botErr(e);await load();}}
function loraTab(pl){
  const roles=pl.roles.filter(r=>live(r)),lib=ST.lib,tr=ST.train||[],mb=x=>x.size?Math.round(x.size/1048576)+' MB':'';
  const usedBy=x=>x.cast_role?(x.cast_story===ST.story?'ใช้เป็นบท: <b>'+esc(x.cast_role)+'</b>':'ใช้อยู่ในเรื่อง “'+esc(x.cast_story)+'”'):'ยังว่าง';
  let h=`<div class="c"><h2>🧬 LoRA ที่เสร็จแล้ว (${lib.length})</h2><div class="mu">เลือกใช้ในบทได้เฉพาะ LoRA ที่เทรนเสร็จพร้อมใช้ — ตัวที่รอคิว/กำลังเทรน/เทรนพังแสดงแยกด้านล่าง และเลือกไม่ได้</div>
    <label class="row" style="margin-top:8px;cursor:pointer"><input type="checkbox" id="onlyr" ${ST.onlyReady?'checked':''} style="width:auto"> <span>ใช้เฉพาะ LoRA ที่เสร็จแล้ว (ไม่สั่งเทรนใหม่เอง)</span></label></div>`;
  if(tr.length){h+=`<div class="c"><h2>⏳ รอคิว / กำลังเทรน (${tr.filter(x=>x.status!=='failed').length})</h2><div class="mu">เทรนทีละตัว ตัวหลักได้เข้าก่อน</div>`+tr.map(x=>{
    const pct=x.total?Math.min(100,Math.round(x.step/x.total*100)):0,age=x.at?Math.round((Date.now()-x.at)/60000):null;
    const st=x.status==='failed'?'<span class="bad">❌ เทรนพัง</span>':x.status==='training'?`<span class="warn">🔧 กำลังเทรน${x.total?' '+pct+'%':''}</span>`:`<span class="mu">⏳ รอคิว${x.pos?' ลำดับ '+x.pos:''}${x.pri===0?' · ตัวหลัก':''}</span>`;
    const hint=/pip|venv|not found/i.test(x.error)?'<div class="warn" style="font-size:12px">ดูเหมือนสคริปต์ Kaggle เก่า — deploy worker.js ใหม่ ให้ Kaggle ดึงสคริปต์ล่าสุด แล้วกดเทรนใหม่</div>':'';
    return `<div class="it"><div class="row sp"><b>${esc(x.name)}</b>${st}</div>${x.cast_role?`<div class="mu">บท: ${esc(x.cast_role)}</div>`:''}
      ${x.status==='training'?`${x.total?`<div class="mu">สเต็ป ${x.step}/${x.total}</div><div class="bar"><i style="width:${pct}%"></i></div>`:''}${x.tail?`<div class="mu" style="font-size:12px;word-break:break-all">${esc(x.tail)}</div>`:''}${age!=null&&age>=10?`<div class="warn" style="font-size:12px">⚠️ ไม่มีความคืบหน้ามา ${age} นาที อาจค้าง</div>`:''}`:''}
      ${x.status==='failed'?`${x.error?`<div class="bad" style="font-size:12px;word-break:break-all;white-space:pre-wrap">${esc(x.error)}</div>`:''}${hint}${x.cand?`<button class="sm" data-retry="${x.cand}">🔁 เทรนใหม่</button>`:''}`:''}</div>`;}).join('')+'</div>';}
  h+=`<div class="c"><h2>📚 คลัง</h2>`+(lib.length?lib.map(x=>`<div class="it"><div class="row" style="flex-wrap:nowrap;gap:10px">${x.face?`<img src="${esc(botU('/img/'+x.face))}" loading="lazy" style="width:56px;height:56px;border-radius:12px;object-fit:cover;object-position:top;border:1px solid var(--bd)">`:''}<div style="flex:1"><b>${esc(x.name)}</b> <span class="ok">✅ พร้อมใช้</span> <span class="mu">${mb(x)}</span><div class="mu">${usedBy(x)}</div></div></div>
      <div class="row" style="margin-top:6px"><button class="sm" data-lt="${x.lid}" ${x.testing?'disabled':''}>${x.testing?'⏳ กำลังวาดภาพทดสอบ…':'🖼 ทดสอบหน้า'}</button></div>
      ${x.test?`<a href="${esc(botU('/img/'+x.test))}" target="_blank"><img src="${esc(botU('/img/'+x.test))}" loading="lazy" style="width:130px;border-radius:12px;margin-top:6px;border:1px solid var(--bd)"></a><div class="mu" style="font-size:12px">ภาพทดสอบ (แตะเพื่อขยาย) — ถ้าหน้าไม่ตรงตัวละคร ให้เทรนใหม่</div>`:''}</div>`).join(''):'<div class="warn">ยังไม่มี LoRA ที่เทรนเสร็จ — เมื่อบอทเทรนเสร็จจะมาโผล่ที่นี่เอง</div>')+'</div>';
  {const X=ST.xl||[],KN={style:'🎨 สไตล์',enemy:'👹 ศัตรู',place:'📍 สถานที่'},stt=x=>x.lora==='ready'?`<span class="ok">✅ พร้อมใช้${x.size?' · '+Math.round(x.size/1048576)+' MB':''}</span>`:x.lora==='queued'?'<span class="warn">⏳ รอเทรน/กำลังเทรน</span>':x.lora==='failed'?'<span class="bad">❌ เทรนพัง</span>':`<span class="mu">🖼 วาดชุดฝึก ${x.img}/16</span>`;
   h+=`<div class="c"><h2>🧩 LoRA ของเรื่อง: สไตล์ · ศัตรู · สถานที่</h2><div class="mu">ทำให้ลายเส้น ตัวประหลาด และฉากหลัก หน้าตาเหมือนเดิมทุกช็อต ระบบวาดชุดฝึก 16 ภาพแล้วเทรนเอง และใช้ให้อัตโนมัติเมื่อพร้อม</div>
    ${X.map(x=>`<div class="it"><div class="row" style="flex-wrap:nowrap;gap:10px">${x.face?`<img src="${esc(botU('/img/'+x.face))}" loading="lazy" style="width:56px;height:56px;border-radius:12px;object-fit:cover;border:1px solid var(--bd)">`:''}<div style="flex:1"><b>${esc(x.name)}</b> <span class="mu">${KN[x.kind]||''}</span><div>${stt(x)}</div></div><button class="sm" data-xdel="${x.id}">🗑</button></div></div>`).join('')}
    <button class="on" data-xauto="1" style="margin-top:8px;width:100%">🤖 ให้ระบบเลือกจากบท (สไตล์ + ศัตรู + สถานที่)</button>
    <div class="mu" style="margin:10px 0 4px">หรือเพิ่มเอง</div><div class="row"><select id="xk" style="padding:10px;border-radius:10px;border:1px solid var(--bd);font:inherit;background:#fff;color:var(--fg)"><option value="enemy">👹 ศัตรู</option><option value="place">📍 สถานที่</option></select><input type="text" id="xn" placeholder="ชื่อ" style="flex:1;min-width:120px"></div><input type="text" id="xd" placeholder="หน้าตาเป็นยังไง (พิมพ์ไทยได้)"><button data-xnew="1">➕ เพิ่ม</button></div>`;}
  h+=`<div class="c"><h2>🎭 เลือก LoRA ให้แต่ละบท</h2>`+roles.map(r=>{const c=castOf(r.key),cur=c?(lib.find(x=>x.cand===c.id)||{}).lid||0:0,t=tierOf(r),w=Math.round((+(ST.weights||{})[r.key]||0.8)*100);
    return `<div class="it"><div class="row sp"><b>${esc(r.key)}</b><span class="mu">${esc(r.kind)}${t==='main'?' · ตัวหลัก':''}</span></div>
      <select data-lp="${esc(r.key)}" style="width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);font:inherit;margin-top:4px"><option value="0">— ไม่เลือก —</option>${lib.map(x=>{const other=x.cast_role&&x.cast_story&&x.cast_story!==ST.story,took=x.cast_role&&x.cast_story===ST.story&&x.cast_role!==r.key;return `<option value="${x.lid}" ${+cur===+x.lid?'selected':''} ${other?'disabled':''}>${esc(x.name)}${other?' (ใช้เรื่องอื่นอยู่)':took?' (ย้ายจากบท '+esc(x.cast_role)+')':''}</option>`;}).join('')}</select>
      ${cur?`<div class="row" style="margin-top:6px;flex-wrap:nowrap"><span class="mu" style="white-space:nowrap">น้ำหนัก <b data-lwv="${esc(r.key)}">${(w/100).toFixed(2)}</b></span><input type="range" min="30" max="120" step="5" value="${w}" data-lw="${esc(r.key)}" style="flex:1"></div><div class="mu" style="font-size:12px">ต่ำ = หน้านุ่ม/อิสระ · สูง = ล็อกหน้าแน่นแต่อาจแข็ง (แนะนำ 0.8)</div>`:''}
      ${t==='main'&&!cur?'<div class="warn" style="font-size:13px">ตัวหลักต้องเลือก LoRA ที่เสร็จแล้วก่อนเริ่มสร้าง</div>':''}</div>`;}).join('')+'</div>';
  {const a=ST.autos,on=a?[a.fill&&'เติมคิวภาพเอง',a.lora&&'เทรน LoRA เอง (ฝั่งบอท)',a.cast&&'แคสติ้งรายวัน',a.aud&&'ออดิชันรายวัน'].filter(Boolean):[];
   h+=`<div class="c"><h2>⛔ ระบบอัตโนมัติเก่า</h2>${a?(on.length?`<div class="warn">ยังเปิดอยู่: ${esc(on.join(' · '))}</div>`:'<div class="ok">ปิดครบแล้ว — ตอนนี้ทำงานเฉพาะที่สตูดิโอสั่งเท่านั้น</div>'):'<div class="mu">อ่านสถานะไม่ได้ (บอทอาจเป็นเวอร์ชันเก่า)</div>'}<div class="mu" style="margin-top:4px">ปิด: เติมคิวภาพเอง · เทรน LoRA เองฝั่งบอท · แคสติ้ง/ออดิชันรายวัน และล้างคิวงานเทรน/ภาพที่ค้าง (ตอนที่สร้างอยู่ใน 🎬 เรื่องไม่ถูกแตะ)</div><button data-autoff="1" style="margin-top:8px">⛔ ปิดทั้งหมด + ล้างคิวค้าง</button></div>`;}
  h+=`<div class="c"><h2>🔌 การเชื่อมบอท</h2><button data-test="1">🧪 ทดสอบการเชื่อมต่อ</button><button data-bot="1">เชื่อมบอทใหม่</button>${ST.testMsg?`<div class="mu" style="margin-top:6px;white-space:pre-wrap">${esc(ST.testMsg)}</div>`:''}</div>`;
  h+=`<div class="c"><h2>♻️ เริ่มใหม่ทั้งหมด</h2><div class="mu">ลบคลังนักแสดงเก่า (ผู้สมัคร ตัวละคร LoRA และภาพทั้งหมด) แล้วเรียกนักแสดงใหม่ เทรน LoRA ใหม่ให้ตัวหลัก ลบแล้วกู้คืนไม่ได้</div><button data-wipe="1" style="margin-top:8px;border-color:var(--bad);color:var(--bad)">🗑 ลบคลังเก่า + สร้าง LoRA ใหม่</button></div>`;
  return h;}
function bindLora(A){
  A.querySelectorAll('[data-xauto]').forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent='⏳ AI กำลังอ่านบท…';try{const r=await api('xl_auto');toast(r.made&&r.made.length?'เพิ่มแล้ว: '+r.made.join(', '):'ไม่มีอะไรให้เพิ่ม (มีครบแล้ว)');}catch(e){toast(botErr(e));}await load();});
  A.querySelectorAll('[data-xnew]').forEach(b=>b.onclick=async()=>{const n=$('#xn').value.trim(),d=$('#xd').value.trim();if(!n||!d){toast('ใส่ชื่อและคำอธิบายก่อน');return;}b.disabled=true;try{await api('xl_new',{kind:$('#xk').value,name:n,desc:d});toast('เพิ่มแล้ว กำลังวาดชุดฝึก');}catch(e){toast(botErr(e));}await load();});
  A.querySelectorAll('[data-xdel]').forEach(b=>b.onclick=async()=>{if(!confirm('ลบ LoRA นี้และภาพชุดฝึก?'))return;try{await api('xl_del',{id:+b.dataset.xdel});}catch(e){toast(botErr(e));}await load();});
  const o=A.querySelector('#onlyr');if(o)o.onchange=async()=>{ST.onlyReady=o.checked;localStorage.setItem('ss_onlyready',o.checked?'1':'0');toast(o.checked?'ใช้เฉพาะ LoRA ที่เสร็จแล้ว':'สตูดิโอจะสั่งเทรนตัวหลักให้เมื่อภาพชุดฝึกพร้อม');render();if(!o.checked)load();};
  A.querySelectorAll('[data-lp]').forEach(sel=>sel.onchange=async()=>{sel.disabled=true;try{await api('lorapick',{key:sel.dataset.lp,lora:+sel.value});toast('บันทึกแล้ว');}catch(e){toast(botErr(e));}await load();});
  A.querySelectorAll('[data-lt]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('lora_test',{lora:+b.dataset.lt});toast('สั่งวาดภาพทดสอบแล้ว รอสักครู่');}catch(e){toast(botErr(e));}await load();});
  A.querySelectorAll('[data-lw]').forEach(r=>{const k=r.dataset.lw,lab=[...A.querySelectorAll('[data-lwv]')].find(x=>x.dataset.lwv===k);r.oninput=()=>{if(lab)lab.textContent=(r.value/100).toFixed(2);};r.onchange=async()=>{try{await api('lorawt',{key:k,w:r.value/100});(ST.weights=ST.weights||{})[k]=r.value/100;toast('บันทึกน้ำหนักแล้ว (มีผลกับภาพที่สร้างใหม่)');}catch(e){toast(botErr(e));}};});
  A.querySelectorAll('[data-retry]').forEach(b=>b.onclick=async()=>{b.disabled=true;LG.delete(b.dataset.retry);try{await api('lorago',{cand:b.dataset.retry});toast('สั่งเทรนใหม่แล้ว');}catch(e){toast(botErr(e));}await load();});}
function epList(pl){return pl.eps.map(E=>{const s=ST.epst[E.no],sc=ST.scn.filter(x=>+x.ep===E.no),fin=ST.fin[E.no],tot=sc.reduce((n,x)=>n+(+x.tot||0),0),vid=sc.reduce((n,x)=>n+(+x.vid||0),0),img=sc.reduce((n,x)=>n+(+x.img||0),0),done=sc.filter(x=>+x.fin).length;
    const st=fin?'<span class="ok">✅ เสร็จ</span>':!s?`<span class="mu">ยังไม่เริ่ม</span> <button class="sm" data-ep="${E.no}">▶ ทำตอนนี้</button>`:s.status==='waiting'?`<span class="warn">⏳ รอ LoRA ${esc((s.need||[]).join(', '))}</span>`:`<span class="warn">🎬 กำลังทำ</span>`;
    const pct=tot?Math.round((img+vid)/(tot*2)*100):0;
    return `<div class="it"><div class="row sp"><b>ตอน ${E.no} · ${esc(E.title)}</b>${st}</div>${s&&s.status==='running'&&!fin?`<div class="mu">ซีนเสร็จ ${done}/${sc.length||3} · ภาพ ${img}/${tot} · วิดีโอ ${vid}/${tot}</div><div class="bar"><i style="width:${pct}%"></i></div>`:''}
      ${fin?`<a class="btn" href="${esc(botU('/vid/'+fin))}" target="_blank">▶ ดูตอนนี้</a>`:sc.filter(x=>+x.final).map(x=>`<a class="btn" href="${esc(botU('/vid/'+x.final))}" target="_blank">▶ ซีน ${x.sc}</a>`).join('')}</div>`;}).join('');}
load();
</script></body></html>
