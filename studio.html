<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Xire.ai Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Kanit', sans-serif; background: #f8f6f3; color: #2c2c2c; }
header { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; background: #fff; border-bottom: 1px solid #eee; }
.logo { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 600; }
nav a { color: #2c2c2c; text-decoration: none; margin-left: 28px; font-size: 15px; }
.container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
h1 { font-family: 'Playfair Display', serif; font-size: 36px; margin-bottom: 8px; }
.sub { color: #777; margin-bottom: 32px; }
.card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
.card h2 { font-size: 20px; margin-bottom: 12px; }
.btn { display: inline-block; background: #2c2c2c; color: #fff; padding: 12px 28px; border-radius: 999px; text-decoration: none; font-size: 15px; margin-top: 12px; border: none; cursor: pointer; }
.btn:hover { background: #444; }
.btn-full { width: 100%; text-align: center; }
textarea, input[type=text], select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; margin: 8px 0; }
.conn { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.conn span { background: #f4f2ef; padding: 6px 12px; border-radius: 999px; font-size: 13px; }
.conn span.backup { background: #fff3e0; }
.parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-top: 16px; }
.part { background: #f4f2ef; border-radius: 10px; padding: 12px; text-align: center; }
.part b { display: block; font-size: 15px; margin-bottom: 4px; }
.part small { color: #777; display: block; }
.part img { width: 100%; border-radius: 6px; margin-top: 8px; }
.part.pending { opacity: 0.7; }
.part.done { background: #e8f5e9; }
.part.error { background: #ffebee; }
.status { margin-top: 12px; padding: 12px; background: #f0f7f0; border-radius: 8px; color: #1a7a3a; display: none; }
.saved { font-size: 13px; color: #777; margin-top: 8px; }
.history { margin-top: 12px; }
.hist-item { padding: 10px; background: #f4f2ef; border-radius: 8px; margin-bottom: 8px; cursor: pointer; font-size: 14px; }
.hist-item:hover { background: #eee; }
footer { text-align: center; padding: 40px; color: #999; font-size: 13px; }
</style>
</head>
<body>
<header>
<div class="logo">Xire.ai</div>
<nav>
<a href="index.html">หน้าหลัก</a>
</nav>
</header>

<div class="container">
<h1>Studio</h1>
<p class="sub">ระบบใหม่ · Advanced Prompting</p>

<div class="card">
<h2>สถานะระบบ</h2>
<div class="conn">
<span>Cloudflare Pages</span>
<span>Supabase</span>
<span class="backup">Kaggle (GPU สำรอง)</span>
<span class="backup">Flux (สำรอง)</span>
<span>SDXL</span>
</div>
<button class="btn" onclick="testWorker()">ทดสอบ Worker</button>
<div class="status" id="testResult" style="display:none"></div>
</div>

<div class="card">
<h2>สร้างซีรีส์ใหม่</h2>
<input type="text" id="title" placeholder="ชื่อเรื่อง">
<textarea id="story" rows="4" placeholder="เขียนเนื้อเรื่องที่นี่..."></textarea>
<select id="style">
<option value="cinematic realistic Korean drama, teal and orange color grading">สัมจริง สไตล์ซีรีส์เกาหลี</option>
<option value="cinematic Japanese drama realistic, muted tones">สัมจริง สไตล์ซีรีส์ญี่ปุ่น</option>
<option value="anime style high quality, detailed">อนิเมะคุณภาพสูง</option>
<option value="cinematic movie still realistic, film grain">สัมจริงหนังภาพยนตร์</option>
</select>
<select id="lighting">
<option value="cinematic lighting, Rembrandt lighting on face">Rembrandt</option>
<option value="golden hour rim light, warm lighting">Golden Hour</option>
<option value="dramatic rim light, chiaroscuro">Rim Light</option>
<option value="soft diffused lighting, overcast">Soft Light</option>
</select>
<select id="camera">
<option value="shallow depth of field, 85mm lens, film still">85mm Portrait</option>
<option value="low angle shot, cinematic composition">Low Angle</option>
<option value="wide shot, rule of thirds">Wide Shot</option>
<option value="close-up, highly detailed face">Close-up</option>
</select>
<select id="partsCount">
<option value="5">5 พาร์ท TikTok</option>
<option value="3">3 พาร์ท</option>
<option value="8">8 พาร์ท</option>
<option value="10">10 พาร์ท</option>
</select>
<select id="model">
<option value="sdxl">SDXL (หลัก)</option>
<option value="flux">Flux (สำรอง)</option>
<option value="kaggle">Kaggle GPU (สำรอง)</option>
</select>
<button class="btn" onclick="saveStory()">บันทึกเรื่อง</button>
<button class="btn btn-full" onclick="startFullPipeline()">สร้างทั้งหมดอัตโนมัติ</button>
<div class="saved" id="savedInfo"></div>
<div class="status" id="status"></div>
</div>

<div class="card">
<h2>เรื่องที่บันทึกไว้</h2>
<div class="history" id="historyList"></div>
</div>

<div class="card">
<h2>คิวการสร้าง</h2>
<div class="parts" id="partsList"></div>
<button class="btn" onclick="exportTikTok()" style="margin-top:12px">ส่งออกสำหรับ TikTok</button>
</div>
</div>

<footer>Xire.ai Studio · Advanced Prompting</footer>

<script>
const WORKER = 'https://anime-image-bot.kandanai697.workers.dev';

function buildPrompt(title, part, total, story, style, lighting, camera) {
  const scene = story.slice(0, 100).replace(/\n/g, ' ').trim();
  return `masterpiece, best quality, ultra detailed, 8k, film still, ${style}, ${lighting}, ${camera}, ${title}, scene ${part} of ${total}, ${scene}, highly detailed face, professional photography, emotional atmosphere, shot on 35mm film`;
}

function getHistory() { return JSON.parse(localStorage.getItem('xire_history') || '[]'); }
function setHistory(h) { localStorage.setItem('xire_history', JSON.stringify(h.slice(0, 10))); }
function getQueue() { return JSON.parse(localStorage.getItem('xire_queue') || '[]'); }
function setQueue(q) { localStorage.setItem('xire_queue', JSON.stringify(q)); }

function saveStory() {
  const data = {
    title: document.getElementById('title').value || 'เรื่องใหม่',
    story: document.getElementById('story').value,
    parts: +document.getElementById('partsCount').value,
    model: document.getElementById('model').value,
    style: document.getElementById('style').value,
    lighting: document.getElementById('lighting').value,
    camera: document.getElementById('camera').value,
    time: new Date().toLocaleString('th-TH')
  };
  localStorage.setItem('xire_story', JSON.stringify(data));
  const h = getHistory();
  h.unshift(data);
  setHistory(h);
  document.getElementById('savedInfo').textContent = `บันทึก "${data.title}" แล้ว`;
  renderHistory();
}

function loadStory(data) {
  if (!data) {
    const raw = localStorage.getItem('xire_story');
    if (!raw) return;
    data = JSON.parse(raw);
  }
  document.getElementById('title').value = data.title || '';
  document.getElementById('story').value = data.story || '';
  document.getElementById('partsCount').value = data.parts || 5;
  document.getElementById('model').value = data.model || 'sdxl';
  document.getElementById('style').value = data.style || document.getElementById('style').options[0].value;
  document.getElementById('lighting').value = data.lighting || document.getElementById('lighting').options[0].value;
  document.getElementById('camera').value = data.camera || document.getElementById('camera').options[0].value;
  document.getElementById('savedInfo').textContent = `โหลด: ${data.title}`;
}

function renderHistory() {
  const list = document.getElementById('historyList');
  const h = getHistory();
  list.innerHTML = h.length ? h.map((s, i) => `
    <div class="hist-item" onclick="loadFromHistory(${i})">
      <b>${s.title}</b><br><small>${s.parts} พาร์ท · ${s.model} · ${s.time}</small>
    </div>
  `).join('') : '<div style="color:#777">ยังไม่มีเรื่องที่บันทึก</div>';
}

function loadFromHistory(i) { const h = getHistory(); if (h[i]) loadStory(h[i]); }

function updatePart(i, status, imgUrl) {
  const el = document.getElementById(`part-${i}`);
  if (!el) return;
  el.className = `part ${status}`;
  el.querySelector('small').textContent = status === 'done' ? 'เสร็จ' : status === 'error' ? 'ผิดพลาด' : 'กำลังสร้าง...';
  if (imgUrl) {
    let img = el.querySelector('img');
    if (!img) { img = document.createElement('img'); el.appendChild(img); }
    img.src = imgUrl;
  }
  const q = getQueue();
  const item = q.find(x => x.id === i) || { id: i };
  item.status = status;
  item.img = imgUrl || item.img;
  setQueue(q);
}

async function testWorker() {
  const el = document.getElementById('testResult');
  el.style.display = 'block';
  el.textContent = 'กำลังทดสอบ Worker...';
  try {
    const res = await fetch(WORKER, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt: 'test cinematic', type: 'image' }) });
    const text = await res.text();
    el.textContent = `ตอบกลับ: ${res.status}\n${text.slice(0, 200)}`;
  } catch (e) {
    el.textContent = 'เชื่อมไม่ได้: ' + e.message;
  }
}

function exportTikTok() {
  const q = getQueue();
  const text = q.map(p => `Part ${p.id}: ${p.status}`).join('\n');
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tiktok-export.txt';
  a.click();
}

async function startFullPipeline() {
  saveStory();
  const title = document.getElementById('title').value || 'เรื่องใหม่';
  const story = document.getElementById('story').value || '';
  const count = +document.getElementById('partsCount').value;
  const model = document.getElementById('model').value;
  const style = document.getElementById('style').value;
  const lighting = document.getElementById('lighting').value;
  const camera = document.getElementById('camera').value;
  const status = document.getElementById('status');
  const list = document.getElementById('partsList');

  status.style.display = 'block';
  status.textContent = 'กำลังเริ่มสร้าง...';

  const queue = [];
  list.innerHTML = '';
  for (let i = 1; i <= count; i++) {
    list.innerHTML += `<div class="part pending" id="part-${i}"><b>Part ${i}/${count}</b><small>รอสร้าง</small></div>`;
    queue.push({ id: i, status: 'pending' });
  }
  setQueue(queue);

  for (let i = 1; i <= count; i++) {
    updatePart(i, 'pending');
    const prompt = buildPrompt(title, i, count, story, style, lighting, camera);
    try {
      const res = await fetch(WORKER, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt, type: 'image', model, fallback: 'flux-kaggle' })
      });
      if (res.ok) {
        const data = await res.json().catch(() => ({}));
        updatePart(i, 'done', data.image || data.url);
        status.textContent = `พาร์ท ${i}/${count} เสร็จ (${model})`;
      } else updatePart(i, 'error');
    } catch (e) { updatePart(i, 'error'); }
    await new Promise(r => setTimeout(r, 600));
  }
  status.textContent = `สร้าง "${title}" เสร็จทั้งหมด`;
}

function restoreQueue() {
  const q = getQueue();
  if (!q.length) return;
  const list = document.getElementById('partsList');
  list.innerHTML = '';
  q.forEach(p => {
    list.innerHTML += `<div class="part ${p.status}" id="part-${p.id}"><b>Part ${p.id}</b><small>${p.status}</small>${p.img ? `<img src="${p.img}">` : ''}</div>`;
  });
}

loadStory();
renderHistory();
restoreQueue();
</script>
</body>
</html>
