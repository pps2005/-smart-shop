<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>สตูดิโอทีม AI · SMART SHOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600&family=Sarabun:wght@400;600&display=swap">
<style>
/* แมพสตูดิโอ: ออฟฟิศกลางคืน ห้องของแต่ละทีมล้อมสมองกลาง (Claude) — โทนมืดเพื่อให้จอ/ไฟเรืองแสงเด่น */
:root{
  --bg:#0A0F1C; --glass:rgba(17,24,41,.86); --glass2:rgba(26,34,56,.92); --line:rgba(148,163,200,.22);
  --ink:#EEF2FA; --muted:#9AA6C2; --cyan:#5EE1FF; --you:#FFC24B; --doing:#4ADE80; --todo:#94A3B8; --red:#FF6B7A;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Sarabun,system-ui,sans-serif;font-size:17px;line-height:1.55}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:Kanit,Sarabun,sans-serif;font-weight:600;margin:0;line-height:1.3}
#gl{position:fixed;inset:0;touch-action:none}
#gl canvas{display:block}
.ui{position:fixed;z-index:5}
body.hide .ui:not(#eye){display:none!important}

/* top bar */
#top{left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(var(--bg),rgba(10,15,28,0))}
.logo{display:flex;align-items:center;gap:8px;font-family:Kanit,sans-serif;font-size:19px;white-space:nowrap}
.logo i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#06b6d4);font-style:normal;font-size:16px}
.tabs{display:flex;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:4px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:10px;white-space:nowrap;cursor:pointer;color:var(--muted);font-weight:600;min-height:40px}
.tabs button.on{background:#25304d;color:var(--ink)}
.tabs b{font-size:13px;background:var(--you);color:#1d1400;border-radius:999px;padding:0 7px;margin-left:4px}
.grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--doing);box-shadow:0 0 8px var(--doing)}
.ib{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--glass);cursor:pointer;display:inline-grid;place-items:center;text-decoration:none;color:var(--ink);font-size:18px}

/* room labels */
#tags{position:fixed;inset:0;pointer-events:none;z-index:3}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tag .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:15px}
.tag b{font-family:Kanit,sans-serif;font-weight:500;display:block;line-height:1.2}
.tag small{color:var(--muted);font-size:12px;display:block;line-height:1.2}
.tag .st{width:8px;height:8px;border-radius:50%;background:var(--todo)}
.tag .st.doing{background:var(--doing);box-shadow:0 0 8px var(--doing)} .tag .st.you{background:var(--you);box-shadow:0 0 8px var(--you)}
.tag.brain{border-color:rgba(94,225,255,.5)}
.tag.sel{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(94,225,255,.35)}
body.far .tag small{display:none}
body.far .tag{padding:4px;gap:4px}body.far .tag>span:nth-child(2){display:none}

/* side panel */
#panel{right:max(12px,env(safe-area-inset-right));top:calc(72px + env(safe-area-inset-top));bottom:calc(12px + env(safe-area-inset-bottom));width:min(400px,calc(100% - 24px));background:var(--glass2);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
@media (max-width:760px){#panel{left:10px;right:10px;width:auto;top:auto;height:62%}}
.ph{padding:16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line)}
.ph .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
.ph h2{font-size:20px}.ph small{color:var(--muted)}
.pb{padding:14px 16px;overflow:auto;display:grid;gap:14px;align-content:start}
.sec{display:grid;gap:8px}
.lab{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600;text-transform:uppercase}
.mem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.04)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:600;flex:none;color:#0b1020}
.mem b{display:block;line-height:1.2}.mem small{color:var(--muted)}
.mem .on{margin-left:auto;font-size:12px;color:var(--doing)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.report{border-left:3px solid var(--cyan);padding:6px 10px;background:rgba(94,225,255,.06);border-radius:0 10px 10px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:#1e2842;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn.main{background:linear-gradient(135deg,#2563eb,#06b6d4);border-color:transparent;color:#fff}
.btn.ok{background:#16a34a;border-color:#16a34a;color:#fff}
.btn.you{background:var(--you);border-color:var(--you);color:#1d1400}
.btn.sm{min-height:38px;padding:5px 12px;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea,input[type=text],input[type=email],input[type=password],select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#0f1628}
textarea{min-height:90px;resize:vertical}
input[type=number]{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#0f1628}
/* บอทเจนภาพ (Flux) */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.bimg{border:2px solid transparent;border-radius:12px;overflow:hidden;background:#000;display:grid;align-content:start}
.bimg.star{border-color:var(--you)}
.bimg img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:zoom-in}
.bimg .bb{display:flex;gap:4px;padding:4px;flex-wrap:wrap;justify-content:space-between;background:#0f1628}
.bimg .bb button{min-height:34px;padding:2px 9px;border-radius:9px;border:1px solid var(--line);background:#1e2842;cursor:pointer;font-size:14px}
.bimg .bb .use{flex:1 1 100%;background:#16a34a;border-color:#16a34a;color:#fff;font-weight:600}
.botthumbs:empty{display:none}.botthumbs{display:grid;gap:6px}
#bview{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.9);display:grid;place-items:center;padding:16px}
#bview img{max-width:100%;max-height:88vh;border-radius:12px}

/* task card */
.task{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:6px}
.task.you{border-color:rgba(255,194,75,.55);background:rgba(255,194,75,.07)}
.task .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.task .tm{font-size:12px;padding:2px 8px;border-radius:999px;font-weight:600;color:#0b1020}
.task .s{font-size:12px;margin-left:auto;font-weight:600}
.s.todo{color:var(--todo)}.s.doing{color:var(--doing)}.s.you{color:var(--you)}.s.done{color:var(--muted)}
.task .d{color:var(--muted);font-size:15px}
.task .r{font-size:15px;border-left:3px solid var(--doing);padding-left:8px}

/* full views */
#view{left:0;right:0;top:calc(64px + env(safe-area-inset-top));bottom:0;overflow:auto;padding:12px max(12px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:rgba(10,15,28,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.vw{max-width:1100px;margin:0 auto;display:grid;gap:16px}
.card{background:var(--glass2);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:980px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cols{grid-template-columns:1fr}}
.col{display:grid;gap:10px;min-width:0}
.col>h3{font-size:16px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.prompt{background:#0f1628;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.prompt code{font-family:ui-monospace,Menlo,monospace;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.prompt .k{font-size:13px;font-weight:600;color:var(--muted)}
.shot{border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:62px minmax(0,1fr);background:rgba(255,255,255,.03)}
.shot .no{display:grid;align-content:start;justify-items:center;padding:12px 4px;border-right:1px solid var(--line)}
.shot .no b{font-family:Kanit,sans-serif;font-size:26px}
.shot .bd{padding:12px;display:grid;gap:8px;min-width:0}
.media{display:flex;gap:10px;flex-wrap:wrap}
.slot{width:110px;aspect-ratio:9/16;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;font-size:13px;color:var(--muted);overflow:hidden;cursor:pointer;padding:6px}
.slot img,.slot video{width:100%;height:100%;object-fit:cover}
.epcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.stp{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(255,194,75,.15);color:var(--you)}
.stp.approved,.stp.posted{background:rgba(74,222,128,.15);color:var(--doing)}
.stp.revise{background:rgba(255,107,122,.15);color:var(--red)}
.howto{margin:0;padding-left:22px;display:grid;gap:4px}

/* feed + eye */
#feed{left:max(12px,env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));width:min(360px,calc(100% - 24px));display:grid;gap:6px;pointer-events:none}
#feed div{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:13.5px;animation:fin .4s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:760px){#feed{display:none}}
#eye{right:max(12px,env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:none}
body.hide #eye{display:inline-grid;opacity:.6}
#zoom{right:max(12px,env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));display:grid;gap:6px}
body.panel #zoom{display:none}

/* player */
#player{position:fixed;inset:0;background:#000;z-index:20;display:grid;grid-template-rows:1fr auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.stage{position:relative;margin:auto;height:100%;max-height:calc(100vh - 130px);aspect-ratio:9/16;max-width:100vw;overflow:hidden;background:#111;border-radius:8px}
.stage img,.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage img.kb{animation:kb 6s ease-out forwards}@keyframes kb{to{transform:scale(1.12)}}
.stage .sk{position:absolute;inset:0;display:grid;align-content:center;gap:12px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 40%,#1d2a4a,#080b14)}
.stage .sk .s{font-family:Kanit,sans-serif;font-size:14px;color:var(--cyan)}
.stage .ost{position:absolute;left:8%;right:8%;top:16%;text-align:center;font-family:Kanit,sans-serif;font-size:26px;color:#fff;text-shadow:0 0 4px #000,0 2px 6px #000}
.stage .sfx{position:absolute;left:8px;right:8px;bottom:10px;font-size:13px;color:#ccc;text-align:center;background:rgba(0,0,0,.45);border-radius:6px;padding:2px 6px}
.ctrl{display:flex;gap:8px;justify-content:center;align-items:center;padding:10px;flex-wrap:wrap}
.prog{height:6px;background:#333;border-radius:3px;overflow:hidden;width:min(420px,80vw)}.prog i{display:block;height:100%;background:var(--cyan);width:0}

#login{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;background:rgba(10,15,28,.85)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));background:#EEF2FA;color:#0b1020;padding:10px 18px;border-radius:12px;z-index:40;font-weight:600}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#feed div{animation:none}.stage img.kb{animation:none}}
</style>
</head>
<body>
<div id="gl"></div>
<div id="tags"></div>

<header id="top" class="ui">
  <a class="ib" href="index.html" aria-label="กลับแมพร้าน">←</a>
  <div class="logo"><i>🎬</i><span>สตูดิโอทีม AI</span></div>
  <nav class="tabs" id="tabs">
    <button data-v="office" class="on">ออฟฟิศ</button>
    <button data-v="tasks">งาน<b id="youN" hidden>0</b></button>
    <button data-v="eps">ตอน</button>
    <button data-v="gen">เจนภาพ 🎨</button>
    <button data-v="brain">สมองกลาง</button>
  </nav>
  <span class="grow"></span>
  <span class="chip" id="stat"><span class="dot"></span><span id="statT">กำลังโหลด…</span></span>
  <button class="ib" id="hideBtn" aria-label="ซ่อน UI" title="ซ่อน UI">👁</button>
</header>

<aside id="panel" class="ui" hidden></aside>
<div id="feed" class="ui"></div>
<div id="zoom" class="ui"><button class="ib" data-z="in" aria-label="ซูมเข้า">＋</button><button class="ib" data-z="out" aria-label="ซูมออก">－</button><button class="ib" data-z="home" aria-label="มุมมองทั้งหมด">◎</button></div>
<section id="view" class="ui" hidden><div class="vw" id="vw"></div></section>
<button id="eye" class="ib ui" aria-label="แสดง UI">👁</button>

<div id="player" hidden>
  <div class="stage" id="stage"></div>
  <div>
    <div class="ctrl"><div class="prog"><i id="progBar"></i></div><span id="progT" style="color:#ccc;font-size:14px"></span></div>
    <div class="ctrl"><button class="btn sm" id="pPrev">ช็อตก่อน</button><button class="btn sm main" id="pPlay">หยุด</button><button class="btn sm" id="pNext">ช็อตถัดไป</button><button class="btn sm" id="pVoice">เสียงอ่าน: เปิด</button><button class="btn sm" id="pClose">ปิด</button></div>
  </div>
</div>
<div id="login" hidden><form class="card" id="loginForm" style="width:min(420px,100%)">
  <h2>เข้าสู่ระบบร้าน</h2><p class="muted" style="margin:0">ใช้อีเมลและรหัสผ่านเดียวกับหน้าหลัก SMART SHOP</p>
  <input type="email" id="em" placeholder="อีเมล" autocomplete="username" required>
  <input type="password" id="pw" placeholder="รหัสผ่าน" autocomplete="current-password" required>
  <button class="btn main" type="submit">เข้าสู่ระบบ</button><p class="muted" id="loginErr" style="margin:0"></p></form></div>
<div id="toast" hidden></div>

<script>if(!window.THREE)document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');</script>

async function refresh(quiet){
  const [t,e]=await Promise.all([
    sb.from('studio_tasks').select('*').order('sort',{ascending:true}).order('created_at',{ascending:true}),
    sb.from('studio_episodes').select('id,title,status,version,logline,team_notes,updated_at,created_at').order('created_at',{ascending:false})
  ]);
  if(t.error||e.error){if(!quiet)toast('โหลดข้อมูลไม่สำเร็จ');return;}
  const prev=Object.fromEntries(tasks.map(x=>[x.id,x.status]));
  tasks=t.data||[];episodes=e.data||[];
  if(quiet) tasks.forEach(x=>{if(prev[x.id]&&prev[x.id]!==x.status)feedAdd(x);});
  else tasks.slice().sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at)).slice(0,4).reverse().forEach(feedAdd);
  stats();updateWorld();if(sel)openPanel(sel,true);
  if(view==='tasks')renderTasks();else if(view==='brain')renderBrain();else if(view==='eps'&&!ep)renderEpList();
}

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);const asp=w/h;cam.left=-CV.h*asp;cam.right=CV.h*asp;cam.top=CV.h;cam.bottom=-CV.h;cam.updateProjectionMatrix();}
function homeH(){const asp=innerWidth/innerHeight;return Math.max(46,52/asp);}
function placeCam(){const d=120;cam.position.set(CV.tx+Math.sin(CV.yaw)*d,d*.9,CV.tz+Math.cos(CV.yaw)*d);cam.lookAt(CV.tx,0,CV.tz);resize();document.body.classList.toggle('far',CV.h>70);}
CV.h=homeH();placeCam();addEventListener('resize',()=>{placeCam();});

// สัมผัส: ลากหนึ่งนิ้ว = หมุน, สองนิ้ว = ซูม/เลื่อน, แตะ = เลือกห้อง
const ptrs=new Map();let gest=null,moved=0;
const ray=new T.Raycaster(),v2=new T.Vector2();
function worldPan(dx,dy){const s=(CV.h*2)/innerHeight;const fx=Math.cos(CV.yaw),fz=-Math.sin(CV.yaw);
  CV.tx-=dx*s*fx+dy*s*Math.sin(CV.yaw)*1.1;CV.tz-=dx*s*fz+dy*s*Math.cos(CV.yaw)*1.1;CV.tx=Math.max(-70,Math.min(70,CV.tx));CV.tz=Math.max(-70,Math.min(70,CV.tz));}
host.addEventListener('pointerdown',e=>{host.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;CV.goal=null;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];gest={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2,h:CV.h};}});
host.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  if(ptrs.size===1){if(e.shiftKey||e.button===2)worldPan(dx,dy);else CV.yaw-=dx*.006;placeCam();}
  else if(ptrs.size===2&&gest){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    CV.h=Math.max(10,Math.min(95,gest.h*gest.d/Math.max(d,1)));worldPan(mx-gest.mx,my-gest.my);gest.mx=mx;gest.my=my;placeCam();}});
function up(e){const was=ptrs.size;ptrs.delete(e.pointerId);if(ptrs.size<2)gest=null;
  if(was===1&&moved<8){v2.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(v2,cam);
    const hit=ray.intersectObjects(pick.concat([core,halo]),false)[0];if(hit)select(hit.object.userData.k||'brain');else if(sel)closePanel();}}
host.addEventListener('pointerup',up);host.addEventListener('pointercancel',up);
host.addEventListener('wheel',e=>{e.preventDefault();CV.h=Math.max(10,Math.min(95,CV.h*(1+Math.sign(e.deltaY)*.1)));placeCam();},{passive:false});
host.addEventListener('contextmenu',e=>e.preventDefault());
$('#zoom').addEventListener('click',e=>{const z=e.target.closest('[data-z]');if(!z)return;
  if(z.dataset.z==='in')CV.h=Math.max(10,CV.h*.8);else if(z.dataset.z==='out')CV.h=Math.min(95,CV.h*1.25);else{CV.goal={tx:0,tz:0,h:homeH()};}placeCam();});

function select(k){sel=k;Object.values(TAGS).forEach(t=>t.classList.toggle('sel',t.dataset.k===k));
  const p=k==='brain'?{x:0,z:0}:ROOMS[k].pos;const narrow=innerWidth<760;
  CV.goal={tx:p.x+(narrow?0:Math.cos(CV.yaw)*8),tz:p.z-(narrow?0:Math.sin(CV.yaw)*8),h:narrow?20:24};
  if(narrow){CV.goal.tx+=Math.sin(CV.yaw)*10;CV.goal.tz+=Math.cos(CV.yaw)*10;}
  if(view!=='office')setView('office');openPanel(k);}

// ลูปภาพ
const clock=new T.Clock();
function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime(),dt=Math.min(clock.getDelta(),.05);
  if(CV.goal){const g=CV.goal,k=.12;CV.tx+=(g.tx-CV.tx)*k;CV.tz+=(g.tz-CV.tz)*k;CV.h+=(g.h-CV.h)*k;placeCam();if(Math.abs(g.h-CV.h)<.05&&Math.hypot(g.tx-CV.tx,g.tz-CV.tz)<.05)CV.goal=null;}
  rings.forEach((r,i)=>{r.rotation.z=t*(.15+i*.07)*(i%2?-1:1);r.material.opacity=(.25+.6/(i+1))*(.75+.25*Math.sin(t*2+i));});
  const pulse=1+.06*Math.sin(t*2.2);core.scale.setScalar(1.6*pulse);halo.scale.setScalar(3.2+.4*Math.sin(t*1.6));beam.material.opacity=.16+.08*Math.sin(t*3);
  orbit.rotation.y=t*.8;orbit2.rotation.z=t*.6;
  TEAMS.forEach(tm=>{const R_=ROOMS[tm.k];const act=R_.act;
    R_.mons.forEach((m,i)=>{m.material.emissiveIntensity=act===2?.6+.4*Math.abs(Math.sin(t*6+i*2)):act===1?.55+.25*Math.sin(t*1.5):.35;});
    R_.agents.forEach(a=>{a.head.position.y=2.65+(act===2?Math.abs(Math.sin(t*7+a.ph))*.06:Math.sin(t*1.2+a.ph)*.02);a.p.rotation.y=act===2?Math.sin(t*3+a.ph)*.08:Math.sin(t*.5+a.ph)*.15;});
    R_.line.material.opacity=act===2?.75:act===1?.5:.25;
    if(act===2||(act===0&&Math.sin(t*.3+R_.pt*6)>.97)){R_.pk.visible=true;R_.pt=(R_.pt+(act===2?.012:.006))%1;R_.pk.position.lerpVectors(R_.inner,R_.outer,R_.pt);}else R_.pk.visible=false;});
  walkers.forEach(w=>{w.a+=w.s*.016;const x=Math.cos(w.a)*w.r,z=Math.sin(w.a)*w.r;w.p.position.set(x,Math.abs(Math.sin(t*8+w.r))*.08,z);w.p.rotation.y=Math.atan2(-Math.sin(w.a)*Math.sign(w.s),Math.cos(w.a)*Math.sign(w.s));});
  renderer.render(scene,cam);
  if(!document.body.classList.contains('hide')&&view==='office'){const v=new T.Vector3();
    for(const k in TAGS){if(k==='brain')v.set(0,7.2,0);else{v.copy(ROOMS[k].pos);v.y=4.6;}v.project(cam);
      const el=TAGS[k];el.style.transform=`translate(${(v.x+1)/2*innerWidth}px,${(1-v.y)/2*innerHeight}px) translate(-50%,-100%)`;}}
}
loop();

function teamTasks(k){return tasks.filter(t=>t.team===k).sort((a,b)=>({you:0,doing:1,todo:2,done:3}[a.status]-{you:0,doing:1,todo:2,done:3}[b.status])||a.sort-b.sort);}
function taskCard(t,showTeam){const tm=TK[t.team]||TK.brain;
  return `<div class="task ${t.status}"><div class="h">${showTeam?`<span class="tm" style="background:${tm.c}">${tm.ic} ${esc(tm.n)}</span>`:''}<b>${esc(t.title)}</b><span class="s ${t.status}">${STN[t.status]}</span></div>
    ${t.detail?`<div class="d">${esc(t.detail)}</div>`:''}${t.result?`<div class="r">${esc(t.result)}</div>`:''}
    ${t.status==='you'?`<div class="row"><button class="btn sm you" data-done="${t.id}">ทำเสร็จแล้ว</button>${t.episode_id?`<button class="btn sm" data-goep="${t.episode_id}">เปิดงาน</button>`:''}</div>`:''}</div>`;}
function latestNote(tm){if(!tm.nk)return null;for(const e of episodes){const n=(e.team_notes||[]).find(x=>(x.team||'').includes(tm.nk));if(n)return {n:n.note,ep:e.title};}return null;}
function openPanel(k,keep){const P=$('#panel');const scroll=keep?(P.querySelector('.pb')||{}).scrollTop:0;

    <div class="pb"><div class="sec"><span class="lab">วิธีสั่งงาน</span><div class="report">พิมพ์คำสั่งด้านล่าง แล้วไปบอก Claude ในแชทว่า <b>"ทำงานในสตูดิโอ"</b> Claude จะอ่านคิว แจกงานให้ทีม และเขียนผลกลับมาที่นี่ ใช้แพ็กเกจ Claude ที่คุณมีอยู่ ไม่เสียเงินเพิ่ม</div></div>
    <div class="sec"><span class="lab">สั่งงาน</span><textarea id="cmd" placeholder="เช่น ทำตอน 2 ของมายด์ ฉากตลาดนัด หรือ ดูเทรนด์สัปดาห์นี้"></textarea><button class="btn main" data-cmd="brain">ส่งเข้าคิว</button></div>
    <div class="sec"><span class="lab">คิวงาน ${q.length+fb.length}</span>${fb.map(e=>`<div class="task you"><div class="h"><b>แก้ตามฟีดแบ็ก: ${esc(e.title)}</b><span class="s you">รอ Claude</span></div></div>`).join('')}${q.map(t=>taskCard(t)).join('')||(!fb.length?'<p class="muted" style="margin:0">ยังไม่มีงานในคิว</p>':'')}</div></div>`;}
  else{const tm=TK[k],c=counts(k),rep=latestNote(tm);
    P.innerHTML=`<div class="ph"><div class="ic" style="background:${tm.c}33">${tm.ic}</div><div style="min-width:0"><h2>ทีม${esc(tm.n)}</h2><small>${tm.ag.length} เอเจนต์ · ${MODE[tm.mode]}</small></div><span class="grow"></span><button class="ib" data-x aria-label="ปิด">✕</button></div>
    <div class="pb"><div class="muted">${esc(tm.job)}</div>
      ${rep?`<div class="sec"><span class="lab">หัวหน้าทีมรายงาน · ${esc(rep.ep)}</span><div class="report">${esc(rep.n)}</div></div>`:''}
      <div class="sec"><span class="lab">สมาชิก</span>${tm.ag.map((a,i)=>`<div class="mem"><span class="av" style="background:${tm.c}">${esc(a[0][0])}</span><span><b>${esc(a[0])}</b><small>${esc(a[1])}</small></span>${c.doing&&i===0?'<span class="on">● ทำงาน</span>':''}</div>`).join('')}</div>
      <div class="sec"><span class="lab">ทักษะ</span><div class="pills">${tm.sk.map(s=>`<span class="pill">${esc(s)}</span>`).join('')}</div></div>
      <div class="sec"><span class="lab">เครื่องมือ</span><div class="pills">${tm.tools.map(s=>`<span class="pill">${esc(s)}</span>`).join('')}</div></div>
      <div class="sec"><span class="lab">งานของทีม · รอคุณ ${c.you} · กำลังทำ ${c.doing} · รอทำ ${c.todo} · เสร็จ ${c.done}</span>${teamTasks(k).map(t=>taskCard(t)).join('')||'<p class="muted" style="margin:0">ยังไม่มีงาน</p>'}</div>
      <div class="sec"><span class="lab">สั่งงานทีมนี้</span><textarea id="cmd" placeholder="บอกสิ่งที่อยากให้ทีม${esc(tm.n)}ทำ"></textarea><button class="btn main" data-cmd="${k}">ส่งเข้าคิว</button></div></div>`;}
  P.hidden=false;document.body.classList.add('panel');if(keep){const pb=P.querySelector('.pb');if(pb)pb.scrollTop=scroll;}}
function closePanel(){sel=null;$('#panel').hidden=true;document.body.classList.remove('panel');Object.values(TAGS).forEach(t=>t.classList.remove('sel'));}

$('#vw').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)openEp(b.dataset.open);});
async function openEp(id){const {data,error}=await sb.from('studio_episodes').select('*').eq('id',id).single();if(error)return toast('เปิดงานไม่สำเร็จ');ep=data;epTab='overview';await signMedia();renderEp();}
async function signMedia(){const paths=[];const m=ep.media||{};for(const k in m)for(const t of ['image','video'])if(m[k]&&m[k][t])paths.push(m[k][t]);urls={};if(!paths.length)return;

function mUrl(k,t){const p=ep.media&&ep.media[k]&&ep.media[k][t];return p?urls[p]:null;}
function slot(k,t,label){const u=mUrl(k,t),id=`f-${k}-${t}`;return `<label class="slot" for="${id}">${u?(t==='image'?`<img src="${u}" alt="${label}">`:`<video src="${u}" muted playsinline preload="metadata"></video>`):`แตะเพื่อ<br>อัปโหลด<br>${label}`}</label><input type="file" id="${id}" accept="${t}/*" data-up="${k}|${t}" hidden>`;}

    ${S.map(s=>`<div class="shot"><div class="no"><b>${esc(s.n)}</b><span class="muted">${esc(s.sec)} วิ</span></div><div class="bd"><div class="row"><span class="pill">${esc(s.shot)}</span>${s.sound?`<span class="pill">เสียง: ${esc(s.sound)}</span>`:''}</div>
      <div>${esc(s.action)}</div>${s.text?`<div><b>ตัวอักษรบนจอ:</b> ${esc(s.text)}</div>`:''}<div class="media">${slot(String(s.n),'image','ภาพช็อต')}${slot(String(s.n),'video','คลิปช็อต')}</div>

  if(epTab==='post'){const cap=(ep.caption||'')+'\n\n'+(ep.hashtags||[]).join(' ');body=`<div class="card"><h3>เพลงและเสียง</h3><p style="margin:0">${esc(ep.music)}</p></div>

  $('#vw').innerHTML=`<div class="row"><button class="btn sm" data-act="eplist">← ตอนทั้งหมด</button></div><h2 style="font-size:26px">${esc(ep.title)}</h2>
    <nav class="tabs">${Object.entries(TB).map(([k,v])=>`<button class="${k===epTab?'on':''}" data-eptab="${k}">${v}</button>`).join('')}</nav>${body}`;
  if(epTab==='shots'||epTab==='character'){botThumbsFill();if(botCfg().url&&!BOT.s)botLoad();}}
$('#vw').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.eptab){epTab=b.dataset.eptab;return renderEp();}
  const a=b.dataset.act;if(!a)return;
  if(a==='eplist'){await refresh(true);return renderEpList();}
  if(a==='play')return startPlayer();
  if(a==='feedback'){const t=$('#fb').value.trim();if(!t)return toast('พิมพ์สิ่งที่อยากให้แก้ก่อน');await saveEp({feedback:t,feedback_at:new Date().toISOString(),status:'revise'},'ส่งแล้ว บอก Claude ในแชทว่า "ทำงานในสตูดิโอ"');}
  if(a==='approve'){if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='กดอีกครั้งเพื่อยืนยัน';setTimeout(()=>{if(b.isConnected){b.dataset.sure='';b.textContent='✓ อนุมัติเป็นต้นฉบับ';}},4000);return;}
    await saveEp({status:'approved',approved_at:new Date().toISOString()},'อนุมัติเป็นต้นฉบับแล้ว');}
  if(a==='posted')await saveEp({status:'posted'},'บันทึกว่าโพสต์แล้ว');});
$('#vw').addEventListener('change',e=>{const t=e.target;if(t.dataset.up&&t.files[0]){const [k,ty]=t.dataset.up.split('|');upload(k,ty,t.files[0]);}});
async function saveEp(f,msg){const {error}=await sb.from('studio_episodes').update({...f,updated_at:new Date().toISOString()}).eq('id',ep.id);if(error)return toast('บันทึกไม่สำเร็จ');Object.assign(ep,f);renderEp();toast(msg);refresh(true);}
async function upload(k,ty,file){if(file.size>50*1024*1024)return toast('ไฟล์ใหญ่เกิน 50MB');toast('กำลังอัปโหลด…');
  const ext=((file.name.split('.').pop()||(ty==='image'?'jpg':'mp4')).toLowerCase().replace(/[^a-z0-9]/g,''))||'bin';const path=`${user.id}/${ep.id}/${k}-${ty}-${Date.now()}.${ext}`;
  const {error}=await sb.storage.from(BUCKET).upload(path,file,{contentType:file.type,upsert:true});if(error)return toast('อัปโหลดไม่สำเร็จ: '+error.message);
  const media={...(ep.media||{})},old=media[k]&&media[k][ty];media[k]={...(media[k]||{}),[ty]:path};
  const {error:e2}=await sb.from('studio_episodes').update({media,updated_at:new Date().toISOString()}).eq('id',ep.id);if(e2)return toast('บันทึกไม่สำเร็จ');
  if(old)sb.storage.from(BUCKET).remove([old]);ep.media=media;await signMedia();renderEp();toast('อัปโหลดแล้ว ทีมคลังวิดีโอเก็บให้เรียบร้อย');}

/* ================= ฉบับร่าง (animatic) ================= */
const P={i:0,playing:false,voice:true,timer:null,t0:0,dur:0,raf:null};
function stopAll(){clearTimeout(P.timer);cancelAnimationFrame(P.raf);try{speechSynthesis.cancel();}catch(e){}const v=$('#stage video');if(v)v.pause();}
function startPlayer(){P.i=0;P.playing=true;$('#player').hidden=false;$('#pPlay').textContent='หยุด';showShot();}
function showShot(){stopAll();const S=ep.shots||[];if(P.i>=S.length){P.playing=false;$('#pPlay').textContent='เล่นใหม่';$('#progT').textContent='จบฉบับร่าง';return;}
  const s=S[P.i],k=String(s.n),vid=mUrl(k,'video'),img=mUrl(k,'image');
  $('#stage').innerHTML=(vid?`<video src="${vid}" autoplay muted playsinline></video>`:img?`<img class="kb" src="${img}" alt="">`:`<div class="sk"><div class="s">ช็อต ${esc(s.n)} · ${esc(s.shot)}</div><div>${esc(s.action)}</div><div class="s">ยังไม่มีภาพ</div></div>`)+(s.text?`<div class="ost">${esc(s.text)}</div>`:'')+(s.sound?`<div class="sfx">${esc(s.sound)}</div>`:'');
  P.dur=(+s.sec||2)*1000;P.t0=performance.now();
  if(P.voice&&s.narration&&'speechSynthesis' in window){try{const u=new SpeechSynthesisUtterance(s.narration);u.lang='th-TH';const tv=speechSynthesis.getVoices().find(x=>/^th/i.test(x.lang));if(tv)u.voice=tv;u.rate=1.1;u.pitch=1.15;speechSynthesis.speak(u);}catch(e){}}
  const tick=()=>{const el=performance.now()-P.t0;$('#progBar').style.width=((P.i+Math.min(1,el/P.dur))/S.length*100)+'%';$('#progT').textContent=`ช็อต ${s.n} · ${(el/1000).toFixed(1)}/${s.sec} วิ`;if(P.playing)P.raf=requestAnimationFrame(tick);};tick();
  if(P.playing)P.timer=setTimeout(()=>{P.i++;showShot();},P.dur);}
$('#pPlay').onclick=()=>{if(P.playing){P.playing=false;stopAll();$('#pPlay').textContent='เล่นต่อ';}else{if(P.i>=(ep.shots||[]).length)P.i=0;P.playing=true;$('#pPlay').textContent='หยุด';showShot();}};
$('#pNext').onclick=()=>{P.i=Math.min(P.i+1,(ep.shots||[]).length-1);showShot();};
$('#pPrev').onclick=()=>{P.i=Math.max(P.i-1,0);showShot();};
$('#pVoice').onclick=()=>{P.voice=!P.voice;$('#pVoice').textContent='เสียงอ่าน: '+(P.voice?'เปิด':'ปิด');if(!P.voice)try{speechSynthesis.cancel();}catch(e){}};
$('#pClose').onclick=()=>{P.playing=false;stopAll();$('#player').hidden=true;};

const BOT={s:null,err:'',star:false,proj:'',filled:false};

function botCfg(){try{return JSON.parse(localStorage.getItem('ss_imgbot')||'{}')||{};}catch(e){return {};}}
function botSave(c){try{localStorage.setItem('ss_imgbot',JSON.stringify(c));}catch(e){}}
function botU(p){const c=botCfg();return String(c.url||'').replace(/\/+$/,'')+p+(p.includes('?')?'&':'?')+'k='+encodeURIComponent(c.key||'');}
function botErr(e){const m=String(e&&e.message||e);return /failed to fetch|load failed|networkerror|network request/i.test(m)?'ติดต่อบอทไม่ได้ ตรวจลิงก์บอท หรือบอทยังไม่ได้ deploy':m;}
async function botApi(p,body){
  const r=await fetch(botU(p),body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{});
  if(r.status===401)throw new Error('รหัสผ่านบอทไม่ถูกต้อง');
  const j=await r.json().catch(()=>({error:'บอทตอบกลับไม่ถูกต้อง (ลิงก์ถูกไหม?)'}));
  if(!r.ok||j.error)throw new Error(j.error||('HTTP '+r.status));return j;}

function botParts(){const st=$('#botStat');if(!st)return;const S=BOT.s;
  if(BOT.err&&!S){st.innerHTML=`<h3>เชื่อมบอทไม่ได้</h3><p class="muted" style="margin:0">${esc(BOT.err)}</p><div class="row"><button class="btn sm" data-bot="reload">ลองใหม่</button><button class="btn sm" data-bot="disconnect">แก้ลิงก์/รหัส</button></div>`;return;}
  if(!S){st.innerHTML='<p class="muted" style="margin:0">กำลังเชื่อมบอท…</p>';return;}
  const s=S.settings,qd=S.jobs.filter(j=>j.status!=='failed').length,fail=S.jobs.length-qd,paused=S.now<+s.paused_until;
  const line=paused?`⏸ พักอยู่ (โควตาฟรีวันนี้หมด) · ทำต่อเองประมาณ ${tTH(s.paused_until)}`:qd?`▶️ กำลังทำงาน · เหลือ ${qd} ภาพ · ภาพถัดไปประมาณ ${tTH(Math.max(S.now,+s.last_run+s.interval_min*60000))}`:'✅ คิวว่าง';
  st.innerHTML=`<div class="row"><h3 style="margin-right:auto">🎨 บอทเจนภาพ</h3><span class="chip"><span class="dot"></span>${S.images.length} ภาพในคลัง</span></div>
    <div>${line}${fail?` · <span style="color:var(--red)">พัง ${fail}</span>`:''}${S.hasPassword?'':' · <span style="color:var(--you)">⚠️ บอทยังไม่ได้ตั้งรหัสผ่าน</span>'}</div>
    <div class="row"><button class="btn sm" data-bot="runnow">สร้างภาพถัดไปเดี๋ยวนี้</button><button class="btn sm" data-bot="resume">ทำต่อ / ลองใหม่ที่พัง</button><button class="btn sm" data-bot="clearq">ล้างคิว</button></div>
    ${S.notices.length?S.notices.slice(0,4).map(n=>`<div class="report">${esc(n.msg)} <span class="muted">${tTH(n.created)}</span></div>`).join('')+'<div><button class="btn sm" data-bot="clearn">ล้างแจ้งเตือน</button></div>':''}`;
  const ST={queued:'รอคิว',running:'กำลังสร้าง',failed:'พัง'};
  $('#botQ').innerHTML=S.jobs.length?S.jobs.slice(0,40).map(j=>`<div class="mem"><span style="min-width:0"><b>${esc(j.project)} · ฉาก ${esc(j.scene)}</b><small>${esc(String(j.prompt).slice(0,110))}${j.error?' — '+esc(j.error):''}</small></span><span class="on" style="color:${j.status==='failed'?'var(--red)':j.status==='running'?'var(--you)':'var(--muted)'}">${ST[j.status]||esc(j.status)}</span></div>`).join('')+(S.jobs.length>40?`<p class="muted" style="margin:0">และอีก ${S.jobs.length-40} งาน</p>`:''):'<p class="muted" style="margin:0">ไม่มีงานในคิว</p>';
  const projs=[...new Set(S.images.map(i=>i.project))];if(BOT.proj&&!projs.includes(BOT.proj))BOT.proj='';
  $('#bGP').innerHTML='<option value="">ทุกโปรเจกต์</option>'+projs.map(p=>`<option value="${esc(p)}"${p===BOT.proj?' selected':''}>${esc(p)}</option>`).join('');
  const im=S.images.filter(i=>(!BOT.proj||i.project===BOT.proj)&&(!BOT.star||i.starred)),g={};
  im.forEach(i=>{const k=i.project+' · '+(+i.scene?'ฉาก '+i.scene:'ภาพต้นแบบ');(g[k]=g[k]||[]).push(i);});
  $('#botG').innerHTML=Object.keys(g).length?Object.entries(g).map(([k,a])=>`<div class="sec"><span class="lab">${esc(k)}</span><span class="muted" style="font-size:13px">${esc(String(a[0].prompt).slice(0,140))}</span><div class="bgrid">${a.map(i=>botCard(i)).join('')}</div></div>`).join(''):'<p class="muted" style="margin:0">ยังไม่มีภาพ</p>';
  const sb_=document.querySelector('[data-bot="staronly"]');if(sb_)sb_.classList.toggle('main',BOT.star);
  if(!BOT.filled){$('#bChar').value=s.character||'';$('#bStyle').value=s.style||'';$('#bInt').value=s.interval_min||2;$('#bSteps').value=s.steps||4;BOT.filled=true;}}

function botThumbsFill(){const els=document.querySelectorAll('.botthumbs');if(!els.length)return;const S=BOT.s,proj=epBotProject();
  els.forEach(el=>{const k=el.dataset.k,sc=k==='char'?0:(+k||0);
    if(!S){el.innerHTML='';return;}
    const im=S.images.filter(i=>i.project===proj&&+i.scene===sc),q=S.jobs.filter(j=>j.project===proj&&+j.scene===sc&&j.status!=='failed').length;

async function botEnqueueEp(items,label){if(!items.length)return toast('ยังไม่มี prompt ให้เจน');
  const r=await botApi('/api/enqueue',{project:epBotProject(),items,variants:3,raw:true});
  const m=+((BOT.s&&BOT.s.settings&&BOT.s.settings.interval_min)||2);
  toast(`ส่ง${label}เข้าคิวแล้ว ${r.added} ภาพ · ใช้เวลาประมาณ ${Math.round(r.added*m)} นาที`);}

function b64utf8(str){return btoa(unescape(encodeURIComponent(str)));}
function blobB64(bl){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=no;r.readAsDataURL(bl);});}
async function sendToClaude(b){
  if(!botCfg().url)return toast('เชื่อมบอทเจนภาพก่อน (แท็บเจนภาพ)');
  const ping=await botApi('/api/ping');if(!ping.github)return toast('บอทยังไม่ได้ตั้ง GH_TOKEN / GH_REPO ใน Cloudflare');
  const dir='ep-'+String(ep.id).replace(/[^A-Za-z0-9]/g,'').slice(0,10);
  await signMedia();const m=ep.media||{},files=[];
  for(const k in m)for(const t of ['image','video'])if(m[k]&&m[k][t]&&urls[m[k][t]])files.push({k,t,u:urls[m[k][t]],p:m[k][t]});
  const sent=[],total=files.length+1;let n=0,fail=0;b.disabled=true;
  for(const f of files){b.textContent=`กำลังส่ง ${n+1}/${total}…`;
    try{const bl=await (await fetch(f.u)).blob();if(bl.size>45e6){fail++;continue;}
      const ext=(f.p.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');
      const name=(f.k==='char'?'char':'shot'+String(f.k).replace(/[^A-Za-z0-9]/g,'').padStart(2,'0'))+'-'+f.t+'.'+ext;
      await botApi('/api/push',{path:`${dir}/${name}`,b64:await blobB64(bl),message:`${ep.title}: ${name}`});sent.push({shot:f.k,type:f.t,file:name});n++;}
    catch(e){fail++;}}
  const {media,...info}=ep;
  const man={...info,exported_at:new Date().toISOString(),files:sent};
  b.textContent=`กำลังส่ง ${total}/${total}…`;
  await botApi('/api/push',{path:`${dir}/manifest.json`,b64:b64utf8(JSON.stringify(man,null,2)),message:`${ep.title}: manifest`});
  await botApi('/api/push',{path:'latest.json',b64:b64utf8(JSON.stringify({dir,title:ep.title,at:man.exported_at},null,2)),message:`latest: ${ep.title}`});
  b.disabled=false;b.textContent='📤 ส่งภาพและคลิปของตอนนี้ให้ Claude';
  toast(fail?`ส่งแล้ว ${n} ไฟล์ (ไม่สำเร็จ ${fail}) · บอก Claude ว่า "ส่งตอนแล้ว"`:`ส่งครบ ${n} ไฟล์ + บท · บอก Claude ในแชทว่า "ส่งตอนแล้ว"`);}

function botView(src){let v=$('#bview');if(!v){v=document.createElement('div');v.id='bview';v.onclick=()=>v.remove();document.body.appendChild(v);}v.innerHTML=`<img src="${esc(src)}" alt="">`;}

function sure(b,txt){if(b.dataset.sure==='1')return true;const o=b.textContent;b.dataset.sure='1';b.textContent=txt;setTimeout(()=>{if(b.isConnected){b.dataset.sure='';b.textContent=o;}},4000);return false;}

document.addEventListener('change',e=>{if(e.target.id==='bGP'){BOT.proj=e.target.value;botParts();}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-bot],[data-use]');if(!b)return;
  try{
    if(b.dataset.use){const [k,id,starred]=b.dataset.use.split('|');if(!ep)return;
      b.disabled=true;b.textContent='กำลังใส่…';
      const r=await fetch(botU('/img/'+id));if(!r.ok)throw new Error('โหลดภาพจากบอทไม่ได้');
      const bl=await r.blob(),ty=bl.type||'image/jpeg',f=new File([bl],`flux-${id}.${ty.includes('png')?'png':ty.includes('webp')?'webp':'jpg'}`,{type:ty});
      if(starred!=='1')botApi('/api/star',{id:+id}).catch(()=>{});
      await upload(k,'image',f);return botLoad();}
    const a=b.dataset.bot,id=+b.dataset.id;
    switch(a){
      case 'view':return botView(b.src);
      case 'gotogen':return setView('gen');
      case 'sendclaude':return await sendToClaude(b);
      case 'connect':{let u=$('#botUrl').value.trim();const k=$('#botKey').value;if(!u)return toast('ใส่ลิงก์บอทก่อน');
        if(!/^https?:\/\//i.test(u))u='https://'+u;u=u.replace(/\/+$/,'');botSave({url:u,key:k});$('#botMsg').textContent='กำลังทดสอบ…';
        try{await botApi('/api/ping');BOT.s=null;BOT.err='';toast('เชื่อมบอทแล้ว');renderGen();}catch(err){botSave({});$('#botMsg').textContent='เชื่อมไม่ได้: '+botErr(err);}return;}
      case 'disconnect':if(!sure(b,'กดอีกครั้งเพื่อยืนยัน'))return;botSave({});BOT.s=null;BOT.err='';return renderGen();
      case 'reload':BOT.err='';BOT.s=null;botParts();break;
      case 'staronly':BOT.star=!BOT.star;return botParts();
      case 'zipstar':case 'zipall':location.href=botU('/api/zip?project='+encodeURIComponent(BOT.proj)+(a==='zipstar'?'&starred=1':''));return;
      case 'enqueue':{const lines=$('#bLines').value;if(!lines.trim())return toast('ใส่ prompt ก่อน');
        const proj=$('#bProj').value.trim()||'โปรเจกต์ใหม่',add=$('#bAdd').checked,variants=+$('#bVar').value;
        let r;if(add)r=await botApi('/api/enqueue',{project:proj,lines,variants});
        else{const L=lines.split('\n').map(x=>x.trim()).filter(Boolean),S=BOT.s||{images:[],jobs:[]};
          let mx=0;[...S.images,...S.jobs].forEach(x=>{if(x.project===proj)mx=Math.max(mx,+x.scene||0);});
          r=await botApi('/api/enqueue',{project:proj,items:L.map((p,i)=>({scene:mx+i+1,prompt:p})),variants,raw:true});}
        $('#bLines').value='';toast(`เพิ่มเข้าคิว ${r.added} ภาพ`);break;}
      case 'runnow':{b.disabled=true;b.textContent='กำลังสร้าง… (5–20 วินาที)';const r=await botApi('/api/runnow',{});
        toast(r.done?'ได้ภาพใหม่แล้ว':r.paused?'โควตาฟรีวันนี้หมดแล้ว':r.skipped==='empty'?'ไม่มีงานในคิว':r.error?'สร้างไม่สำเร็จ: '+r.error:'เรียบร้อย');break;}
      case 'resume':await botApi('/api/resume',{});toast('บอทกลับมาทำงานต่อแล้ว');break;
      case 'clearq':if(!sure(b,'กดอีกครั้งเพื่อล้างคิว'))return;await botApi('/api/clearqueue',{});toast('ล้างคิวแล้ว');break;
      case 'clearn':await botApi('/api/clearnotices',{});break;
      case 'star':await botApi('/api/star',{id});break;
      case 'regen':await botApi('/api/regen',{id});toast('เพิ่มเข้าคิวเจนใหม่แล้ว');break;
      case 'del':if(!sure(b,'ลบ?'))return;await botApi('/api/delete',{id});break;
      case 'save':await botApi('/api/settings',{character:$('#bChar').value,style:$('#bStyle').value,interval_min:Math.max(1,+$('#bInt').value||1),steps:Math.min(8,Math.max(1,+$('#bSteps').value||4))});toast('บันทึกแล้ว');BOT.filled=false;break;
      case 'epall':await botEnqueueEp((ep.shots||[]).filter(s=>s.image_prompt).map(s=>({scene:+s.n||0,prompt:s.image_prompt})),'ทุกช็อต');break;
      case 'epone':{const s=(ep.shots||[]).find(x=>String(x.n)===b.dataset.n);if(!s)return;await botEnqueueEp([{scene:+s.n||0,prompt:s.image_prompt}],`ช็อต ${s.n} `);break;}
      case 'epchar':await botEnqueueEp([{scene:0,prompt:ep.character_sheet_prompt}],'ภาพต้นแบบ');break;
      default:return;}
    await botLoad();
  }catch(err){toast(botErr(err));if(b.dataset.use){b.disabled=false;b.textContent='ใช้ภาพนี้';}if(b.dataset.bot==='runnow'){botLoad();}if(b.dataset.bot==='sendclaude'){b.disabled=false;b.textContent='📤 ส่งภาพและคลิปของตอนนี้ให้ Claude';}}
});

boot();
})();
</script>
</body>
</html>
