<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Xire.ai Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Kanit', sans-serif; background: #f8f6f3; color: #2c2c2c; }
header { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; background: #fff; border-bottom: 1px solid #eee; }
.logo { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 600; }
nav a { color: #2c2c2c; text-decoration: none; margin-left: 28px; font-size: 15px; }
.container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
h1 { font-family: 'Playfair Display', serif; font-size: 36px; margin-bottom: 8px; }
.sub { color: #777; margin-bottom: 32px; }
.card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
.card h2 { font-size: 20px; margin-bottom: 12px; }
.btn { display: inline-block; background: #2c2c2c; color: #fff; padding: 12px 28px; border-radius: 999px; text-decoration: none; font-size: 15px; margin-top: 12px; border: none; cursor: pointer; }
.btn:hover { background: #444; }
.btn-full { width: 100%; text-align: center; }
textarea, input[type=text], select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; margin: 8px 0; }
.conn { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.conn span { background: #f4f2ef; padding: 6px 12px; border-radius: 999px; font-size: 13px; }
.parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 16px; }
.part { background: #f4f2ef; border-radius: 10px; padding: 16px; text-align: center; }
.part b { display: block; font-size: 16px; margin-bottom: 4px; }
.part small { color: #777; }
.status { margin-top: 12px; padding: 12px; background: #f0f7f0; border-radius: 8px; color: #1a7a3a; display: none; }
footer { text-align: center; padding: 40px; color: #999; font-size: 13px; }
</style>
</head>
<body>
<header>
<div class="logo">Xire.ai</div>
<nav>
<a href="index.html">หน้าหลัก</a>
</nav>
</header>

<div class="container">
<h1>Studio</h1>
<p class="sub">ระบบใหม่ · เชื่อม Cloudflare · Supabase · Kaggle · Flux + SDXL</p>

<div class="card">
<h2>สถานะระบบ</h2>
<div class="conn">
<span>Cloudflare Pages</span>
<span>Supabase</span>
<span>Kaggle</span>
<span>Flux + SDXL</span>
</div>
<p style="color:#777;font-size:14px;margin-top:8px">ระบบตัวละคร ฉาก LoRA และบทเก่าถูกลบออกแล้ว จะสร้างใหม่ทั้งหมด</p>
</div>

<div class="card">
<h2>สร้างซีรีส์ใหม่</h2>
<input type="text" id="title" placeholder="ชื่อเรื่อง">
<textarea id="story" rows="5" placeholder="เขียนเนื้อเรื่องที่นี่..."></textarea>
<select id="partsCount">
<option value="5">5 พาร์ท TikTok (ซีนละ 3 นาที)</option>
<option value="3">3 พาร์ท</option>
<option value="8">8 พาร์ท</option>
<option value="10">10 พาร์ท</option>
</select>
<button class="btn btn-full" onclick="createNew()">สร้างใหม่</button>
<div class="status" id="status"></div>
</div>

<div class="card">
<h2>พาร์ท TikTok</h2>
<div class="parts" id="partsList"></div>
</div>
</div>

<footer>Xire.ai Studio · New System</footer>

<script>
function createNew() {
  const title = document.getElementById('title').value || 'เรื่องใหม่';
  const count = +document.getElementById('partsCount').value;
  const status = document.getElementById('status');
  const list = document.getElementById('partsList');

  status.style.display = 'block';
  status.textContent = 'กำลังเตรียมระบบใหม่...';

  setTimeout(() => {
    list.innerHTML = '';
    for (let i = 1; i <= count; i++) {
      list.innerHTML += `<div class="part"><b>Part ${i}/${count}</b><small>3 นาที</small></div>`;
    }
    status.textContent = `พร้อมสร้าง "${title}" · ${count} พาร์ท`;
  }, 800);
}
</script>
</body>
</html>
