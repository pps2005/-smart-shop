<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Xire.ai Studio · Netflix Level</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Kanit', sans-serif; background: #f8f6f3; color: #2c2c2c; }
header { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; background: #fff; border-bottom: 1px solid #eee; }
.logo { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 600; }
nav a { color: #2c2c2c; text-decoration: none; margin-left: 28px; font-size: 15px; }
.container { max-width: 960px; margin: 40px auto; padding: 0 20px; }
h1 { font-family: 'Playfair Display', serif; font-size: 36px; margin-bottom: 8px; }
.sub { color: #777; margin-bottom: 32px; }
.card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
.card h2 { font-size: 20px; margin-bottom: 12px; }
.btn { display: inline-block; background: #2c2c2c; color: #fff; padding: 12px 28px; border-radius: 999px; text-decoration: none; font-size: 15px; margin-top: 12px; border: none; cursor: pointer; }
.btn:hover { background: #444; }
.btn-full { width: 100%; text-align: center; }
.btn-small { padding: 8px 16px; font-size: 13px; }
textarea, input[type=text], input[type=file], select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; margin: 8px 0; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 200px; }
.conn { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.conn span { background: #f4f2ef; padding: 6px 12px; border-radius: 999px; font-size: 13px; }
.conn span.backup { background: #fff3e0; }
.parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
.part { background: #f4f2ef; border-radius: 10px; padding: 12px; text-align: center; }
.part b { display: block; font-size: 15px; margin-bottom: 4px; }
.part small { color: #777; display: block; }
.part img { width: 100%; border-radius: 6px; margin-top: 8px; }
.part.pending { opacity: 0.7; }
.part.done { background: #e8f5e9; }
.part.error { background: #ffebee; }
.status { margin-top: 12px; padding: 12px; background: #f0f7f0; border-radius: 8px; color: #1a7a3a; display: none; white-space: pre-wrap; font-size: 13px; }
.saved { font-size: 13px; color: #777; margin-top: 8px; }
.history { margin-top: 12px; }
.hist-item { padding: 10px; background: #f4f2ef; border-radius: 8px; margin-bottom: 8px; cursor: pointer; font-size: 14px; }
.hist-item:hover { background: #eee; }
.note { background: #fff8e1; padding: 12px; border-radius: 8px; font-size: 13px; margin-top: 12px; }
.storyboard { margin-top: 16px; }
.scene { background: #f4f2ef; padding: 12px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
footer { text-align: center; padding: 40px; color: #999; font-size: 13px; }
label { font-size: 13px; color: #555; display: block; margin-top: 8px; }
</style>
</head>
<body>
<header>
<div class="logo">Xire.ai</div>
<nav>
<a href="index.html">หน้าหลัก</a>
<a href="https://anime-image-bot.kandanai697.workers.dev" target="_blank">Worker</a>
</nav>
</header>

<div class="container">
<h1>Studio</h1>
<p class="sub">ระบบสร้างจริง · เชื่อม API Worker แล้ว</p>

<div class="card">
<h2>สถานะระบบ</h2>
<div class="conn">
<span>Cloudflare Pages</span>
<span>Supabase</span>
<span class="backup">Kaggle (GPU สำรอง)</span>
<span class="backup">Flux (สำรอง)</span>
<span>SDXL</span>
</div>
<button class="btn btn-small" onclick="testWorker()">ทดสอบ Worker</button>
<div class="status" id="testResult"></div>
</div>

<div class="card">
<h2>1. ตัวละครคงที่</h2>
<label>คำอธิบายตัวละคร</label>
<textarea id="character" rows="3" placeholder="1girl, long black hair, brown eyes, white hoodie"></textarea>
<label>รูปอ้างอิง</label>
<input type="file" id="refImage" accept="image/*">
<div class="row">
<select id="consistency">
<option value="ip-adapter">IP-Adapter FaceID</option>
<option value="lora">LoRA</option>
<option value="prompt-only">Prompt เท่านั้น</option>
</select>
<select id="consistencyStrength">
<option value="0.6">0.6</option>
<option value="0.8" selected>0.8</option>
<option value="1.0">1.0</option>
</select>
</div>
</div>

<div class="card">
<h2>2-4. ControlNet / วิดีโอ / เสียง</h2>
<div class="row">
<select id="controlPose">
<option value="">ไม่คุมท่า</option>
<option value="openpose">OpenPose</option>
</select>
<select id="videoType">
<option value="image">ภาพนิ่ง</option>
<option value="animatediff">AnimateDiff</option>
<option value="svd">SVD</option>
</select>
<select id="tts">
<option value="none">ไม่พากย์</option>
<option value="edge">Edge TTS</option>
</select>
<select id="subtitle">
<option value="thai" selected>ซับไทย</option>
<option value="none">ไม่มีซับ</option>
</select>
</div>
</div>

<div class="card">
<h2>สร้างซีรีส์</h2>
<input type="text" id="title" placeholder="ชื่อเรื่อง">
<textarea id="story" rows="5" placeholder="เขียนเนื้อเรื่อง..."></textarea>
<div class="row">
<select id="template">
<option value="netflix-kdrama">Netflix เกาหลี</option>
<option value="netflix-jdrama">Netflix ญี่ปุ่น</option>
<option value="anime-high">อนิเมะ</option>
<option value="cinematic">Cinematic</option>
</select>
<select id="partsCount">
<option value="5">5 พาร์ท</option>
<option value="3">3 พาร์ท</option>
<option value="8">8 พาร์ท</option>
</select>
<select id="model">
<option value="sdxl">SDXL</option>
<option value="flux">Flux</option>
<option value="kaggle">Kaggle</option>
</select>
</div>
<button class="btn btn-small" onclick="generateStoryboard()">สร้าง Storyboard</button>
<div class="storyboard" id="storyboard"></div>
<label><input type="checkbox" id="qualityCheck" checked> ตรวจคุณภาพ</label>
<button class="btn" onclick="saveStory()">บันทึก</button>
<button class="btn btn-full" onclick="startFullPipeline()">สร้างทั้งหมดจริง</button>
<div class="saved" id="savedInfo"></div>
<div class="status" id="status"></div>
</div>

<div class="card">
<h2>เรื่องที่บันทึก</h2>
<div class="history" id="historyList"></div>
</div>

<div class="card">
<h2>คิวการสร้าง</h2>
<div class="parts" id="partsList"></div>
<button class="btn" onclick="openWorker()">เปิด Worker ดูผล</button>
<button class="btn" onclick="checkQueue()" style="margin-left:8px">ตรวจสถานะคิว</button>
</div>
</div>

<footer>Xire.ai Studio · Real Generation</footer>

<script>
const WORKER = 'https://anime-image-bot.kandanai697.workers.dev';

const TEMPLATES = {
  'netflix-kdrama': 'cinematic realistic Korean drama, teal and orange, 16:9, Rembrandt lighting, 85mm, film still',
  'netflix-jdrama': 'cinematic Japanese drama, muted tones, 16:9, soft lighting, 35mm',
  'anime-high': 'anime style high quality, detailed, masterpiece, dynamic',
  'cinematic': 'cinematic movie still, film grain, 16:9, golden hour, anamorphic'
};

function buildPrompt(title, part, total, scene) {
  const char = document.getElementById('character').value.trim();
  const style = TEMPLATES[document.getElementById('template').value] || TEMPLATES['netflix-kdrama'];
  let p = `masterpiece, best quality, 8k, ${style}, ${title} scene ${part}/${total}, ${scene}`;
  if (char) p += `, ${char}`;
  return p;
}

function generateStoryboard() {
  const story = document.getElementById('story').value.trim();
  const count = +document.getElementById('partsCount').value;
  const el = document.getElementById('storyboard');
  if (!story) return;
  const sentences = story.split(/[.!?ๆ\n]+/).filter(s => s.trim().length > 8);
  const per = Math.max(1, Math.ceil(sentences.length / count));
  el.innerHTML = '';
  for (let i = 1; i <= count; i++) {
    const chunk = sentences.slice((i-1)*per, i*per).join('. ');
    el.innerHTML += `<div class="scene"><b>ซีน ${i}</b>: ${chunk.slice(0,100)}</div>`;
  }
}

function getHistory() { return JSON.parse(localStorage.getItem('xire_history') || '[]'); }
function setHistory(h) { localStorage.setItem('xire_history', JSON.stringify(h.slice(0,10))); }
function getQueue() { return JSON.parse(localStorage.getItem('xire_queue') || '[]'); }
function setQueue(q) { localStorage.setItem('xire_queue', JSON.stringify(q)); }

function saveStory() {
  const data = {
    title: document.getElementById('title').value || 'เรื่องใหม่',
    story: document.getElementById('story').value,
    character: document.getElementById('character').value,
    parts: +document.getElementById('partsCount').value,
    template: document.getElementById('template').value,
    time: new Date().toLocaleString('th-TH')
  };
  localStorage.setItem('xire_story', JSON.stringify(data));
  const h = getHistory(); h.unshift(data); setHistory(h);
  document.getElementById('savedInfo').textContent = 'บันทึกแล้ว';
  renderHistory();
}

function loadStory(data) {
  if (!data) { const raw = localStorage.getItem('xire_story'); if (!raw) return; data = JSON.parse(raw); }
  document.getElementById('title').value = data.title || '';
  document.getElementById('story').value = data.story || '';
  document.getElementById('character').value = data.character || '';
  document.getElementById('partsCount').value = data.parts || 5;
  document.getElementById('template').value = data.template || 'netflix-kdrama';
}

function renderHistory() {
  const h = getHistory();
  document.getElementById('historyList').innerHTML = h.length ? h.map((s,i) =>
    `<div class="hist-item" onclick="loadFromHistory(${i})"><b>${s.title}</b><br><small>${s.parts} พาร์ท · ${s.time}</small></div>`
  ).join('') : 'ยังไม่มี';
}
function loadFromHistory(i) { const h = getHistory(); if (h[i]) loadStory(h[i]); }

function updatePart(i, status, msg) {
  const el = document.getElementById(`part-${i}`);
  if (!el) return;
  el.className = `part ${status}`;
  el.querySelector('small').textContent = msg || status;
}

async function testWorker() {
  const el = document.getElementById('testResult');
  el.style.display = 'block';
  try {
    const res = await fetch(WORKER + '/api/state');
    const data = await res.json();
    el.textContent = `Worker พร้อม\nคิว: ${data.queue?.length || 0} รายการ`;
  } catch (e) {
    el.textContent = 'เชื่อมไม่ได้: ' + e.message;
  }
}

function openWorker() { window.open(WORKER, '_blank'); }

async function checkQueue() {
  try {
    const res = await fetch(WORKER + '/api/state');
    const data = await res.json();
    alert(`คิวใน Worker: ${data.queue?.length || 0} รายการ`);
  } catch (e) {
    alert('ตรวจคิวไม่ได้');
  }
}

async function startFullPipeline() {
  saveStory();
  const title = document.getElementById('title').value || 'เรื่องใหม่';
  const story = document.getElementById('story').value || '';
  const count = +document.getElementById('partsCount').value;
  const status = document.getElementById('status');
  const list = document.getElementById('partsList');

  status.style.display = 'block';
  status.textContent = 'กำลังส่งไปที่ Worker...';

  const sentences = story.split(/[.!?ๆ\n]+/).filter(s => s.trim().length > 5);
  const per = Math.max(1, Math.ceil(sentences.length / count));
  const lines = [];

  list.innerHTML = '';
  for (let i = 1; i <= count; i++) {
    list.innerHTML += `<div class="part pending" id="part-${i}"><b>Part ${i}</b><small>รอ</small></div>`;
    const chunk = sentences.slice((i-1)*per, i*per).join('. ').slice(0, 150);
    lines.push(buildPrompt(title, i, count, chunk));
  }

  try {
    // ส่งเข้าคิวจริง
    const enq = await fetch(WORKER + '/api/enqueue', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        project: title,
        lines: lines,
        variants: 1
      })
    });
    const enqData = await enq.json();

    if (enqData.ok) {
      status.textContent = `ส่งเข้าคิวแล้ว ${enqData.added} ซีน\nกำลังสั่งสร้าง...`;
      // สั่งให้สร้างทันที
      await fetch(WORKER + '/api/runnow', { method: 'POST' });
      for (let i = 1; i <= count; i++) {
        updatePart(i, 'done', 'ส่งคิวแล้ว');
      }
      status.textContent = `ส่งเข้าคิวและสั่งสร้างแล้ว\nเปิด Worker เพื่อดูผลรูป`;
    } else {
      status.textContent = 'ส่งคิวไม่สำเร็จ';
    }
  } catch (e) {
    status.textContent = 'เชื่อมไม่ได้: ' + e.message;
  }
}

loadStory();
renderHistory();
</script>
</body>
</html>
