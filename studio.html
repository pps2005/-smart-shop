<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>สตูดิโอ · SMART SHOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600&family=Sarabun:wght@400;600&display=swap">
<style>
:root{
  --bg:#F3F1EC; --card:#FFFFFF; --ink:#1D1B18; --muted:#635E56; --line:#DDD8CF;
  --red:#B8322A; --red-ink:#FFFFFF; --soft:#F8E7E4; --ok:#2E7A4B; --okbg:#E3F2E8; --warn:#9A6400; --warnbg:#FBF0D9;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#171614; --card:#211F1C; --ink:#F1EEE8; --muted:#ADA69B; --line:#38342F;
  --red:#E0574D; --red-ink:#1A0806; --soft:#3A2220; --ok:#6BCB8F; --okbg:#1E3326; --warn:#E8B04C; --warnbg:#3A2E16; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Sarabun,system-ui,sans-serif;font-size:18px;line-height:1.6;padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:Kanit,Sarabun,sans-serif;font-weight:600;margin:0;line-height:1.3}
.wrap{max-width:980px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.bar h1{font-size:24px;flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn.main{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.small{min-height:40px;padding:6px 14px;font-size:16px}
.btn:disabled{opacity:.5}
main{padding-block:20px 60px;display:grid;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;min-width:0}
.muted{color:var(--muted)}
.pill{display:inline-block;font-size:15px;font-weight:600;padding:3px 12px;border-radius:999px}
.pill.draft{background:var(--warnbg);color:var(--warn)} .pill.revise{background:var(--soft);color:var(--red)}
.pill.approved{background:var(--okbg);color:var(--ok)} .pill.posted{background:var(--okbg);color:var(--ok)}
.list{display:grid;gap:12px}
.ep{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%}
.ep h3{font-size:20px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tabs button{white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
textarea,input[type=email],input[type=password]{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
textarea{min-height:110px}
.prompt{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.prompt code{font-family:ui-monospace,Menlo,monospace;font-size:14px;white-space:pre-wrap;word-break:break-word}
.prompt .k{font-size:14px;font-weight:600;color:var(--muted)}
.team{display:grid;gap:10px}
.team div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
@media (max-width:560px){.team div{grid-template-columns:1fr;gap:2px}}
.team b{font-family:Kanit,sans-serif;font-weight:500;color:var(--red)}
.shot{border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:70px minmax(0,1fr)}
.shot .no{background:var(--bg);display:grid;align-content:start;justify-items:center;padding:14px 4px;border-right:1px solid var(--line)}
.shot .no b{font-family:Kanit,sans-serif;font-size:28px}
.shot .bd{padding:14px;display:grid;gap:10px;min-width:0}
.media{display:flex;gap:10px;flex-wrap:wrap}
.slot{width:120px;aspect-ratio:9/16;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;font-size:14px;color:var(--muted);overflow:hidden;cursor:pointer;background:var(--bg);padding:6px}
.slot img,.slot video{width:100%;height:100%;object-fit:cover}
.tag{font-size:14px;padding:2px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.player{position:fixed;inset:0;background:#000;z-index:20;display:grid;grid-template-rows:1fr auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.stage{position:relative;margin:auto;height:100%;max-height:calc(100vh - 120px);aspect-ratio:9/16;max-width:100vw;overflow:hidden;background:#111;border-radius:8px}
.stage img,.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage img.kb{animation:kb 6s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.stage img.kb{animation:none}}
.stage .sketch{position:absolute;inset:0;display:grid;align-content:center;gap:12px;padding:24px;color:#eee;text-align:center;background:radial-gradient(circle at 50% 40%,#3a3530,#151311)}
.stage .sketch .s{font-family:Kanit,sans-serif;font-size:15px;color:#e8a29b;letter-spacing:.05em}
.stage .sketch .a{font-size:20px}
.stage .ost{position:absolute;left:8%;right:8%;top:16%;text-align:center;font-family:Kanit,sans-serif;font-size:26px;color:#fff;text-shadow:0 0 4px #000,0 2px 6px #000}
.stage .sfx{position:absolute;left:8px;right:8px;bottom:10px;font-size:13px;color:#ccc;text-align:center;background:rgba(0,0,0,.45);border-radius:6px;padding:2px 6px}
.stage .num{position:absolute;top:8px;left:8px;font-size:13px;color:#fff;background:rgba(0,0,0,.5);border-radius:6px;padding:2px 8px}
.ctrl{display:flex;gap:10px;justify-content:center;align-items:center;padding:12px;flex-wrap:wrap}
.ctrl .btn{min-width:90px}
.prog{height:6px;background:#333;border-radius:3px;overflow:hidden;width:min(420px,80vw)}
.prog i{display:block;height:100%;background:var(--red);width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:30}
.howto{margin:0;padding-left:22px;display:grid;gap:6px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="wrap bar">
  <a class="btn small" href="index.html">← หน้าหลัก</a>
  <h1>สตูดิโอทำคลิป</h1>
  <button class="btn small" id="logoutBtn" hidden>ออกจากระบบ</button>
</div></header>

<main class="wrap" id="app">
  <div class="card"><p class="muted" style="margin:0">กำลังโหลด…</p></div>
</main>

<div class="player" id="player" hidden>
  <div class="stage" id="stage"></div>
  <div>
    <div class="ctrl"><div class="prog"><i id="progBar"></i></div><span id="progT" style="color:#ccc;font-size:15px"></span></div>
    <div class="ctrl">
      <button class="btn small" id="pPrev">ช็อตก่อน</button>
      <button class="btn small main" id="pPlay">หยุด</button>
      <button class="btn small" id="pNext">ช็อตถัดไป</button>
      <button class="btn small" id="pVoice">เสียงอ่าน: เปิด</button>
      <button class="btn small" id="pClose">ปิด</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
// ===== ตั้งค่า Supabase ของร้าน (คีย์นี้เป็นคีย์สาธารณะ ใช้ในหน้าเว็บได้) =====
const SUPABASE_URL = "https://tnfjosnpjjrmyxshfzlz.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuZmpvc25wampybXl4c2hmemx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2NTczNDcsImV4cCI6MjEwOTIzMzM0N30.wNjYOuiu4Z2OO0vF5t4c9YMTiJl0Uhuw1lymZUyg8xc";
const BUCKET = "studio-media";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATUS = {draft:"ฉบับร่าง", revise:"รอ Claude แก้", approved:"อนุมัติเป็นต้นฉบับ", posted:"โพสต์แล้ว"};
let user=null, episodes=[], ep=null, tab="overview", urls={};

function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800);}
async function copy(text){try{await navigator.clipboard.writeText(text);toast("คัดลอกแล้ว");}catch(e){toast("คัดลอกไม่ได้ ให้กดค้างที่ข้อความแล้วเลือกคัดลอก");}}
function copyBox(k,t){return t?`<div class="prompt"><span class="k">${esc(k)}</span><code>${esc(t)}</code><div><button class="btn small" data-copy="${esc(t)}">คัดลอก</button></div></div>`:"";}

/* ---------- เข้าสู่ระบบ ---------- */
async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ showLogin(); return; }
  user = session.user; $("#logoutBtn").hidden=false;
  await loadList();
}
function showLogin(){
  $("#app").innerHTML=`<form class="card" id="loginForm" style="max-width:480px">
    <h2>เข้าสู่ระบบร้าน</h2><p class="muted" style="margin:0">ใช้อีเมลและรหัสผ่านเดียวกับหน้าหลักของ SMART SHOP</p>
    <input type="email" id="em" placeholder="อีเมล" autocomplete="email" required>
    <input type="password" id="pw" placeholder="รหัสผ่าน" autocomplete="current-password" required>
    <button class="btn main" type="submit">เข้าสู่ระบบ</button><p class="muted" id="loginErr" style="margin:0"></p></form>`;
  $("#loginForm").onsubmit=async e=>{e.preventDefault();
    const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
    if(error){$("#loginErr").textContent="เข้าสู่ระบบไม่สำเร็จ ตรวจอีเมลและรหัสผ่านอีกครั้ง";return;}
    boot();};
}
$("#logoutBtn").onclick=async()=>{await sb.auth.signOut();location.reload();};

/* ---------- รายการตอน ---------- */
async function loadList(){
  const {data,error}=await sb.from("studio_episodes").select("id,title,status,version,logline,updated_at").order("created_at",{ascending:false});
  if(error){$("#app").innerHTML=`<div class="card"><h2>โหลดงานไม่สำเร็จ</h2><p class="muted">${esc(error.message)}</p></div>`;return;}
  episodes=data||[];
  const id=new URLSearchParams(location.search).get("ep");
  if(id && episodes.some(e=>e.id===id)) return openEp(id);
  renderList();
}
function renderList(){
  ep=null; history.replaceState(null,"","studio.html");
  $("#app").innerHTML=`<div class="card"><h2>งานทั้งหมด</h2>
    <p class="muted" style="margin:0">Claude และทีม AI คิดเรื่อง ตัวละคร และ prompt ให้ครบ คุณกดเจนตาม prompt ในแอปฟรี แล้วอัปโหลดกลับมาที่นี่ ดูฉบับร่างได้ตลอด ถ้าอยากแก้ให้พิมพ์บอก พอโอเคแล้วกดอนุมัติเป็นต้นฉบับ</p></div>
    <div class="list">${episodes.length?episodes.map(e=>`<button class="card ep" data-open="${e.id}">
      <div style="min-width:0"><h3>${esc(e.title)}</h3><div class="muted">${esc(e.logline||"")}</div></div>
      <span class="pill ${e.status}">${STATUS[e.status]||e.status}</span></button>`).join("")
      :`<div class="card"><h3>ยังไม่มีงาน</h3><p class="muted" style="margin:0">บอก Claude ในแชทว่า "ทำตอนใหม่ลงสตูดิโอ" งานจะมาขึ้นที่นี่</p></div>`}</div>`;
}

/* ---------- เปิดตอน ---------- */
async function openEp(id){
  const {data,error}=await sb.from("studio_episodes").select("*").eq("id",id).single();
  if(error){toast("เปิดงานไม่สำเร็จ");return renderList();}
  ep=data; history.replaceState(null,"","studio.html?ep="+id);
  await signMedia(); renderEp();
}
async function signMedia(){
  const paths=[];const m=ep.media||{};
  for(const k in m){for(const t of ["image","video"]) if(m[k]&&m[k][t]) paths.push(m[k][t]);}
  urls={}; if(!paths.length) return;
  const {data}=await sb.storage.from(BUCKET).createSignedUrls(paths,3600);
  (data||[]).forEach(d=>{if(d.signedUrl) urls[d.path]=d.signedUrl;});
}
function mediaUrl(key,type){const p=ep.media&&ep.media[key]&&ep.media[key][type];return p?urls[p]:null;}

function renderEp(){
  const shots=ep.shots||[];const total=shots.reduce((a,s)=>a+(+s.sec||0),0);
  const done=shots.filter(s=>mediaUrl(String(s.n),"video")).length, imgs=shots.filter(s=>mediaUrl(String(s.n),"image")).length;
  const T={overview:"ภาพรวม",team:"รายงานทีม",character:"ตัวละคร",shots:"ช็อตและ prompt",post:"เพลงและแคปชัน"};
  let body="";
  if(tab==="overview") body=`
    <div class="card"><div class="row"><span class="pill ${ep.status}">${STATUS[ep.status]}</span><span class="muted">ฉบับที่ ${ep.version} · ${shots.length} ช็อต · ${Math.round(total)} วินาที · ${esc(ep.format?.ar||"9:16")}</span></div>
      <p style="margin:0;font-size:20px">${esc(ep.logline)}</p><p class="muted" style="margin:0">${esc(ep.why)}</p>
      <div class="row"><button class="btn main" data-act="play">▶ ดูฉบับร่าง</button></div>
      <p class="muted" style="margin:0">ฉบับร่างจะเล่นทีละช็อตตามเวลา ช็อตที่อัปโหลดคลิปแล้วจะเล่นคลิปจริง ช็อตที่มีแต่ภาพจะเล่นภาพนิ่ง ช็อตที่ยังไม่มีอะไรจะขึ้นคำบรรยายฉาก ตอนนี้มีภาพ ${imgs}/${shots.length} ช็อต คลิป ${done}/${shots.length} ช็อต</p></div>
    <div class="card"><h3>ขั้นตอนของคุณ</h3><ol class="howto">
      <li>แท็บ "ตัวละคร" คัดลอก prompt ไปเจนภาพต้นแบบของมายด์ แล้วอัปโหลดภาพที่ชอบที่สุด</li>
      <li>แท็บ "ช็อตและ prompt" เจนภาพแต่ละช็อต โดยแนบภาพต้นแบบเป็นภาพอ้างอิง แล้วอัปโหลด</li>
      <li>เอาภาพของแต่ละช็อตไปทำวิดีโอด้วย video prompt แล้วอัปโหลดคลิป</li>
      <li>กด "ดูฉบับร่าง" ถ้าอยากแก้ พิมพ์บอกด้านล่าง แล้วบอก Claude ในแชทว่า "แก้ตามฟีดแบ็กในสตูดิโอ"</li>
      <li>พอโอเคแล้ว กด "อนุมัติเป็นต้นฉบับ" แล้วไปตัดต่อรวมใน CapCut ตามแท็บ "เพลงและแคปชัน"</li></ol></div>
    <div class="card"><h3>อยากให้แก้อะไร</h3>
      ${ep.feedback?`<div class="prompt"><span class="k">ฟีดแบ็กล่าสุด ${ep.status==="revise"?"(รอ Claude แก้)":""}</span><code>${esc(ep.feedback)}</code></div>`:""}
      <textarea id="fb" placeholder="เช่น ช็อต 6 อยากให้หมุนช้ากว่านี้ หรือ เปลี่ยนตอนจบให้ลุงเป็นคนลื่นแทน"></textarea>
      <div class="row"><button class="btn" data-act="feedback">ส่งให้ Claude แก้</button>
        ${ep.status!=="approved"&&ep.status!=="posted"?`<button class="btn ok" data-act="approve">✓ อนุมัติเป็นต้นฉบับ</button>`:""}
        ${ep.status==="approved"?`<button class="btn ok" data-act="posted">โพสต์แล้ว</button>`:""}</div></div>`;
  if(tab==="team") body=`<div class="card"><h3>หัวหน้าแต่ละทีมรายงาน</h3><div class="team">${(ep.team_notes||[]).map(t=>`<div><b>${esc(t.team)}</b><span>${esc(t.note)}</span></div>`).join("")}</div></div>`;
  if(tab==="character") body=`<div class="card"><h3>ตัวละครหลัก</h3>
      <p class="muted" style="margin:0">เจนภาพต้นแบบก่อน 1 ภาพ แล้วใช้ภาพนี้เป็นภาพอ้างอิง (reference) ทุกช็อต หน้าตัวละครจะได้เหมือนกันทุกช็อต</p>
      ${copyBox("Prompt ภาพต้นแบบตัวละคร (character sheet)",ep.character_sheet_prompt)}
      ${copyBox("คำบรรยายตัวละคร (มีอยู่ในทุก prompt แล้ว)",ep.character)}
      <div class="media">${slot("char","image","ภาพต้นแบบ")}</div></div>`;
  if(tab==="shots") body=`<div class="card"><div class="row"><button class="btn small" data-copy="${esc(shots.map(s=>"#"+s.n+"\n"+s.image_prompt).join("\n\n"))}">คัดลอก image prompt ทุกช็อต</button>
      <button class="btn small" data-copy="${esc(shots.map(s=>"#"+s.n+" ("+s.sec+"s)\n"+s.video_prompt).join("\n\n"))}">คัดลอก video prompt ทุกช็อต</button></div></div>
    ${shots.map(s=>`<div class="shot"><div class="no"><b>${esc(s.n)}</b><span class="muted">${esc(s.sec)} วิ</span></div><div class="bd">
      <div class="row"><span class="tag">${esc(s.shot)}</span>${s.sound?`<span class="tag">เสียง: ${esc(s.sound)}</span>`:""}</div>
      <div>${esc(s.action)}</div>${s.text?`<div><b>ตัวอักษรบนจอ:</b> ${esc(s.text)}</div>`:""}
      <div class="media">${slot(String(s.n),"image","ภาพช็อต")}${slot(String(s.n),"video","คลิปช็อต")}</div>
      ${copyBox("1) Image prompt — เจนภาพ",s.image_prompt)}${copyBox("2) Video prompt — ทำภาพให้ขยับ",s.video_prompt)}</div></div>`).join("")}`;
  if(tab==="post"){const cap=(ep.caption||"")+"\n\n"+(ep.hashtags||[]).join(" ");
    body=`<div class="card"><h3>เพลงและเสียง</h3><p style="margin:0">${esc(ep.music)}</p></div>
      <div class="card"><h3>ตัดต่อใน CapCut</h3><ol class="howto">${shots.map(s=>`<li>ช็อต ${esc(s.n)} ยาว ${esc(s.sec)} วิ${s.text?` · ใส่ข้อความ "${esc(s.text)}"`:""}${s.sound?` · ${esc(s.sound)}`:""}</li>`).join("")}</ol></div>
      <div class="card"><h3>แคปชัน</h3>${copyBox("แคปชันและแฮชแท็ก",cap)}<p class="muted" style="margin:0">ตอนโพสต์ให้เปิดป้าย "เนื้อหาที่สร้างด้วย AI" ทุกแพลตฟอร์ม</p></div>`;}
  $("#app").innerHTML=`<div class="row"><button class="btn small" data-act="list">← งานทั้งหมด</button></div>
    <div><h2 style="font-size:28px">${esc(ep.title)}</h2></div>
    <div class="tabs" role="tablist">${Object.entries(T).map(([k,v])=>`<button class="btn small" role="tab" aria-selected="${k===tab}" data-tab="${k}">${v}</button>`).join("")}</div>${body}`;
}
function slot(key,type,label){
  const u=mediaUrl(key,type);const id=`f-${key}-${type}`;
  return `<label class="slot" for="${id}">${u?(type==="image"?`<img src="${u}" alt="${label}">`:`<video src="${u}" muted playsinline preload="metadata"></video>`):`แตะเพื่อ<br>อัปโหลด<br>${label}`}</label>
    <input type="file" id="${id}" accept="${type}/*" data-up="${key}|${type}" hidden>`;
}

/* ---------- อัปโหลด ---------- */
async function upload(key,type,file){
  if(file.size>50*1024*1024){toast("ไฟล์ใหญ่เกิน 50MB");return;}
  toast("กำลังอัปโหลด…");
  const ext=(file.name.split(".").pop()||(type==="image"?"jpg":"mp4")).toLowerCase().replace(/[^a-z0-9]/g,"");
  const path=`${user.id}/${ep.id}/${key}-${type}-${Date.now()}.${ext}`;
  const {error}=await sb.storage.from(BUCKET).upload(path,file,{contentType:file.type,upsert:true});
  if(error){toast("อัปโหลดไม่สำเร็จ: "+error.message);return;}
  const media={...(ep.media||{})};const old=media[key]&&media[key][type];
  media[key]={...(media[key]||{}),[type]:path};
  const {error:e2}=await sb.from("studio_episodes").update({media,updated_at:new Date().toISOString()}).eq("id",ep.id);
  if(e2){toast("บันทึกไม่สำเร็จ");return;}
  if(old) sb.storage.from(BUCKET).remove([old]);
  ep.media=media; await signMedia(); renderEp(); toast("อัปโหลดแล้ว");
}

/* ---------- ปุ่มต่าง ๆ ---------- */
$("#app").addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.copy!==undefined) return copy(b.dataset.copy);
  if(b.dataset.open) return openEp(b.dataset.open);
  if(b.dataset.tab){tab=b.dataset.tab;renderEp();return;}
  const a=b.dataset.act;
  if(a==="list"){tab="overview";await loadList();if(ep)renderList();return;}
  if(a==="play") return startPlayer();
  if(a==="feedback"){const t=$("#fb").value.trim();if(!t){toast("พิมพ์สิ่งที่อยากให้แก้ก่อน");return;}
    await save({feedback:t,feedback_at:new Date().toISOString(),status:"revise"},"ส่งแล้ว บอก Claude ในแชทว่า แก้ตามฟีดแบ็กในสตูดิโอ");}
  if(a==="approve"){if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="กดอีกครั้งเพื่อยืนยัน";setTimeout(()=>{if(b.isConnected){b.dataset.sure="";b.textContent="✓ อนุมัติเป็นต้นฉบับ";}},4000);return;}
    await save({status:"approved",approved_at:new Date().toISOString()},"อนุมัติเป็นต้นฉบับแล้ว");}
  if(a==="posted") await save({status:"posted"},"บันทึกว่าโพสต์แล้ว");
});
$("#app").addEventListener("change",e=>{const t=e.target;if(t.dataset.up&&t.files[0]){const [k,ty]=t.dataset.up.split("|");upload(k,ty,t.files[0]);}});
async function save(fields,msg){
  const {error}=await sb.from("studio_episodes").update({...fields,updated_at:new Date().toISOString()}).eq("id",ep.id);
  if(error){toast("บันทึกไม่สำเร็จ");return;}
  Object.assign(ep,fields);renderEp();toast(msg);
}

/* ---------- ฉบับร่าง (animatic) ---------- */
let P={i:0,playing:false,voice:true,timer:null,t0:0,dur:0,raf:null};
function thaiVoice(){const v=speechSynthesis.getVoices();return v.find(x=>/^th/i.test(x.lang))||null;}
function startPlayer(){P.i=0;P.playing=true;$("#player").hidden=false;$("#pPlay").textContent="หยุด";showShot();}
function stopAll(){clearTimeout(P.timer);cancelAnimationFrame(P.raf);try{speechSynthesis.cancel();}catch(e){}const v=$("#stage video");if(v)v.pause();}
function showShot(){
  stopAll();const shots=ep.shots||[];if(P.i>=shots.length){P.playing=false;$("#pPlay").textContent="เล่นใหม่";$("#progT").textContent="จบฉบับร่าง";return;}
  const s=shots[P.i];const key=String(s.n);const vid=mediaUrl(key,"video"),img=mediaUrl(key,"image");
  let vis=vid?`<video src="${vid}" autoplay muted playsinline></video>`:img?`<img class="kb" src="${img}" alt="">`
    :`<div class="sketch"><div class="s">ช็อต ${esc(s.n)} · ${esc(s.shot)}</div><div class="a">${esc(s.action)}</div><div class="s">ยังไม่มีภาพ</div></div>`;
  $("#stage").innerHTML=vis+(s.text?`<div class="ost">${esc(s.text)}</div>`:"")+(s.sound?`<div class="sfx">${esc(s.sound)}</div>`:"")+`<div class="num">${P.i+1}/${shots.length}</div>`;
  P.dur=(+s.sec||2)*1000;P.t0=performance.now();
  if(P.voice&&s.narration&&"speechSynthesis" in window){try{const u=new SpeechSynthesisUtterance(s.narration);u.lang="th-TH";const tv=thaiVoice();if(tv)u.voice=tv;u.rate=1.1;u.pitch=1.15;speechSynthesis.speak(u);}catch(e){}}
  const tick=()=>{const el=performance.now()-P.t0;const done=(P.i+Math.min(1,el/P.dur))/shots.length;$("#progBar").style.width=(done*100)+"%";$("#progT").textContent=`ช็อต ${s.n} · ${(el/1000).toFixed(1)}/${s.sec} วิ`;if(P.playing)P.raf=requestAnimationFrame(tick);};
  tick();
  if(P.playing) P.timer=setTimeout(()=>{P.i++;showShot();},P.dur);
}
$("#pPlay").onclick=()=>{if(P.playing){P.playing=false;stopAll();$("#pPlay").textContent="เล่นต่อ";}else{if(P.i>=(ep.shots||[]).length)P.i=0;P.playing=true;$("#pPlay").textContent="หยุด";showShot();}};
$("#pNext").onclick=()=>{P.i=Math.min(P.i+1,(ep.shots||[]).length-1);showShot();};
$("#pPrev").onclick=()=>{P.i=Math.max(P.i-1,0);showShot();};
$("#pVoice").onclick=()=>{P.voice=!P.voice;$("#pVoice").textContent="เสียงอ่าน: "+(P.voice?"เปิด":"ปิด");if(!P.voice)try{speechSynthesis.cancel();}catch(e){}};
$("#pClose").onclick=()=>{P.playing=false;stopAll();$("#player").hidden=true;};
if("speechSynthesis" in window) speechSynthesis.onvoiceschanged=()=>{};

boot();
})();
</script>
