<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Xire.ai Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Kanit', sans-serif; background: #f8f6f3; color: #2c2c2c; }
header { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; background: #fff; border-bottom: 1px solid #eee; }
.logo { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 600; }
nav a { color: #2c2c2c; text-decoration: none; margin-left: 28px; font-size: 15px; }
.container { max-width: 960px; margin: 40px auto; padding: 0 20px; }
h1 { font-family: 'Playfair Display', serif; font-size: 36px; margin-bottom: 8px; }
.sub { color: #777; margin-bottom: 32px; }
.card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
.card h2 { font-size: 20px; margin-bottom: 12px; }
.btn { display: inline-block; background: #2c2c2c; color: #fff; padding: 12px 28px; border-radius: 999px; text-decoration: none; font-size: 15px; margin-top: 12px; border: none; cursor: pointer; }
.btn:hover { background: #444; }
.btn-full { width: 100%; text-align: center; }
.btn-small { padding: 8px 16px; font-size: 13px; }
.btn-daily { background: #e91e63; }
.btn-daily:hover { background: #c2185b; }
textarea, input[type=text], select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; margin: 8px 0; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 200px; }
.conn { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
.conn span { background: #f4f2ef; padding: 6px 12px; border-radius: 999px; font-size: 13px; }
.parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 16px; }
.part { background: #f4f2ef; border-radius: 10px; padding: 12px; text-align: center; }
.part b { display: block; font-size: 15px; margin-bottom: 4px; }
.part small { color: #777; display: block; }
.part img { width: 100%; border-radius: 6px; margin-top: 8px; max-height: 180px; object-fit: cover; }
.part.pending { opacity: 0.7; }
.part.done { background: #e8f5e9; }
.status { margin-top: 12px; padding: 12px; background: #f0f7f0; border-radius: 8px; color: #1a7a3a; display: none; white-space: pre-wrap; font-size: 13px; }
.note { background: #fff8e1; padding: 12px; border-radius: 8px; font-size: 13px; margin-top: 12px; }
footer { text-align: center; padding: 40px; color: #999; font-size: 13px; }
label { font-size: 13px; color: #555; display: block; margin-top: 8px; }
.daily-box { background: linear-gradient(135deg, #fce4ec, #f8bbd0); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
.daily-box h2 { color: #c2185b; }
</style>
</head>
<body>
<header>
<div class="logo">Xire.ai</div>
<nav>
<a href="index.html">หน้าหลัก</a>
<a href="https://anime-image-bot.kandanai697.workers.dev" target="_blank">Worker</a>
</nav>
</header>

<div class="container">
<h1>Studio</h1>
<p class="sub">สร้างคอนเทนต์รายวัน · 1 นาที · ไม่ซ้ำทุกวัน</p>

<div class="daily-box">
<h2>คอนเทนต์วันนี้</h2>
<p style="margin:8px 0;color:#555">สาว + แมวนุ่มๆ บรรยากาศสวย สไตล์เกาหลีสมจริง</p>
<button class="btn btn-daily btn-full" onclick="generateDailyContent()">สร้างคอนเทนต์วันนี้ (1 นาที)</button>
<div class="status" id="dailyStatus"></div>
</div>

<div class="card">
<h2>สถานะระบบ</h2>
<div class="conn">
<span>Cloudflare</span>
<span>Worker</span>
<span>Kaggle GPU</span>
<span>SDXL / Flux</span>
</div>
<button class="btn btn-small" onclick="testWorker()">ทดสอบ Worker</button>
<div class="status" id="testResult"></div>
</div>

<div class="card">
<h2>สร้างเอง (กำหนดเอง)</h2>
<input type="text" id="title" value="สาวกับแมว">
<textarea id="character" rows="2">1girl, long blonde hair, off shoulder cream sweater, beige pleated skirt, white boots, beautiful Korean style</textarea>
<textarea id="story" rows="4">เดินผ่านสวน เห็นแมวนุ่มๆนั่งอยู่ข้างทางเดิน
ยืนดูแล้วยืนมือออกหาอาหาร
แมวติดมือเธอแล้วยิ้มอ่อนโยน
อุ้มแมวขึ้นมากอดไปบ้าน
เพื่อนนั่งอ่านหนังสือ มองกันแล้วยิ้ม</textarea>
<div class="row">
<select id="template">
<option value="kdrama-soft" selected>เกาหลีนุ่มๆ (สาว+แมว)</option>
<option value="anime-high">อนิเมะ</option>
<option value="cinematic">Cinematic</option>
</select>
<select id="partsCount">
<option value="6" selected>6 ซีน (~1 นาที)</option>
<option value="5">5 ซีน</option>
<option value="4">4 ซีน</option>
</select>
</div>
<button class="btn btn-full" onclick="startFullPipeline()">สร้างจากเว็บ</button>
<div class="status" id="status"></div>
</div>

<div class="card">
<h2>ผลลัพธ์</h2>
<div class="parts" id="partsList"></div>
<div style="margin-top:12px">
<button class="btn btn-small" onclick="pullImages()">ดึงรูปกลับมาแสดง</button>
<button class="btn btn-small" onclick="openWorker()">เปิด Worker</button>
<button class="btn btn-small" onclick="clearQueue()">ล้างคิว</button>
</div>
<div class="note">กดปุ่มสร้าง → เปิด Worker ดูความคืบหน้า → กลับมากดดึงรูป</div>
</div>
</div>

<footer>Xire.ai Studio</footer>

<script>
const WORKER = 'https://anime-image-bot.kandanai697.workers.dev';

const TEMPLATES = {
  'kdrama-soft': 'photorealistic, soft natural lighting, Korean drama style, warm tones, shallow depth of field, cinematic',
  'anime-high': 'masterpiece, best quality, anime style, detailed, cinematic lighting',
  'cinematic': 'cinematic movie still, film grain, 16:9, golden hour'
};

const DAILY_SCENES = [
  [
    '1girl, long blonde hair, cream off-shoulder sweater, walking on tree-lined path, soft sunlight, gentle expression',
    'fluffy white and gray ragdoll cat sitting on stone step, looking up curiously, green foliage background',
    '1girl crouching down, reaching hand toward fluffy cat, warm smile, park setting',
    '1girl petting fluffy cat head gently, cat eyes closed happy, soft bokeh background',
    '1girl standing, fluffy cat walking beside her on sidewalk, afternoon light, trees and building',
    '1girl holding fluffy cat in arms, walking into modern apartment, warm indoor lighting'
  ],
  [
    '1girl, long blonde hair, cream sweater, sitting on park bench with coffee, soft morning light',
    'small fluffy cat approaching from bushes, curious expression, dappled sunlight',
    '1girl offering hand, cat sniffing fingers, gentle interaction, green park',
    '1girl laughing softly, cat on her lap, warm golden hour lighting',
    '1girl standing up, cat following her, tree-lined path, soft shadows',
    '1girl and cat looking at each other, close-up, tender moment, blurred trees'
  ],
  [
    '1girl walking through autumn park, cream sweater and beige skirt, falling leaves',
    'fluffy cat sitting on low wall, watching her, soft afternoon light',
    '1girl stopping to look at cat, slight smile, wind in hair',
    '1girl kneeling, cat walking toward her, mutual curiosity',
    '1girl picking up cat carefully, cat relaxed in her arms',
    '1girl carrying cat home, back view, modern building entrance, warm light'
  ]
];

function getTodayIndex() {
  const d = new Date();
  return (d.getFullYear() * 366 + d.getMonth() * 31 + d.getDate()) % DAILY_SCENES.length;
}

function buildPrompt(scene) {
  const char = document.getElementById('character').value.trim();
  const style = TEMPLATES[document.getElementById('template').value] || TEMPLATES['kdrama-soft'];
  return `${style}, ${char}, ${scene}`;
}

async function generateDailyContent() {
  const status = document.getElementById('dailyStatus');
  status.style.display = 'block';
  status.textContent = 'กำลังสร้างคอนเทนต์วันนี้...';

  const idx = getTodayIndex();
  const scenes = DAILY_SCENES[idx];
  const title = `คอนเทนต์วันที่ ${new Date().toLocaleDateString('th-TH')}`;

  document.getElementById('title').value = title;
  document.getElementById('template').value = 'kdrama-soft';
  document.getElementById('partsCount').value = '6';

  const lines = scenes.map(s => buildPrompt(s)).join('\n');

  const list = document.getElementById('partsList');
  list.innerHTML = '';
  scenes.forEach((_, i) => {
    list.innerHTML += `<div class="part pending"><b>ซีน ${i+1}</b><small>ส่งคิวแล้ว</small></div>`;
  });

  try {
    await fetch(WORKER + '/api/clearqueue', { method: 'POST' });
    const enq = await fetch(WORKER + '/api/enqueue', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ project: title, lines: lines, variants: 1 })
    });
    const data = await enq.json();

    if (data.ok) {
      await fetch(WORKER + '/api/resume', { method: 'POST' });
      await fetch(WORKER + '/api/runnow', { method: 'POST' });
      status.textContent = `ส่งคิวแล้ว ${data.added} ซีน\nชื่อเรื่อง: ${title}\n\nเปิด Worker เพื่อดูความคืบหน้า`;
    } else {
      status.textContent = 'ส่งไม่สำเร็จ';
    }
  } catch (e) {
    status.textContent = 'เชื่อมไม่ได้: ' + e.message;
  }
}

async function testWorker() {
  const el = document.getElementById('testResult');
  el.style.display = 'block';
  try {
    const res = await fetch(WORKER + '/api/state');
    const data = await res.json();
    el.textContent = `รูป: ${data.images?.length || 0} \nคิว: ${data.jobs?.length || 0}\nGPU: ${data.settings?.k_status || 'unknown'}`;
  } catch (e) {
    el.textContent = 'เชื่อมไม่ได้: ' + e.message;
  }
}

function openWorker() { window.open(WORKER, '_blank'); }

async function clearQueue() {
  if (!confirm('ล้างคิวทั้งหมด?')) return;
  await fetch(WORKER + '/api/clearqueue', { method: 'POST' });
  alert('ล้างคิวแล้ว');
  document.getElementById('partsList').innerHTML = '';
}

async function pullImages() {
  const status = document.getElementById('status');
  status.style.display = 'block';
  status.textContent = 'กำลังดึงรูป...';
  try {
    const res = await fetch(WORKER + '/api/state');
    const data = await res.json();
    const title = document.getElementById('title').value || '';
    const images = (data.images || []).filter(img => 
      img.project && img.project.includes(title)
    ).slice(-10);

    const list = document.getElementById('partsList');
    if (!images.length) {
      status.textContent = 'ยังไม่มีรูปของเรื่องนี้\nเปิด Worker เพื่อดูความคืบหน้า';
      return;
    }

    list.innerHTML = '';
    images.forEach((img, idx) => {
      list.innerHTML += `<div class="part done"><b>ซีน ${img.scene || idx+1}</b><small>สร้างแล้ว</small><img src="${WORKER}/img/${img.id}"></div>`;
    });
    status.textContent = `ดึงรูปมาแสดงแล้ว ${images.length} รูป`;
  } catch (e) {
    status.textContent = 'ดึงไม่ได้: ' + e.message;
  }
}

async function startFullPipeline() {
  const title = document.getElementById('title').value || 'เรื่องใหม่';
  const story = document.getElementById('story').value || '';
  const count = +document.getElementById('partsCount').value;
  const status = document.getElementById('status');
  const list = document.getElementById('partsList');

  status.style.display = 'block';
  status.textContent = 'กำลังส่งไปที่ Worker...';

  const sentences = story.split(/[.!?ๆ\n]+/).filter(s => s.trim().length > 5);
  const per = Math.max(1, Math.ceil(sentences.length / count));
  const linesArr = [];

  list.innerHTML = '';
  for (let i = 1; i <= count; i++) {
    list.innerHTML += `<div class="part pending" id="part-${i}"><b>ซีน ${i}</b><small>ส่งคิวแล้ว</small></div>`;
    const chunk = sentences.slice((i-1)*per, i*per).join('. ').slice(0, 120);
    linesArr.push(buildPrompt(chunk));
  }

  const lines = linesArr.join('\n');

  try {
    await fetch(WORKER + '/api/clearqueue', { method: 'POST' });
    const enq = await fetch(WORKER + '/api/enqueue', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ project: title, lines: lines, variants: 1 })
    });
    const enqData = await enq.json();

    if (enqData.ok) {
      await fetch(WORKER + '/api/resume', { method: 'POST' });
      await fetch(WORKER + '/api/runnow', { method: 'POST' });
      status.textContent = `ส่งคิวแล้ว ${enqData.added} ซีน\n\nเปิด Worker เพื่อดูความคืบหน้า`;
    } else {
      status.textContent = 'ส่งคิวไม่สำเร็จ';
    }
  } catch (e) {
    status.textContent = 'เชื่อมไม่ได้: ' + e.message;
  }
}
</script>
</body>
</html>
