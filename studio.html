<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>สตูดิโอ</title>
<style>

</style></head><body>
<h1>🎬 สตูดิโอ</h1><div class="mu">เลือกประเภทงาน → ใส่บทและเลือก LoRA → ดูสตอรีบอร์ด 1 ตอนก่อน แล้วค่อยสั่งทำทั้งตอน</div>
<div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=x=>String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tt=0;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',5000);}
/* ---------- บอท (ใช้ลิงก์/รหัสเดียวกับสตูดิโอเดิม) ---------- */
function botCfg(){try{return JSON.parse(localStorage.getItem('ss_imgbot')||'{}')||{};}catch(e){return {};}}
function botU(p){const c=botCfg();return String(c.url||'').replace(/\/+$/,'')+p+(p.includes('?')?'&':'?')+'k='+encodeURIComponent(c.key||'');}
function botErr(e){const m=String(e&&e.message||e);return /failed to fetch|load failed|networkerror|network request/i.test(m)?'ติดต่อบอทไม่ได้ ตรวจลิงก์บอท หรือบอทยังไม่ได้ deploy':m;}
async function botApi(p,body){const r=await fetch(botU(p),body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{});
  if(r.status===401)throw new Error('รหัสผ่านบอทไม่ถูกต้อง');const j=await r.json().catch(()=>({error:'บอทตอบกลับไม่ถูกต้อง (ลิงก์ถูกไหม?)'}));if(!r.ok||j.error)throw new Error(j.error||('HTTP '+r.status));return j;}
async function testBot(url,key){
  url=String(url||'').trim().replace(/\/+$/,'');
  if(!/^https?:\/\//i.test(url))return{ok:false,m:'❌ ลิงก์ต้องขึ้นต้นด้วย https:// เช่น https://xxx.workers.dev'};
  let r;try{r=await fetch(url+'/api/ping?k='+encodeURIComponent(key||''),{cache:'no-store'});}catch(e){return{ok:false,m:'❌ ติดต่อลิงก์นี้ไม่ได้ — ลิงก์พิมพ์ผิด หรือ Worker ยังไม่ได้ deploy / ถูกลบ'};}
  if(r.status===401)return{ok:false,m:'❌ ลิงก์ถูก แต่รหัสผ่านบอทไม่ตรง'};
  if(r.status===404)return{ok:false,m:'❌ ลิงก์นี้ตอบมา แต่ไม่ใช่บอทตัวนี้ (ไม่พบ /api/ping)'};
  const j=await r.json().catch(()=>null);
  if(!r.ok||!j||!j.ok)return{ok:false,m:'❌ บอทตอบกลับผิดปกติ (HTTP '+r.status+')'};
  if(!j.ver)return{ok:true,m:'⚠️ เชื่อมได้ แต่บอทเป็นเวอร์ชันเก่า ยังไม่มีระบบ LoRA ใหม่ — deploy worker.js ล่าสุดก่อน'};
  const ks=+j.kseen,ago=ks?Math.round((Date.now()-ks)/60000):null;
  return{ok:true,m:'✅ เชื่อมบอทได้ (เวอร์ชัน '+j.ver+') · Kaggle '+(ago==null?'ยังไม่เคยต่อเข้ามา':ago<=10?'ออนไลน์ ('+ago+' นาทีก่อน)':'เงียบไป '+ago+' นาที — ตรวจว่า Kaggle ยังรันอยู่')};}
/* ---------- อ่านไฟล์โครงเรื่อง .docx ---------- */
async function readDocxXml(file){const buf=new Uint8Array(await file.arrayBuffer()),dv=new DataView(buf.buffer),td=new TextDecoder();let e=-1;for(let i=buf.length-22;i>=Math.max(0,buf.length-70000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}if(e<0)throw new Error('ไฟล์ไม่ใช่ .docx');const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);for(let k=0;k<n;k++){if(dv.getUint32(p,true)!==0x02014b50)break;const meth=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true),nm=td.decode(buf.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;if(nm!=='word/document.xml')continue;const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),raw=buf.subarray(ds,ds+cs);if(meth===0)return td.decode(raw);if(typeof DecompressionStream==='undefined')throw new Error('เบราว์เซอร์นี้อ่าน .docx ไม่ได้ ลองอัปเดต iOS/เบราว์เซอร์');return td.decode(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());}throw new Error('ไม่พบเนื้อหาในไฟล์');}
function docxBlocks(xml){const d=new DOMParser().parseFromString(xml,'application/xml'),W='http://schemas.openxmlformats.org/wordprocessingml/2006/main',T=el=>[...el.getElementsByTagNameNS(W,'t')].map(x=>x.textContent).join('').trim(),body=d.getElementsByTagNameNS(W,'body')[0],out=[];if(!body)return out;for(const ch of body.children){if(ch.localName==='p'){const t=T(ch);if(t)out.push({t:'p',text:t});}else if(ch.localName==='tbl'){out.push({t:'tbl',rows:[...ch.children].filter(x=>x.localName==='tr').map(tr=>[...tr.children].filter(x=>x.localName==='tc').map(tc=>[...tc.getElementsByTagNameNS(W,'p')].map(T).filter(Boolean).join(' ')))});}}return out;}
function epRange(s){if(/ทุก/.test(s))return[0];const o=[];String(s).split(/[,，]/).forEach(t=>{const m=t.match(/(\d+)\s*[–—-]\s*(\d+)/);if(m){for(let i=+m[1];i<=+m[2];i++)o.push(i);}else{const n=t.match(/\d+/);if(n)o.push(+n[0]);}});return o;}
function parsePlan(blocks){
  const P=blocks.filter(b=>b.t==='p').map(b=>b.text),all=P.join('\n'),roles=[],locs=[],eps=[];
  const title=(P[0]||'').split('—')[0].replace(/[“”"]/g,'').trim(),ov=(P.find(x=>/^เรื่องย่อ\s*[:：]/.test(x))||'').replace(/^เรื่องย่อ\s*[:：]\s*/,'');
  for(const b of blocks){if(b.t!=='tbl'||b.rows.length<2)continue;const hd=b.rows[0],hs=hd.join('|'),ix=re=>hd.findIndex(c=>re.test(c));
    if(/ชื่อ/.test(hs)&&/ความลับ/.test(hs)){const iK=ix(/บทบาท/),iN=ix(/ชื่อ/),iL=ix(/ตัวตน/),iS=ix(/ความลับ/),iT=ix(/นิสัย/);
      for(const r of b.rows.slice(1)){const nm=r[iN]||'',full=nm.replace(/\(.*?\)|（.*?）/g,'').trim();if(!full)continue;const am=nm.match(/\([^)\d]*(\d+)\)/);roles.push({key:full.split(/\s+/)[0],name:full,kind:(r[iK]||'').trim(),age:am?+am[1]:0,look:r[iL]||'',secret:r[iS]||'',traits:r[iT]||''});}}
    else if(/สถานที่/.test(hs)&&/ตอน/.test(hs)){for(const r of b.rows.slice(1)){if(r[0])locs.push({name:r[0],eps:epRange(r[1]||''),note:r[2]||''});}}}
  for(const x of P){const m=x.match(/^((?:พ่อ|แม่)ของ\S+)\s*\(([^)]+)\)\s*[:：]\s*(.+)$/);if(m&&!roles.some(r=>r.key===m[2]))roles.push({key:m[2],name:m[2],kind:m[1],age:40,look:m[3],secret:'',traits:'',g:m[1].startsWith('แม่')?'f':'m'});}
  const cue=n=>{let f=0,m=0,i=-1;while((i=all.indexOf(n,i+1))>=0){const l=all.slice(i+n.length,i+n.length+30);if(/หญิง|สาว/.test(l))f++;else if(/ชาย|หนุ่ม/.test(l))m++;}return f>m?'f':m>f?'m':'';};
  roles.forEach(r=>{if(r.g)return;r.g=!r.age?'x':/ป้า|หญิง|สาว|แม่/.test(r.name+r.kind)?'f':/ลุง|ชาย|หนุ่ม/.test(r.name+r.kind)?'m':cue(r.key);});
  roles.forEach(r=>{r.tier=r.g==='x'?'none':/คู่หลัก/.test(r.kind)?'main':'support';});
  let cur=null;
  for(const x of P){const m=x.match(/^ตอน\s*(\d+)\s*[—–-]\s*(.+)$/);if(m){const no=+m[1];if(eps.some(e=>e.no===no))cur=null;else{cur={no,title:m[2].trim(),f:{}};eps.push(cur);}continue;}
    if(cur){const k=x.match(/^(คดี|เรื่อง|ฉากสู้|อารมณ์|จบตอน)\s*[:：]\s*(.+)$/);if(k)cur.f[k[1]]=k[2];else if(/^(เรื่องย่อ|โลกและ|ตัวละคร|สถานที่|สิ่งที่)/.test(x))cur=null;}}
  eps.forEach(E=>{const tx=E.title+' '+Object.values(E.f).join(' ');E.cast=roles.filter(r=>/คู่หลัก/.test(r.kind)||tx.includes(r.key)||tx.includes(r.name)||(/^พ่อของ/.test(r.kind)&&/พ่อ(?!ค้า)/.test(tx))).map(r=>r.key);});
  return{title,overview:ov,rule:(P.find(x=>/^ทุกตอน/.test(x))||'').slice(0,400),roles,eps:eps.sort((a,b)=>a.no-b.no),locs};}
/* ---------- สถานะ ---------- */
const ST={story:localStorage.getItem('ss_story')||'',plan:null,cands:[],epst:{},fin:{},scn:[],busy:'',msg:'',err:'',qc:null,qcBusy:false,best:0,sty:localStorage.getItem('ss_sty')||'',asp:localStorage.getItem('ss_asp')||'',tab:'story',editBot:false,lib:[],train:[],autos:null,weights:{},testMsg:'',kind:localStorage.getItem('ss_kind')||'',sb:null,selEp:0,more:false,onlyReady:localStorage.getItem('ss_onlyready')!=='0'};
const STY=[['rom','💗 รอมคอมใส','bright soft anime style, pastel colors, high-key lighting, delicate fine line art, expressive cute faces, soft blush, detailed hair strands, clean cel shading, romantic comedy mood'],
['dark','🌑 ดราม่ามืดหนัก','dark gritty anime style, desaturated cold palette, heavy shadows, strong rim light, detailed fine line art, cinematic dramatic lighting, grim tense atmosphere'],
['act','⚔️ แอ็กชันคมเข้ม','dynamic action anime style, bold sharp line art, high contrast, vivid saturated accents, dramatic low angle, motion energy, cinematic lighting'],
['cine','🎞 ซีเนม่าเหมือนจริง','cinematic semi-realistic anime style, shallow depth of field, natural lighting, detailed textures, subtle film grain'],
['soft','🌸 นุ่มนวลมาตรฐาน','soft anime style, beautiful detailed anime illustration, delicate fine line art, detailed hair strands and fabric folds, soft cinematic lighting, gentle shading']];
const KIND=[['anime','🎌','อนิเมะ','916',''],['film','🎬','หนัง','169','cine'],['series','📺','ซีรีส์','169',''],['ad','📣','โฆษณา','916','']];
const ASP=[['916','📱 TikTok 9:16',768,1344],['11','⬜ จัตุรัส 1:1',1024,1024],['169','🖥 จอกว้าง 16:9',1344,768]];
let POLL=0;
const api=(act,o)=>botApi('/api/vcastep',{story:ST.story,act,...(o||{})});
const tierOf=r=>r.tier||(r.g==='x'?'none':/คู่หลัก/.test(r.kind)?'main':'support'),live=r=>r.g!=='x'&&tierOf(r)!=='none';
const castOf=k=>ST.cands.find(c=>c.cast_role===k&&c.cast_story===ST.story);
async function load(){
  clearTimeout(POLL);if(!botCfg().url||!ST.story){render();return;}
  try{const r=await api('get');ST.plan=r.plan;ST.cands=r.cands||[];ST.epst=r.epst||{};ST.best=+r.best||0;if(r.kind)ST.kind=r.kind;ST.err='';}catch(e){ST.err=botErr(e);}
  const sid=Object.values(ST.epst).map(v=>v&&v.series).find(Boolean);ST.fin={};ST.scn=[];
  if(sid){try{const r=await botApi('/api/anime',{act:'eps',series_id:sid});ST.fin=r.efinal||{};ST.scn=r.eps||[];}catch(e){}}
  try{const r=await api('lib');ST.lib=r.loras||[];ST.weights=r.weights||{};}catch(e){ST.lib=[];}
  try{const r=await api('training');ST.train=r.items||[];ST.autos=r.autos||null;}catch(e){ST.train=[];}
  const g=sbCur();ST.sb=null;if(g&&ST.epst[g].status==='running'){try{ST.sb=await api('sb',{ep:g});}catch(e){}}
  const idle=g&&ST.sb&&ST.sb.ready&&ST.epst[g].gate==='sb'&&!ST.sb.scenes.some(x=>x.shots.some(v=>v.pending)); /* สตอรีบอร์ดครบแล้ว รอคนกดอนุมัติ: ไม่ต้องรีเฟรชเอง */
  await autoLora();render();
  if(Object.entries(ST.epst).some(([k,v])=>v&&(v.status==='running'||v.status==='waiting')&&!(idle&&+k===g)))POLL=setTimeout(load,g?20000:30000);
  else if(ST.train.some(x=>x.status!=='failed')||ST.lib.some(x=>x.testing)||(!ST.onlyReady&&ST.plan&&ST.plan.roles.some(r=>live(r)&&tierOf(r)==='main'&&(!castOf(r.key)||(castOf(r.key).lora!=='ready'&&castOf(r.key).lora!=='failed')))))POLL=setTimeout(load,20000);}
/* ตัวหลักที่ยังไม่มีตัวละคร/LoRA: ส่งสร้างให้ (บอทฝึก LoRA ต่อเองเมื่อภาพชุดฝึกครบ) */
const LG=new Set(); // กันสั่งสร้างตัวละครซ้ำคนเดิม
const LT={}; // เวลาที่สั่งเทรนล่าสุดต่อคน กันสั่งรัวๆ
async function autoLora(){const pl=ST.plan;if(!pl||ST.onlyReady)return;
  for(const r of pl.roles){if(!live(r)||tierOf(r)!=='main')continue;const c=castOf(r.key);if(!c)continue;
    if(!+c.char_id&&c.lora!=='queued'&&c.lora!=='ready'&&!LG.has(c.id)){LG.add(c.id);try{await api('lorago',{cand:c.id});}catch(e){LG.delete(c.id);}}
    else if(+c.char_id&&c.lora==='none'&&Date.now()-(LT[c.id]||0)>60000){LT[c.id]=Date.now();try{await api('lorago',{cand:c.id});}catch(e){}}}} /* ภาพชุดฝึกพร้อมเมื่อไหร่ สตูดิโอสั่งเทรนเอง · ตัวที่เทรนพังไม่ลองเองซ้ำ ต้องกดเทรนใหม่ */
const sbCur=()=>{const e=Object.entries(ST.epst).filter(([k,v])=>v&&v.gate&&!ST.fin[k]);return e.length?+e[0][0]:0;};
/* ---------- ประเภทงาน + สตอรีบอร์ด 1 ตอน ---------- */
async function setKind(k){const x=KIND.find(v=>v[0]===k);if(!x)return;ST.kind=k;localStorage.setItem('ss_kind',k);
  if(!ST.plan){render();return;}
  try{await api('setkind',{kind:k});const a=ASP.find(v=>v[0]===x[3]),s=STY.find(v=>v[0]===(x[4]||ST.sty))||STY[4],o={img_w:a[2],img_h:a[3]};
    if(x[4]||!ST.sty){o.style=s[2];o.style_preset=s[0];ST.sty=s[0];localStorage.setItem('ss_sty',s[0]);}
    await botApi('/api/settings',o);ST.asp=a[0];localStorage.setItem('ss_asp',a[0]);toast('ตั้งเป็น'+x[2]+': '+a[1]+' · สไตล์ '+s[1]);}catch(e){toast(botErr(e));}render();}
async function startSb(no,nolora){ST.busy='กำลังเริ่มสตอรีบอร์ด…';ST.msg='';render();
  try{const r=await api('make',{ep:no,sb:1,...(nolora?{nolora:1}:{})});toast(r.waiting?'รอ LoRA ของ '+r.waiting.join(', ')+' — เริ่มเองเมื่อพร้อม':'เริ่มแล้ว ระบบกำลังเขียนบทและวาดสตอรีบอร์ด');}catch(e){ST.msg='⚠️ '+botErr(e);}ST.busy='';await load();}
async function sbRedo(id){const c=prompt('อยากแก้อะไรในช็อตนี้? (เว้นว่าง = วาดใหม่ตามเดิม)','');if(c===null)return;
  try{const r=await api('sb_redo',{ep:sbCur(),shot:id,command:c});toast(r.pending?'ช็อตนี้กำลังวาดอยู่แล้ว':'สั่งวาดใหม่แล้ว รอสักครู่');}catch(e){toast(botErr(e));}await load();}
async function sbOk(){if(!confirm('อนุมัติสตอรีบอร์ดนี้ แล้วให้ระบบทำคลิปทั้งตอน?'))return;try{await api('sb_ok',{ep:sbCur()});toast('อนุมัติแล้ว ระบบเริ่มทำทั้งตอน');}catch(e){toast(botErr(e));}await load();}
async function sbLora(){try{const r=await api('sb_lora',{ep:sbCur()});toast('สั่งวาดใหม่ '+(r.redo||0)+' ช็อตด้วย LoRA แล้ว');}catch(e){toast(botErr(e));}await load();}
async function sbStop(){if(!confirm('ยกเลิกตอนนี้? (ภาพที่วาดไปแล้วยังอยู่)'))return;try{await api('stop',{ep:sbCur()});toast('ยกเลิกแล้ว');}catch(e){toast(botErr(e));}await load();}
function ep_status(no){const s=ST.epst[no];return s?s.status:'';}
/* ---------- เริ่มทำทั้งเรื่อง ---------- */
async function startAll(){
  const pl=ST.plan;
  if(ST.onlyReady){const miss=pl.roles.filter(r=>live(r)&&tierOf(r)==='main'&&!(castOf(r.key)&&castOf(r.key).lora==='ready')).map(r=>r.key);
    if(miss.length){ST.msg='ยังไม่ได้เลือก LoRA ที่เสร็จแล้วให้ตัวหลัก: '+miss.join(', ')+' — ไปเลือกที่แถบ 🧬 LoRA';ST.tab='lora';render();return;}}
  ST.busy='กำลังจัดนักแสดงและเริ่มทำ…';ST.msg='';render();
  try{
    let a=await api('autocast');
    if(a.left&&a.left.length){ // คลังนักแสดงไม่พอ: เก็บผู้สมัครที่ออดิชันไว้แล้วลองจับคู่ใหม่
      const l=await botApi('/api/vcastaud',{act:'list'});let n=0;
      for(const c of (l.cands||[])){if(n>=40)break;if(!+c.kept&&+c.card>0&&!c.cast_role){await botApi('/api/vcastaud',{act:'keep',id:c.id});n++;}}
      a=await api('autocast');}
    if(a.left&&a.left.length){ // ยังไม่พอ: ให้ระบบเรียกผู้สมัครเพิ่ม
      const need=new Set(a.left.map(k=>(pl.roles.find(r=>r.key===k)||{}).g));
      if(need.has('f'))await botApi('/api/vcastaud',{act:'gen',role:'อายะ',n:4});
      if(need.has('m'))await botApi('/api/vcastaud',{act:'gen',role:'โยมะ',n:4});
      ST.msg='นักแสดงในคลังไม่พอสำหรับ '+a.left.join(', ')+' — ระบบเรียกผู้สมัครเพิ่มแล้ว รอภาพขึ้นราว 10 นาที แล้วกด 🚀 อีกครั้ง';ST.busy='';await load();return;}
    await load();
    const errs=[];let wait=new Set(),run=0;
    for(const E of pl.eps){try{const r=await api('make',{ep:E.no,all:true});if(r.waiting)r.waiting.forEach(x=>wait.add(x));else run++;}catch(e){errs.push(`ตอน ${E.no}: ${botErr(e)}`);}}
    ST.msg=(errs.length?errs.join('\n')+'\n':'')+`เริ่มแล้ว ${run} ตอน`+(wait.size?` · อีกหลายตอนรอ LoRA ของ ${[...wait].join(', ')} (ฝึกเอง เริ่มต่อเองเมื่อพร้อม)`:'')+' · ปิดหน้านี้ได้ ระบบทำต่อเองจนครบ';
  }catch(e){ST.msg='⚠️ '+botErr(e);}
  ST.busy='';await load();}
async function stopAll(){if(!confirm('หยุดทุกตอนที่กำลังทำ? (ของที่ทำไปแล้วยังอยู่)'))return;ST.busy='กำลังหยุด…';render();
  try{for(const E of ST.plan.eps){if(ST.epst[E.no])await api('stop',{ep:E.no});}ST.msg='หยุดแล้ว';}catch(e){ST.msg='⚠️ '+botErr(e);}ST.busy='';await load();}

async function onFile(f){if(!f)return;
  try{toast('กำลังอ่านไฟล์…');const pl=parsePlan(docxBlocks(await readDocxXml(f)));
    if(!pl.roles.length||!pl.eps.length)throw new Error('อ่านโครงเรื่องไม่ออก ต้องมีตารางตัวละคร และหัวข้อแบบ "ตอน 1 — ชื่อตอน"');
    const name=(pl.title||f.name.replace(/\.\w+$/,'')).slice(0,60);ST.story=name;localStorage.setItem('ss_story',name);
    await botApi('/api/vcastep',{act:'save',story:name,plan:pl});ST.msg='';toast(`อ่านแล้ว ${pl.roles.length} บท · ${pl.eps.length} ตอน`);await load();
    if(ST.kind)await setKind(ST.kind);
  }catch(e){toast(botErr(e));}}
async function setR(key,field,val){try{await api('setr',{key,field,value:val});await load();}catch(e){toast(botErr(e));}}
async function setSty(k){const x=STY.find(v=>v[0]===k);if(!x)return;try{await botApi('/api/settings',{style:x[2],style_preset:k});ST.sty=k;localStorage.setItem('ss_sty',k);toast('ตั้งสไตล์แล้ว (มีผลกับภาพที่ทำใหม่)');render();}catch(e){toast(botErr(e));}}
async function setAsp(k){const x=ASP.find(v=>v[0]===k);if(!x)return;try{await botApi('/api/settings',{img_w:x[2],img_h:x[3]});ST.asp=k;localStorage.setItem('ss_asp',k);toast('ตั้งสัดส่วนแล้ว (มีผลกับภาพที่ทำใหม่)');render();}catch(e){toast(botErr(e));}}
async function runQc(){if(ST.qcBusy)return;ST.qcBusy=true;render();
  try{for(let i=0;i<80;i++){const r=await api('qc');ST.qc=r;render();if(!r.left)break;await new Promise(x=>setTimeout(x,800));}}catch(e){toast(botErr(e));}
  ST.qcBusy=false;render();}
async function pickBest(no){try{await api('pick',{ep:no});ST.best=no;toast('เลือกตอน '+no+' สำหรับ TikTok แล้ว');render();}catch(e){toast(botErr(e));}}
async function dl(id,name){try{toast('กำลังโหลดไฟล์…');const r=await fetch(botU('/vid/'+id));if(!r.ok)throw new Error('HTTP '+r.status);const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);}catch(e){window.open(botU('/vid/'+id),'_blank');}}
function bestEp(){const q=ST.qc;if(!q||!q.eps)return 0;const c=q.eps.filter(E=>E.final&&!E.fixing&&!E.bad);if(!c.length)return 0;c.sort((a,b)=>(b.avg==null?50:b.avg)-(a.avg==null?50:a.avg));return c[0].no;}

function bindTabs(A){A.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ST.tab=b.dataset.tab;render();window.scrollTo(0,0);});

  A.querySelectorAll('[data-test]').forEach(b=>b.onclick=async()=>{ST.testMsg='⏳ กำลังทดสอบ…';render();const c=botCfg(),r=await testBot(c.url,c.key);ST.testMsg=r.m;render();});}
async function wipeRebuild(){
  const t=prompt('จะลบคลังนักแสดงเก่าทั้งหมด (ผู้สมัคร ตัวละคร LoRA ภาพ) กู้คืนไม่ได้\nพิมพ์ ลบทั้งหมด เพื่อยืนยัน');if(t!=='ลบทั้งหมด'){if(t!==null)toast('ยกเลิก: พิมพ์ไม่ตรง');return;}
  ST.busy='กำลังลบคลังเก่า…';ST.msg='';ST.tab='story';render();
  try{const r=await botApi('/api/vcastaud',{act:'wipe_all',confirm:'ลบทั้งหมด'});
    if(ST.plan)for(const E of ST.plan.eps){if(ST.epst[E.no])await api('stop',{ep:E.no});}
    await api('autos_off');ST.onlyReady=false;localStorage.setItem('ss_onlyready','0');LG.clear();for(const k in LT)delete LT[k];ST.lib=[];
    toast('ลบแล้ว '+(r.removed||0)+' คน เริ่มเรียกนักแสดงใหม่');ST.busy='';await load();await startAll();
  }catch(e){ST.busy='';ST.msg='⚠️ '+botErr(e);await load();}}

  A.querySelectorAll('[data-lt]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('lora_test',{lora:+b.dataset.lt});toast('สั่งวาดภาพทดสอบแล้ว รอสักครู่');}catch(e){toast(botErr(e));}await load();});
  A.querySelectorAll('[data-lw]').forEach(r=>{const k=r.dataset.lw,lab=[...A.querySelectorAll('[data-lwv]')].find(x=>x.dataset.lwv===k);r.oninput=()=>{if(lab)lab.textContent=(r.value/100).toFixed(2);};r.onchange=async()=>{try{await api('lorawt',{key:k,w:r.value/100});(ST.weights=ST.weights||{})[k]=r.value/100;toast('บันทึกน้ำหนักแล้ว (มีผลกับภาพที่สร้างใหม่)');}catch(e){toast(botErr(e));}};});
  A.querySelectorAll('[data-retry]').forEach(b=>b.onclick=async()=>{b.disabled=true;LG.delete(b.dataset.retry);try{await api('lorago',{cand:b.dataset.retry});toast('สั่งเทรนใหม่แล้ว');}catch(e){toast(botErr(e));}await load();});}
function epList(pl){return pl.eps.map(E=>{const s=ST.epst[E.no],sc=ST.scn.filter(x=>+x.ep===E.no),fin=ST.fin[E.no],tot=sc.reduce((n,x)=>n+(+x.tot||0),0),vid=sc.reduce((n,x)=>n+(+x.vid||0),0),img=sc.reduce((n,x)=>n+(+x.img||0),0),done=sc.filter(x=>+x.fin).length;
    const st=fin?'<span class="ok">✅ เสร็จ</span>':!s?`<span class="mu">ยังไม่เริ่ม</span> <button class="sm" data-ep="${E.no}">▶ ทำตอนนี้</button>`:s.status==='waiting'?`<span class="warn">⏳ รอ LoRA ${esc((s.need||[]).join(', '))}</span>`:`<span class="warn">🎬 กำลังทำ</span>`;
    const pct=tot?Math.round((img+vid)/(tot*2)*100):0;
    return `<div class="it"><div class="row sp"><b>ตอน ${E.no} · ${esc(E.title)}</b>${st}</div>${s&&s.status==='running'&&!fin?`<div class="mu">ซีนเสร็จ ${done}/${sc.length||3} · ภาพ ${img}/${tot} · วิดีโอ ${vid}/${tot}</div><div class="bar"><i style="width:${pct}%"></i></div>`:''}
      ${fin?`<a class="btn" href="${esc(botU('/vid/'+fin))}" target="_blank">▶ ดูตอนนี้</a>`:sc.filter(x=>+x.final).map(x=>`<a class="btn" href="${esc(botU('/vid/'+x.final))}" target="_blank">▶ ซีน ${x.sc}</a>`).join('')}</div>`;}).join('');}
load();
</script></body></html>
