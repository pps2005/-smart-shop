<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แต่งตัวน้องฟ้า · Avatar Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<style>
  :root { --bg: #170e2a; --panel: #22153b; --card: #2c1d4a; --line: rgba(190,150,255,0.35); --text: #f6efff; --muted: #c4b3e6; --accent: #a77bff; --accent2: #ff7fbf; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Mitr', system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 1fr 440px; height: 100vh; height: 100dvh; overflow: hidden; }
  button { font-family: inherit; cursor: pointer; color: var(--text); }
  .view { position: relative; background: radial-gradient(circle at 50% 35%, #4a2c86, #1a0f30 70%); overflow: hidden; }
  #c { width: 100%; height: 100%; display: block; touch-action: none; }
  .top { position: absolute; left: 14px; right: 14px; top: max(12px, env(safe-area-inset-top)); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .top h1 { margin: 0 auto 0 4px; font-size: 22px; font-weight: 600; }
  .chip { padding: 9px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: rgba(20,10,40,0.6); font-size: 16px; text-decoration: none; color: var(--text); }
  .chip.pri { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: 0; }
  .test { position: absolute; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom)); display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; padding: 0 10px; }
  .test button { padding: 9px 12px; font-size: 15px; border-radius: 12px; border: 1px solid var(--line); background: rgba(20,10,40,0.65); }
  .zoom { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; }
  .zoom button { width: 48px; height: 48px; border-radius: 14px; border: 1.5px solid var(--line); background: rgba(20,10,40,0.65); font-size: 18px; }
  #say { position: absolute; left: 50%; transform: translateX(-50%); bottom: 76px; font-size: 19px; padding: 8px 16px; border-radius: 14px; background: rgba(10,4,22,0.75); display: none; text-align: center; max-width: 90%; }

  .panel { background: var(--panel); display: flex; flex-direction: column; min-height: 0; border-left: 1.5px solid var(--line); }
  .presets { display: flex; gap: 6px; overflow-x: auto; padding: 12px 12px 6px; flex-shrink: 0; }
  .presets button { flex-shrink: 0; padding: 9px 13px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); font-size: 15px; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; padding: 6px 12px; flex-shrink: 0; }
  .tabs button { flex-shrink: 0; padding: 10px 14px; font-size: 16px; border-radius: 12px; border: 0; background: transparent; color: var(--muted); }
  .tabs button.on { background: var(--accent); color: #fff; }
  .body { flex: 1; overflow-y: auto; padding: 6px 14px 20px; }
  .item { background: var(--card); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; }
  .item > label { display: block; font-size: 16px; margin-bottom: 8px; color: var(--muted); }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opts button { padding: 10px 13px; font-size: 16px; border-radius: 12px; border: 1.5px solid var(--line); background: rgba(255,255,255,0.04); }
  .opts button.on { border-color: var(--accent2); background: rgba(255,127,191,0.2); }
  .sw { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .sw button { width: 38px; height: 38px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,0.25); }
  .sw button.on { border-color: #fff; box-shadow: 0 0 0 3px var(--accent2); }
  .sw input[type=color] { width: 44px; height: 40px; border: 0; background: none; padding: 0; }
  .tog { display: flex; justify-content: space-between; align-items: center; font-size: 17px; }
  .tog input { width: 26px; height: 26px; accent-color: var(--accent2); }
  input[type=range] { width: 100%; accent-color: var(--accent2); height: 30px; }
  .rv { float: right; color: var(--text); }
  textarea, input[type=text], select { width: 100%; font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: rgba(0,0,0,0.25); color: var(--text); }
  textarea { min-height: 90px; resize: vertical; }
  .act { width: 100%; padding: 12px; font-size: 17px; border-radius: 14px; border: 0; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .foot { display: flex; gap: 6px; padding: 10px 12px max(10px, env(safe-area-inset-bottom)); border-top: 1.5px solid var(--line); flex-shrink: 0; }
  .foot button { flex: 1; padding: 11px 6px; font-size: 15px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); }
  #toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: #2f9e6a; padding: 8px 16px; border-radius: 12px; font-size: 16px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 9; }
  .note { font-size: 13px; color: var(--muted); line-height: 1.5; }

  @media (max-width: 900px), (orientation: portrait) {
    body { grid-template-columns: 1fr; grid-template-rows: 46vh 1fr; }
    .panel { border-left: 0; border-top: 1.5px solid var(--line); }
    .test { display: none; }
    #say { bottom: 14px; }
  }
</style>
</head>
<body>
<div class="view">
  <canvas id="c"></canvas>
  <div class="top">
    <h1>👗 แต่งตัวน้องฟ้า</h1>
    <a class="chip pri" href="ai-live.html">🎙️ ไปหน้า AI Live</a>
  </div>
  <div class="zoom">
    <button id="zIn" title="ซูมหน้า">🔍</button>
    <button id="zOut" title="ทั้งตัว">🧍</button>
    <button id="spin" title="หมุนอัตโนมัติ">🔄</button>
  </div>
  <div class="test">
    <button data-g="wave" data-e="happy">👋 โบกมือ</button>
    <button data-g="paw" data-e="wink">🐾 เหมียว</button>
    <button data-g="heart" data-e="shy">💜 หัวใจ</button>
    <button data-g="point" data-e="wink">👉 ชี้</button>
    <button data-g="think" data-e="neutral">🤔 คิด</button>
    <button data-g="cheer" data-e="happy">🎉 เย้</button>
    <button data-g="nod" data-e="sad">😢 เศร้า</button>
    <button data-g="nod" data-e="angry">😠 งอน</button>
  </div>
  <div id="say"></div>
</div>

<div class="panel">
  <div class="presets" id="presets"></div>
  <div class="tabs" id="tabs"></div>
  <div class="body" id="body"></div>
  <div class="foot">
    <button id="bExport">📤 ส่งออก</button>
    <button id="bImport">📥 นำเข้า</button>
    <button id="bRandom">🎲 สุ่ม</button>
    <button id="bReset">↺ รีเซ็ต</button>
  </div>
</div>
<div id="toast">บันทึกแล้ว ✓</div>
<input type="file" id="file" accept="application/json" hidden>

<script type="module">
import { THREE, FahAvatar, DEFAULT_CONFIG, PRESETS, mergeConfig, loadAvatarConfig, saveAvatarConfig, createRenderer, addLights } from './fah-avatar.js';

const $ = id => document.getElementById(id);
let cfg = loadAvatarConfig();

// ---------- ฉาก ----------
const canvas = $('c');
const renderer = createRenderer(canvas);
const scene = new THREE.Scene();
addLights(scene);
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
const avatar = new FahAvatar(cfg); scene.add(avatar.root);
const floor = new THREE.Mesh(new THREE.CircleGeometry(0.75, 48), new THREE.MeshBasicMaterial({ color: 0x8f63e8, transparent: true, opacity: 0.25 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -0.06; scene.add(floor);
const ring = new THREE.Mesh(new THREE.RingGeometry(0.72, 0.76, 64), new THREE.MeshBasicMaterial({ color: 0xff9fd6, transparent: true, opacity: 0.6 }));
ring.rotation.x = -Math.PI / 2; ring.position.y = -0.055; scene.add(ring);

const views = { full: { y: 1.05, z: 5.0, look: 1.0 }, face: { y: 1.58, z: 2.0, look: 1.52 } };
let view = 'full', camCur = { ...views.full };
let rotY = 0, rotV = 0, autoSpin = false, drag = null;

function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement); resize();

canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX }; canvas.setPointerCapture(e.pointerId); autoSpin = false; });
canvas.addEventListener('pointermove', e => { if (!drag) return; rotV = (e.clientX - drag.x) * 0.012; rotY += rotV; drag.x = e.clientX; });
canvas.addEventListener('pointerup', () => { drag = null; });
$('zIn').onclick = () => view = 'face';
$('zOut').onclick = () => view = 'full';
$('spin').onclick = () => autoSpin = !autoSpin;

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (autoSpin) rotY += dt * 0.6; else if (!drag) { rotV *= 0.92; rotY += rotV; }
  avatar.root.rotation.y = rotY;
  const v = views[view];
  for (const k of ['y', 'z', 'look']) camCur[k] += (v[k] - camCur[k]) * Math.min(1, dt * 5);
  camera.position.set(0, camCur.y, camCur.z); camera.lookAt(0, camCur.look, 0);
  avatar.update(dt); renderer.render(scene, camera);
});
document.querySelectorAll('.test button').forEach(b => b.onclick = () => { avatar.gesture(b.dataset.g); avatar.setEmotion(b.dataset.e, 3); });

// ---------- ตัวเลือก ----------
const HAIR = ['#2c1a3d', '#151018', '#5a3420', '#3b2418', '#d9a35b', '#f3e1a0', '#f3c3dc', '#8fd3ff', '#b9a5ff', '#e8e8ef', '#c0392b', '#3c8d6e'];
const EYES = ['#9a5cff', '#4f8cff', '#21b5c4', '#3fbf6f', '#f2b134', '#e0552a', '#ff4f93', '#c0392b', '#6b4a33', '#7f8c9a'];
const SKIN = ['#fff1ea', '#ffe9df', '#f8d9c4', '#efc4a4', '#d9a37f', '#b07a56'];
const CLOTH = ['#1f1a2b', '#22305e', '#ffffff', '#1c1a22', '#fff6ea', '#a67cff', '#ff6fa8', '#7fd3ff', '#3fbf6f', '#f5c542', '#c0392b', '#8e8e9a'];
const LANGS = [['ja-JP', 'ญี่ปุ่น 🇯🇵'], ['ko-KR', 'เกาหลี 🇰🇷'], ['zh-CN', 'จีน 🇨🇳'], ['en-US', 'อังกฤษ 🇺🇸'], ['th-TH', 'ไทย 🇹🇭']];
const SAMPLE = {
  'ja-JP': ['こんにちは！ファーだよ、今日もよろしくね！', 'สวัสดีค่ะ! ฟ้าเองนะ วันนี้ก็ฝากตัวด้วยนะคะ!'],
  'ko-KR': ['안녕하세요! 저는 파예요, 오늘도 잘 부탁해요!', 'สวัสดีค่ะ! ฟ้าเองนะ วันนี้ก็ฝากตัวด้วยนะคะ!'],
  'zh-CN': ['大家好！我是小芳，今天也请多多关照！', 'สวัสดีค่ะ! ฟ้าเองนะ วันนี้ก็ฝากตัวด้วยนะคะ!'],
  'en-US': ["Hi! I'm Fah, nice to see you today!", 'สวัสดีค่ะ! ฟ้าเองนะ ดีใจที่ได้เจอวันนี้!'],
  'th-TH': ['สวัสดีค่ะ ฟ้าเองนะคะ วันนี้ก็ฝากตัวด้วยนะคะ', ''],
};

const TABS = [
  { name: '💇 ผม', items: [
    { k: 'hairStyle', l: 'ทรงผม', t: 'opt', o: [['long', 'ยาวสลวย'], ['twintail', 'ทวินเทล'], ['ponytail', 'หางม้า'], ['bob', 'บ็อบ'], ['short', 'สั้น']] },
    { k: 'bangs', l: 'หน้าม้า', t: 'opt', o: [['side', 'ปัดข้าง'], ['straight', 'เต็มหน้า'], ['split', 'แสกกลาง']] },
    { k: 'hairColor', l: 'สีผม', t: 'color', s: HAIR },
    { k: 'ahoge', l: 'ผมชี้ด้านบน (อะโฮเงะ)', t: 'tog' },
  ] },
  { name: '😊 หน้า', items: [
    { k: 'eyeColor', l: 'สีตา', t: 'color', s: EYES },
    { k: 'eyeShape', l: 'ทรงตา', t: 'opt', o: [['round', 'ตากลมโต'], ['sharp', 'ตาคม'], ['sleepy', 'ตาง่วง']] },
    { k: 'eyeSize', l: 'ขนาดตา', t: 'range', min: 0.8, max: 1.25, step: 0.01 },
    { k: 'skin', l: 'สีผิว', t: 'color', s: SKIN },
    { k: 'blush', l: 'แก้มแดงระเรื่อ', t: 'tog' },
    { k: 'fang', l: 'เขี้ยวน้อย', t: 'tog' },
  ] },
  { name: '🐱 หู', items: [
    { k: 'ears', l: 'แบบหู', t: 'opt', o: [['cat', 'แมว 🐱'], ['fox', 'จิ้งจอก 🦊'], ['bunny', 'กระต่าย 🐰'], ['none', 'ไม่มี']] },
    { k: 'earColor', l: 'สีหู', t: 'color', s: HAIR },
    { k: 'earInner', l: 'สีด้านในหู', t: 'color', s: ['#f5eef8', '#ffffff', '#ffc2dc', '#fff3e6', '#e7d6ff'] },
  ] },
  { name: '👗 ชุด', items: [
    { k: 'outfit', l: 'ชุด', t: 'opt', o: [['hoodie', 'แจ็กเก็ตแมว'], ['sailor', 'ชุดนักเรียน'], ['maid', 'ชุดเมด'], ['idol', 'ชุดไอดอล'], ['dress', 'เดรสน่ารัก']] },
    { k: 'outfitMain', l: 'สีหลัก', t: 'color', s: CLOTH },
    { k: 'outfitAccent', l: 'สีตกแต่ง', t: 'color', s: CLOTH },
    { k: 'innerColor', l: 'สีเสื้อตัวใน', t: 'color', s: ['#ffffff', '#f4eefc', '#ffe0ef', '#e0f2ff', '#1f1a2b'] },
  ] },
  { name: '🎀 ของแต่ง', items: [
    { k: 'bow', l: 'โบว์ผม', t: 'tog' },
    { k: 'bowColor', l: 'สีโบว์/ยางมัดผม', t: 'color', s: CLOTH },
    { k: 'clip', l: 'กิ๊บหน้าแมว + กิ๊บไขว้', t: 'tog' },
    { k: 'choker', l: 'โชคเกอร์', t: 'tog' },
    { k: 'bell', l: 'กระดิ่ง', t: 'tog' },
    { k: 'glasses', l: 'แว่นตา', t: 'tog' },
    { k: 'headphones', l: 'หูฟัง', t: 'tog' },
  ] },
  { name: '🎤 เสียง', items: [
    { k: 'voice.lang', l: 'ภาษาที่น้องฟ้าพูด (ซับเป็นไทยเสมอ)', t: 'opt', o: LANGS },
    { k: 'voice.voiceName', l: 'เสียงในเครื่องนี้', t: 'voice' },
    { k: 'voice.pitch', l: 'ระดับเสียง (สูง = ใสน่ารัก)', t: 'range', min: 0.5, max: 2, step: 0.05 },
    { k: 'voice.rate', l: 'ความเร็วพูด', t: 'range', min: 0.6, max: 1.6, step: 0.05 },
    { t: 'btn', l: '🔊 ทดสอบเสียง', fn: testVoice },
    { t: 'note', l: 'เสียงใช้ระบบอ่านออกเสียงในตัว iPad/มือถือ ฟรีไม่ต้องต่อเน็ต · ถ้าไม่มีเสียงภาษาที่เลือก ให้เพิ่มที่ การตั้งค่า › การช่วยการเข้าถึง › เนื้อหาที่พูด › เสียง' },
  ] },
  { name: '💬 ตัวตน', items: [
    { k: 'name', l: 'ชื่อเลขา', t: 'text' },
    { k: 'personality', l: 'นิสัย/บุคลิก (AI จะพูดตามนี้)', t: 'area' },
  ] },
];

const get = k => k.split('.').reduce((o, p) => o?.[p], cfg);
const set = (k, v) => { const ps = k.split('.'); let o = cfg; while (ps.length > 1) o = o[ps.shift()]; o[ps[0]] = v; };

let saveT, rebuildT;
function changed(rebuild = true) {
  if (rebuild) { clearTimeout(rebuildT); rebuildT = setTimeout(() => avatar.setConfig(cfg), 40); }
  clearTimeout(saveT); saveT = setTimeout(() => { if (saveAvatarConfig(cfg)) toast('บันทึกแล้ว ✓ มีผลกับหน้า AI Live'); }, 500);
}
function toast(t) { const e = $('toast'); e.textContent = t; e.style.opacity = 1; clearTimeout(e._t); e._t = setTimeout(() => e.style.opacity = 0, 1600); }

let tab = 0;
function renderTabs() {
  const tb = $('tabs'); tb.innerHTML = '';
  TABS.forEach((T, i) => { const b = document.createElement('button'); b.textContent = T.name; if (i === tab) b.className = 'on'; b.onclick = () => { tab = i; renderTabs(); renderBody(); }; tb.append(b); });
}
function renderBody() {
  const body = $('body'); body.innerHTML = '';
  for (const it of TABS[tab].items) {
    const box = document.createElement('div'); box.className = 'item';
    if (it.t === 'note') { box.innerHTML = `<div class="note"></div>`; box.firstChild.textContent = it.l; body.append(box); continue; }
    if (it.t === 'btn') { const b = document.createElement('button'); b.className = 'act'; b.textContent = it.l; b.onclick = it.fn; box.append(b); body.append(box); continue; }
    if (it.t === 'tog') {
      box.innerHTML = `<label class="tog"><span></span><input type="checkbox"></label>`;
      box.querySelector('span').textContent = it.l; const cb = box.querySelector('input'); cb.checked = !!get(it.k);
      cb.onchange = () => { set(it.k, cb.checked); changed(); };
      body.append(box); continue;
    }
    const lab = document.createElement('label'); lab.textContent = it.l; box.append(lab);
    if (it.t === 'opt') {
      const w = document.createElement('div'); w.className = 'opts';
      for (const [v, txt] of it.o) {
        const b = document.createElement('button'); b.textContent = txt; if (get(it.k) === v) b.className = 'on';
        b.onclick = () => { set(it.k, v); if (it.k === 'voice.lang') set('voice.voiceName', ''); changed(!it.k.startsWith('voice')); renderBody(); };
        w.append(b);
      }
      box.append(w);
    } else if (it.t === 'color') {
      const w = document.createElement('div'); w.className = 'sw';
      for (const col of it.s) {
        const b = document.createElement('button'); b.style.background = col; if (get(it.k).toLowerCase() === col) b.className = 'on';
        b.onclick = () => { set(it.k, col); changed(); renderBody(); }; w.append(b);
      }
      const inp = document.createElement('input'); inp.type = 'color'; inp.value = get(it.k); inp.title = 'เลือกสีเอง';
      inp.oninput = () => { set(it.k, inp.value); changed(); }; w.append(inp);
      box.append(w);
    } else if (it.t === 'range') {
      const rv = document.createElement('span'); rv.className = 'rv'; rv.textContent = Number(get(it.k)).toFixed(2); lab.append(rv);
      const r = document.createElement('input'); r.type = 'range'; r.min = it.min; r.max = it.max; r.step = it.step; r.value = get(it.k);
      r.oninput = () => { set(it.k, Number(r.value)); rv.textContent = Number(r.value).toFixed(2); changed(!it.k.startsWith('voice')); };
      box.append(r);
    } else if (it.t === 'text' || it.t === 'area') {
      const el = document.createElement(it.t === 'text' ? 'input' : 'textarea'); if (it.t === 'text') el.type = 'text'; el.value = get(it.k);
      el.oninput = () => { set(it.k, el.value); changed(false); }; box.append(el);
    } else if (it.t === 'voice') {
      const sel = document.createElement('select');
      const lang = cfg.voice.lang.slice(0, 2);
      const list = speechSynthesis.getVoices().filter(v => v.lang.startsWith(lang));
      sel.add(new Option(list.length ? 'อัตโนมัติ' : 'ไม่พบเสียงภาษานี้ในเครื่อง (จะแสดงแค่ซับ)', ''));
      for (const v of list) sel.add(new Option(`${v.name} (${v.lang})`, v.name));
      sel.value = cfg.voice.voiceName || '';
      sel.onchange = () => { set('voice.voiceName', sel.value); changed(false); };
      box.append(sel);
    }
    body.append(box);
  }
}
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { if (TABS[tab].name.includes('เสียง')) renderBody(); };

function testVoice() {
  const [sp, th] = SAMPLE[cfg.voice.lang] || SAMPLE['ja-JP'];
  const say = $('say'); say.textContent = (th || sp).replace('ฟ้า', cfg.name.replace('น้อง', '')); say.style.display = 'block';
  avatar.gesture('wave'); avatar.setEmotion('happy', 3);
  const finish = () => { avatar.setTalking(false); setTimeout(() => say.style.display = 'none', 1500); };
  const voices = speechSynthesis.getVoices();
  const v = voices.find(x => x.name === cfg.voice.voiceName) || voices.find(x => x.lang.replace('_', '-') === cfg.voice.lang) || voices.find(x => x.lang.startsWith(cfg.voice.lang.slice(0, 2)));
  if (!v) { avatar.setTalking(true); setTimeout(finish, 2500); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(sp); u.voice = v; u.lang = v.lang; u.pitch = cfg.voice.pitch; u.rate = cfg.voice.rate;
  u.onstart = () => avatar.setTalking(true); u.onend = finish; u.onerror = finish;
  speechSynthesis.speak(u);
}

// ---------- พรีเซ็ต / ปุ่มล่าง ----------
for (const [id, p] of Object.entries(PRESETS)) {
  const b = document.createElement('button'); b.textContent = p.label;
  b.onclick = () => { const keep = { name: cfg.name, personality: cfg.personality, voice: cfg.voice }; cfg = mergeConfig(mergeConfig(DEFAULT_CONFIG, p.cfg), keep); changed(); renderBody(); avatar.gesture('cheer'); avatar.setEmotion('happy', 2); };
  $('presets').append(b);
}
$('bReset').onclick = () => { if (confirm('รีเซ็ตเป็นน้องฟ้าต้นแบบ?')) { cfg = mergeConfig(DEFAULT_CONFIG, null); changed(); renderBody(); } };
$('bRandom').onclick = () => {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  Object.assign(cfg, {
    hairStyle: pick(['long', 'twintail', 'ponytail', 'bob', 'short']), bangs: pick(['side', 'straight', 'split']), hairColor: pick(HAIR),
    eyeColor: pick(EYES), eyeShape: pick(['round', 'sharp', 'sleepy']), ears: pick(['cat', 'cat', 'fox', 'bunny', 'none']),
    outfit: pick(['hoodie', 'sailor', 'maid', 'idol', 'dress']), outfitMain: pick(CLOTH), outfitAccent: pick(CLOTH), bowColor: pick(CLOTH),
    bow: Math.random() > 0.3, glasses: Math.random() > 0.8, headphones: Math.random() > 0.75,
  });
  cfg.earColor = cfg.hairColor; changed(); renderBody(); avatar.gesture('cheer'); avatar.setEmotion('happy', 2);
};
$('bExport').onclick = () => {
  const blob = new Blob([JSON.stringify(cfg, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'nong-fah-avatar.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$('bImport').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { cfg = mergeConfig(DEFAULT_CONFIG, JSON.parse(await f.text())); changed(); renderBody(); toast('นำเข้าแล้ว ✓'); }
  catch (err) { toast('ไฟล์ไม่ถูกต้อง'); }
  e.target.value = '';
};

renderTabs(); renderBody();
</script>
