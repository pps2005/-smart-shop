 if(S){

 }

 b.sort(function(x,y){return x-y;});
 var bk=b.indexOf(d.back)>=0?d.back:(b.length?b[b.length-1]:0);

async function enqueue(body,msg){
 try{var r=await api('/api/enqueue',body);toast(msg||('ส่งเข้าคิวแล้ว '+r.added+' ภาพ'));return true;}catch(e){toast(errMsg(e));return false;}
}

var A={
 bk:function(){history.length>1?history.back():(location.href='index.html');},
 tab:function(v){ST.tab=v;render();},
 cat:function(v){ST.cat=v;render();},
 card:function(v){cardSheet(+v);},
 close:close_,
 newdeck:function(){newDeckSheet();},
 fsd:function(v){ST.draft.fs=v;newDeckSheet();},
 bsd:function(v){ST.draft.bst=v;newDeckSheet();},

 th:function(v){ST.draft.th=v;newDeckSheet();},
 bs:function(v){ST.draft.bs=v;newDeckSheet();},
 mk:async function(){
  if(!need())return;
  var nm=($('#dn').value||'').trim()||('สำรับ '+(ST.decks.length+1));

  if(!ok)return;

 },
 use:function(v){ST.cur=v;persist();render();},
 fill:async function(v){
  var d=deck(v);if(!d||!need())return;var inf=ST.inf[v],items=[];
  CARDS.forEach(function(c,i){if(!inf.f[i+1]&&!inf.pend[i+1])items.push({scene:i+1,prompt:promptFor(i,d)});});

 },
 resume:async function(){try{await api('/api/resume',{});toast('ส่งงานที่ล้มเหลวกลับเข้าคิวแล้ว');poll();}catch(e){toast(errMsg(e));}},
 del:async function(v){var d=deck(v);if(!d)return;var inf=ST.inf[v]||info(d),busy=inf.n>0;if(!confirm('ลบสำรับ "'+d.name+'" ออกจากรายการนี้?'+(busy?' งานที่ยังรอคิวของสำรับนี้จะถูกยกเลิกด้วย':'')+' (ภาพที่บอทสร้างแล้วยังอยู่ในบอท)'))return;if(cfg().url){try{var a=await api('/api/clearjobs',{prefix:P(d,'front')}),b=await api('/api/clearjobs',{prefix:P(d,'back')});if((a.n||0)+(b.n||0))toast('ยกเลิกงานที่รอคิว '+((a.n||0)+(b.n||0))+' งานแล้ว');}catch(e){toast(errMsg(e));}}ST.decks=ST.decks.filter(function(x){return x.id!==v;});if(ST.cur===v)ST.cur='';persist();ST.sig='';render();poll();},
 bot:function(){botSheet();},
 botsave:function(){var c=cfg();c.url=($('#bu').value||'').trim();c.key=$('#bkk').value||'';try{localStorage.setItem('ss_imgbot',JSON.stringify(c));}catch(e){}close_();toast('บันทึกแล้ว');ST.sig='';poll();},

 bkset:function(v){var d=deck(ST.open);if(!d)return;d.bs=v;persist();backSheet(d.id);},

 view:function(v){var d=deck(v);if(!d)return;ST.vd=v;var inf=ST.inf[v]||info(d),f=0;for(var i=0;i<CARDS.length;i++){if(inf.f[i+1]){f=i;break;}}viewSheet(f);},

 edst:function(v){var x=one(ST.st,v);if(!x)return;ST.form={eid:v,tn:x.tn,tp:x.tp,sn:x.sn,sp:x.sp,bp:x.bp||'',bsn:x.bsn||'',bsp:x.bsp||'',couple:!!x.couple};ST.tab='design';render();window.scrollTo(0,0);},
 eddk:function(v){var d=deck(v);if(!d)return;var id=d.sid||d.id;if(!one(ST.st,id)){ST.st.push({id:id,tn:d.tn,sn:d.sn,tp:d.tp,sp:d.sp,bp:d.bp||'',bsn:d.bsn||'',bsp:d.bsp||'',couple:!!d.couple});persistSt();}d.sid=id;persist();A.edst(id);},
 cancst:function(){ST.form={};render();},
 savest:function(){
  var f=ST.form,x=one(ST.st,f.eid),t=function(v){return String(v||'').trim();};
  if(!x)return;var tn=t(f.tn),sn=t(f.sn),tp=t(f.tp),sp=t(f.sp);
  if(!tn||!sn||!tp||!sp){toast('กรอกชื่อธีม ชื่อสไตล์ และ prompt ให้ครบ');return;}

  ST.decks.forEach(function(d){if(d.sid===x.id){d.tn=tn;d.sn=sn;d.tp=tp;d.sp=sp;d.bp=x.bp;d.bsn=x.bsn;d.bsp=x.bsp;d.couple=x.couple;}});
  persistSt();persist();ST.form={};ST.sig='';render();toast('บันทึกแล้ว ใบที่สร้างต่อจากนี้จะใช้ prompt ใหม่');
 },
 usest:function(v){var x=one(ST.st,v);if(!x)return;var nm=ST.form.name;ST.form={sid:v,name:nm,tn:x.tn,tp:x.tp,sn:x.sn,sp:x.sp,bp:x.bp||'',bsn:x.bsn||'',bsp:x.bsp||'',couple:!!x.couple};render();},

 mkc:async function(){
  if(!need())return;
  var f=ST.form,t=function(x){return String(x||'').trim();};
  var tn=t(f.tn),sn=t(f.sn),tp=t(f.tp),sp=t(f.sp),bp=t(f.bp),bsn=t(f.bsn),bsp=t(f.bsp),cp=f.couple!==false;
  if(!tn||!sn||!tp||!sp){toast('กรอกชื่อธีม ชื่อสไตล์ และ prompt ด้านหน้าให้ครบ');return;}
  if(!bp&&!bsp){toast('กรอก prompt ด้านหลัง (ลวดลายหรือสไตล์ อย่างน้อย 1 ช่อง)');return;}
  var d={id:Math.random().toString(36).slice(2,8),name:t(f.name)||tn,custom:1,tn:tn,sn:sn,tp:tp,sp:sp,bp:bp,bsn:bsn,bsp:bsp,couple:cp,theme:'',bs:'',back:0};
  var mx=0;CARDS.forEach(function(c,i){mx=Math.max(mx,promptFor(i,d).length);});
  if(mx>2000&&!confirm('prompt ด้านหน้ายาวสุด '+mx+' ตัวอักษร เกินราว 2,000 ส่วนท้ายอาจถูกตัด ต่อไหม?'))return;
  var ok=await enqueue({project:P(d,'back'),items:[{scene:1,prompt:backPrompt(d)}],variants:3,raw:true},'');
  if(ok)ok=await enqueue({project:P(d,'front'),items:CARDS.map(function(c,i){return{scene:i+1,prompt:promptFor(i,d)};}),raw:true},'เริ่มสร้างสำรับแล้ว ภาพจะทยอยขึ้นมา');
  if(!ok)return;
  var x=ST.st.filter(function(y){return y.tn===tn&&y.sn===sn&&y.tp===tp&&y.sp===sp&&(y.bp||'')===bp&&(y.bsp||'')===bsp&&!!y.couple===cp;})[0];
  if(!x){x={id:d.id,tn:tn,sn:sn,tp:tp,sp:sp,bp:bp,bsn:bsn,bsp:bsp,couple:cp};ST.st.push(x);persistSt();}
  d.sid=x.id;ST.decks.push(d);ST.cur=d.id;persist();ST.form={};ST.tab='decks';ST.sig='';poll();render();
 },
};
function fld(e){var k=e.target.dataset&&e.target.dataset.f;if(k){ST.form[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;var n=e.target.nextElementSibling;if(n&&n.classList.contains('cnt'))n.textContent=e.target.value.length+' ตัวอักษร';}}
document.addEventListener('input',fld);document.addEventListener('change',fld);
var sx=null;
document.addEventListener('touchstart',function(e){sx=(ST.vd&&e.target.closest('#pn'))?e.touches[0].clientX:null;},{passive:true});
document.addEventListener('touchend',function(e){if(sx===null||!ST.vd)return;var dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50)(dx<0?A.vnext:A.vprev)();},{passive:true});
document.addEventListener('keydown',function(e){if(!ST.vd||!$('#sheet').classList.contains('on'))return;if(e.key==='ArrowLeft')A.vprev();else if(e.key==='ArrowRight')A.vnext();else if(e.key==='Escape')close_();});
document.addEventListener('click',function(e){
 if(e.target.id==='sheet'){close_();return;}
 var fl=e.target.closest('#fl');if(fl&&!e.target.closest('button')){fl.classList.toggle('on');return;}
 var t=e.target.closest('button[data-a]');if(!t)return;
 var f=A[t.dataset.a];if(f)f(t.dataset.v);
});
render();poll();
})();
