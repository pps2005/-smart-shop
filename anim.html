<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>โรงงานตัวละคร · SMART SHOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600&family=Sarabun:wght@400;600&display=swap">
<style>
/* โรงงานตัวละคร: อัปรูป → เว็บทำท่าทางให้อัตโนมัติ → ดู → ส่งโมเดลให้ Claude */
:root{--bg:#0B1020;--card:#141B2E;--card2:#1B2440;--line:rgba(148,163,200,.22);--ink:#EEF2FA;--muted:#9AA6C2;--cyan:#5EE1FF;--ok:#4ADE80;--you:#FFC24B;--red:#FF6B7A;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,system-ui,sans-serif;font-size:18px;line-height:1.5}
button,input{font:inherit;color:inherit}
h1,h2,h3{font-family:Kanit,Sarabun,sans-serif;font-weight:600;margin:0;line-height:1.3}
#top{position:sticky;top:0;z-index:5;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px;background:rgba(11,16,32,.94);border-bottom:1px solid var(--line)}
#top h1{font-size:21px}
.ib{min-width:48px;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:inline-grid;place-items:center;font-size:20px;color:var(--ink);text-decoration:none;cursor:pointer}
.btn{min-height:54px;padding:10px 20px;border-radius:16px;border:1px solid var(--line);background:var(--card2);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.main{background:linear-gradient(135deg,#2563eb,#06b6d4);border-color:transparent;font-size:19px}
.btn.ok{background:#15803d;border-color:#22c55e}
.btn.ghost{background:none}
.btn.red{color:#ffb3bb;border-color:rgba(255,107,122,.45);background:none}
.btn:disabled{opacity:.4}
main{max-width:1100px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)}
.steps{display:flex;gap:8px;margin:4px 0 16px;flex-wrap:wrap}
.steps span{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:15px;color:var(--muted)}
.steps span.on{background:#1e3a8a;border-color:#3b82f6;color:#fff}
.steps span.done{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;cursor:pointer;display:grid;gap:6px;text-align:center}
.ccard img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#0f1628;border-radius:12px}
.ccard b{font-family:Kanit,sans-serif;font-weight:500}
.new{display:grid;place-items:center;min-height:240px;border:2px dashed #3b82f6;background:rgba(37,99,235,.08);font-family:Kanit,sans-serif;font-size:20px;color:#93c5fd}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:14px}
.stage{position:relative;display:grid;place-items:center;background:repeating-conic-gradient(#1a2238 0 25%,#141b2e 0 50%) 0 0/28px 28px;border-radius:16px;overflow:hidden;touch-action:none}
.stage canvas{max-width:100%;max-height:62vh;display:block}
.big{font-size:22px;font-family:Kanit,sans-serif}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:center;padding-bottom:6px}
.tile canvas{width:100%;aspect-ratio:9/14;display:block;background:radial-gradient(circle at 50% 40%,#2a3557,#151c30)}
.tile b{font-size:16px;font-weight:600}
input[type=text]{min-height:52px;border-radius:14px;border:1px solid var(--line);background:#0f1628;padding:8px 14px;width:100%;font-size:20px}
input[type=range]{width:100%;height:36px}
#viewer{position:fixed;inset:0;background:rgba(5,8,16,.92);z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#viewer canvas{max-height:76vh;max-width:96vw;border-radius:16px;background:radial-gradient(circle at 50% 40%,#2a3557,#151c30)}
#toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%);background:#111827;border:1px solid var(--line);padding:12px 18px;border-radius:14px;z-index:30;display:none;max-width:92%;text-align:center}
.pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 3px #2563eb;pointer-events:none}
</style>
</head>
<body>
<div id="top"><a class="ib" href="index.html" aria-label="กลับหน้าหลัก">←</a><h1>🎞 โรงงานตัวละคร</h1></div>
<main id="app"></main>
<div id="viewer"><h2 id="vT"></h2><canvas id="vC" width="720" height="1120"></canvas><button class="btn" id="vX">ปิด</button></div>
<div id="toast"></div>
<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="fModel" accept=".json,application/json" hidden>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m,ms=3000){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ms);}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ================= storage: character library (IndexedDB) ================= */
let dbp;function db(){return dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('ss_chars',1);r.onupgradeneeded=()=>r.result.createObjectStore('c',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));}
async function tx(mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('c',mode);const st=t.objectStore('c');const q=fn(st);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);});}
const listChars=()=>tx('readonly',s=>s.getAll());
const putChar=c=>tx('readwrite',s=>s.put(c));
const delChar=id=>tx('readwrite',s=>s.delete(id));

/* ================= motions (all automatic) ================= */
// each returns pose for time t (seconds, loops): {dx,dy,sx,sy,r,eyes,mouth,fx:[]}
const blinkAt=(t,every=3.2,ph=0)=>((t+ph)%every)<0.12;
const breathe=t=>{const b=Math.sin(t*2*Math.PI*.45);return {sy:1+.016*b,sx:1-.007*b};};
const hop=(t,f,h)=>{const p=(t*f)%1,y=Math.sin(p*Math.PI);const sq=p<.1?1-.12*(1-p/.1):1;return {dy:-h*y,sy:sq*(1+.04*y),sx:2-sq};};
const MOTIONS=[
 {id:'idle',n:'ยืนหายใจ',f:t=>({...breathe(t),eyes:blinkAt(t)?'closed':'open'})},
 {id:'blink',n:'กะพริบตา',f:t=>({...breathe(t),eyes:blinkAt(t,1.3)?'closed':'open'})},
 {id:'talk',n:'พูด',f:t=>{const m=['','small','open','small'][Math.floor(t*9)%4];return {...breathe(t),r:Math.sin(t*3)*1.2,mouth:m,eyes:blinkAt(t)?'closed':'open'};}},
 {id:'happy',n:'ดีใจ',f:t=>({...hop(t,1.8,.05),eyes:'happy',mouth:'smile',fx:['sparkle','blush']})},
 {id:'laugh',n:'หัวเราะ',f:t=>({...hop(t,3,.025),r:Math.sin(t*14)*2,eyes:'happy',mouth:'open',fx:['blush']})},
 {id:'shy',n:'เขิน',f:t=>({...breathe(t),r:Math.sin(t*2)*3,eyes:'happy',mouth:'small',fx:['blushX','heart']})},
 {id:'love',n:'ปลื้ม',f:t=>({...hop(t,1.2,.03),eyes:'happy',mouth:'smile',fx:['heart','blush']})},
 {id:'shock',n:'ตกใจ',f:t=>{const p=t%2;return {dx:p<.8?Math.sin(p*80)*.02*(1-p/.8):0,sy:p<.12?.9:1,sx:p<.12?1.08:1,mouth:'o',eyes:'open',fx:['bang','sweat']};}},
 {id:'confused',n:'งง',f:t=>({...breathe(t),r:7+Math.sin(t*2)*2,mouth:'small',eyes:blinkAt(t)?'closed':'open',fx:['q']})},
 {id:'sad',n:'เศร้า',f:t=>({sy:.965+.008*Math.sin(t*2),r:Math.sin(t*1.2)*1.5,eyes:'closed',mouth:'frown',fx:['tears','gloom']})},
 {id:'cry',n:'ร้องไห้',f:t=>({dy:Math.abs(Math.sin(t*12))*-.006,eyes:'squint',mouth:'wail',fx:['tearsBig','blush']})},
 {id:'angry',n:'โกรธ',f:t=>({dx:Math.sin(t*50)*.006,eyes:'open',mouth:'frown',fx:['anger','blush']})},
 {id:'sleepy',n:'ง่วง',f:t=>({...breathe(t*.7),r:Math.sin(t*.8)*4,eyes:(t%4)<2.6?'closed':'open',mouth:'small',fx:['zzz']})},
 {id:'sleep',n:'หลับ',f:t=>({...breathe(t*.6),r:6,eyes:'closed',fx:['zzz']})},
 {id:'nod',n:'พยักหน้า',f:t=>{const w=Math.sin(t*2*Math.PI*1.6);return {r:w*2.5,dy:Math.abs(w)*.012,eyes:'open',mouth:'small'};}},
 {id:'no',n:'ส่ายหน้า',f:t=>({r:Math.sin(t*2*Math.PI*1.8)*5,eyes:'open',mouth:'frown'})},
 {id:'sway',n:'โยกตัว',f:t=>({r:Math.sin(t*2*Math.PI*.8)*6,dy:-Math.abs(Math.sin(t*2*Math.PI*.8))*.012,eyes:'happy',mouth:'smile'})},
 {id:'bounce',n:'เด้งดึ๋ง',f:t=>({...hop(t,2.2,.06),eyes:blinkAt(t)?'closed':'open'})},
 {id:'jump',n:'กระโดด',f:t=>{const p=(t%1.6)/1.6;if(p>.6)return {eyes:'open'};const u=p/.6,h=Math.sin(u*Math.PI);const sq=u<.12?1-.15*Math.sin(u/.12*Math.PI):u>.88?1-.15*Math.sin((u-.88)/.12*Math.PI):1+.05*h;return {dy:-.22*h,sy:sq,sx:2-sq,eyes:u>.1&&u<.9?'happy':'open',mouth:u>.1&&u<.9?'open':''};}},
 {id:'walk',n:'เดิน',f:t=>{const P=4,p=(t%P)/P,dir=p<.5?1:-1,x=p<.5?p*2:2-p*2;return {dx:(x-.5)*.5,dy:-Math.abs(Math.sin(t*2*Math.PI*1.7))*.012,r:Math.sin(t*2*Math.PI*1.7)*2.5,flip:dir<0,eyes:blinkAt(t)?'closed':'open'};}},
 {id:'run',n:'วิ่ง',f:t=>{const P=2.4,p=(t%P)/P,dir=p<.5?1:-1,x=p<.5?p*2:2-p*2;return {dx:(x-.5)*.6,dy:-Math.abs(Math.sin(t*2*Math.PI*3.4))*.025,r:dir*7,flip:dir<0,eyes:'squint',mouth:'open',fx:['sweat']};}},
 {id:'shiver',n:'หนาวสั่น',f:t=>({dx:Math.sin(t*110)*.004,dy:Math.cos(t*97)*.002,eyes:'squint',mouth:'frown',fx:['cold']})},
 {id:'spin',n:'หมุนตัว',f:t=>{const p=(t%2)/2;return {r:p<.5?(1-Math.cos(p*2*Math.PI))/2*360:0,eyes:'happy',mouth:'open'};}},
];

/* ================= character engine ================= */
function makeChar(m){ // m = model {img, eyes[], mouth, skin, line, feet}
  const C={m,img:null,cache:new Map(),ready:null};
  C.ready=new Promise(r=>{const im=new Image();im.onload=()=>{C.img=im;r(C);};im.src=m.img;});
  C.layer=(eyes,mouth,fx)=>{const k=eyes+'|'+mouth+'|'+fx.join(',');if(C.cache.has(k))return C.cache.get(k);
    const c=document.createElement('canvas');c.width=C.img.naturalWidth;c.height=C.img.naturalHeight;const g=c.getContext('2d');
    if(fx.includes('redden')){g.drawImage(C.img,0,0);g.globalCompositeOperation='source-atop';g.fillStyle='rgba(255,60,60,.12)';g.fillRect(0,0,c.width,c.height);g.globalCompositeOperation='source-over';}
    else g.drawImage(C.img,0,0);
    if(m.eyes&&eyes&&eyes!=='open')drawEyes(g,m,eyes);
    if(m.mouth&&mouth)drawMouth(g,m,mouth);
    drawStaticFx(g,m,fx);
    if(C.cache.size>60)C.cache.clear();C.cache.set(k,c);return c;};
  return C;
}
const d2=m=>m.eyes?Math.hypot(m.eyes[1].x-m.eyes[0].x,m.eyes[1].y-m.eyes[0].y):m.w*.25;
function skinPatch(g,x,y,rx,ry,col){const gr=g.createRadialGradient(x,y,Math.min(rx,ry)*.55,x,y,Math.max(rx,ry)*1.08);
  gr.addColorStop(0,col);gr.addColorStop(.8,col);gr.addColorStop(1,col.replace('rgb(','rgba(').replace(')',',0)'));
  g.save();g.translate(x,y);g.scale(1,ry/rx);g.translate(-x,-y);g.fillStyle=gr;g.beginPath();g.arc(x,y,rx*1.08,0,7);g.fill();g.restore();}
function stroke(g,pts,w,col){g.save();g.lineCap='round';g.lineJoin='round';g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(pts[0][0],pts[0][1]);
  if(pts.length===3)g.quadraticCurveTo(pts[1][0],pts[1][1],pts[2][0],pts[2][1]);else for(const p of pts.slice(1))g.lineTo(p[0],p[1]);g.stroke();g.restore();}
function drawEyes(g,m,kind){const L=m.line||'rgb(40,32,40)';
  m.eyes.forEach((e,i)=>{const s=i===0?-1:1;const rx=e.rx,ry=e.ry;skinPatch(g,e.x,e.y+ry*.05,rx*1.05,ry*1.08,m.skin||'rgb(250,232,224)');
    const w=Math.max(3,rx*.11);
    if(kind==='closed')stroke(g,[[e.x-rx*.85,e.y-ry*.05],[e.x,e.y+ry*.55],[e.x+rx*.85,e.y-ry*.12]],w,L);
    if(kind==='happy')stroke(g,[[e.x-rx*.8,e.y+ry*.35],[e.x,e.y-ry*.75],[e.x+rx*.8,e.y+ry*.3]],w,L);
    if(kind==='squint'){const a=e.x-s*rx*.45;stroke(g,[[a,e.y-ry*.5],[e.x+s*rx*.35,e.y],[a,e.y+ry*.5]],w,L);}
  });}
function drawMouth(g,m,kind){const o=m.mouth,u=d2(m)*.07,L=m.line||'rgb(40,32,40)',F='rgb(176,78,92)';
  skinPatch(g,o.x,o.y,u*2.1,u*1.4,m.skin||'rgb(250,232,224)');g.save();g.lineWidth=Math.max(2,u*.32);g.strokeStyle=L;g.fillStyle=F;g.lineCap='round';
  const E=(rx,ry,dy=0)=>{g.beginPath();g.ellipse(o.x,o.y+dy,rx,ry,0,0,7);g.fill();g.stroke();};
  if(kind==='small')E(u*.7,u*.55);
  if(kind==='o')E(u*.8,u*1.05,u*.2);
  if(kind==='open'){g.beginPath();g.moveTo(o.x-u*1.3,o.y-u*.4);g.quadraticCurveTo(o.x,o.y-u*.2,o.x+u*1.3,o.y-u*.4);g.quadraticCurveTo(o.x+u*1.1,o.y+u*1.6,o.x,o.y+u*1.6);g.quadraticCurveTo(o.x-u*1.1,o.y+u*1.6,o.x-u*1.3,o.y-u*.4);g.fill();g.stroke();
    g.fillStyle='#ff8fa3';g.beginPath();g.ellipse(o.x,o.y+u*1.15,u*.6,u*.32,0,0,7);g.fill();}
  if(kind==='smile')stroke(g,[[o.x-u*1.2,o.y-u*.3],[o.x,o.y+u*1.1],[o.x+u*1.2,o.y-u*.3]],Math.max(2,u*.32),L);
  if(kind==='frown')stroke(g,[[o.x-u,o.y+u*.6],[o.x,o.y-u*.5],[o.x+u,o.y+u*.6]],Math.max(2,u*.32),L);
  if(kind==='wail'){g.beginPath();g.moveTo(o.x-u*1.6,o.y+u*1.2);g.quadraticCurveTo(o.x,o.y-u*1.6,o.x+u*1.6,o.y+u*1.2);g.closePath();g.fill();g.stroke();}
  g.restore();}
function drawStaticFx(g,m,fx){if(!m.eyes)return;const [a,b]=m.eyes,d=d2(m);
  if(fx.includes('blush')||fx.includes('blushX')){const k=fx.includes('blushX')?.65:.42;
    for(const e of [a,b]){const x=e.x,y=e.y+e.ry*1.25;const gr=g.createRadialGradient(x,y,0,x,y,d*.22);gr.addColorStop(0,`rgba(255,110,140,${k})`);gr.addColorStop(1,'rgba(255,110,140,0)');g.fillStyle=gr;g.beginPath();g.ellipse(x,y,d*.25,d*.13,0,0,7);g.fill();
      if(fx.includes('blushX'))for(let i=0;i<3;i++)stroke(g,[[x-d*.09+i*d*.07,y+d*.04],[x-d*.05+i*d*.07,y-d*.04]],Math.max(2,d*.012),'rgba(255,255,255,.9)');}}
  if(fx.includes('tears')||fx.includes('tearsBig')){const big=fx.includes('tearsBig');for(const e of [a,b]){g.fillStyle='rgba(170,220,255,.9)';g.strokeStyle='rgba(100,160,225,1)';g.lineWidth=Math.max(2,d*.01);
    const w=big?d*.045:d*.025,h=big?d*.75:d*.3;g.beginPath();g.roundRect?g.roundRect(e.x-w,e.y+e.ry*.6,w*2,h,w):g.rect(e.x-w,e.y+e.ry*.6,w*2,h);g.fill();g.stroke();}}
}
// animated fx drawn after transform (in character coordinates)
function drawLiveFx(g,m,fx,t,box){if(!m.eyes&&!fx.length)return;const d=m.eyes?d2(m):m.w*.25;const hx=m.eyes?(m.eyes[0].x+m.eyes[1].x)/2:m.w/2,top=box.top;
  const font=(s)=>`700 ${s}px Kanit, sans-serif`;
  if(fx.includes('bang')){g.font=font(d*.55);g.fillStyle='#ff4d5e';g.strokeStyle='#fff';g.lineWidth=d*.04;const y=top+d*.15+Math.sin(t*20)*d*.02;g.strokeText('!',hx+d*.9,y);g.fillText('!',hx+d*.9,y);}
  if(fx.includes('q')){g.font=font(d*.55);g.fillStyle='#8b7fd6';g.strokeStyle='#fff';g.lineWidth=d*.04;const y=top+d*.2+Math.sin(t*3)*d*.04;g.strokeText('?',hx+d*.85,y);g.fillText('?',hx+d*.85,y);}
  if(fx.includes('zzz')){g.font=font(d*.3);g.fillStyle='#9aa3d8';for(let i=0;i<3;i++){const p=((t*.5)+i/3)%1;g.globalAlpha=1-p;g.fillText('z',hx+d*(.6+p*.5),top+d*(.4-p*.6));}g.globalAlpha=1;}
  if(fx.includes('heart')){const p=(t*.8)%1;g.globalAlpha=1-p*.6;heart(g,hx+d*.95,top+d*(.35-p*.4),d*.14);g.globalAlpha=1;}
  if(fx.includes('sparkle'))for(let i=0;i<4;i++){const ang=i*Math.PI/2+.6,rr=d*1.25;const s=.6+.4*Math.sin(t*6+i);star(g,hx+Math.cos(ang)*rr,m.eyes?m.eyes[0].y-d*.2+Math.sin(ang)*rr*.8:top,d*.1*s);}
  if(fx.includes('sweat')){const y=(m.eyes?m.eyes[1].y:top)-d*.45+((t*.9)%1)*d*.25;g.fillStyle='#a9dbff';g.strokeStyle='#5a9bd8';g.lineWidth=d*.012;const x=hx+d*.95;g.beginPath();g.moveTo(x,y-d*.1);g.quadraticCurveTo(x+d*.07,y,x,y+d*.06);g.quadraticCurveTo(x-d*.07,y,x,y-d*.1);g.fill();g.stroke();}
  if(fx.includes('anger')){const x=hx+d*.95,y=top+d*.35,r=d*.08*(1+.15*Math.sin(t*12));g.strokeStyle='#ef3b4a';g.lineWidth=d*.035;g.lineCap='round';for(let i=0;i<4;i++){const an=i*Math.PI/2+Math.PI/4;const cx=x+Math.cos(an)*r,cy=y+Math.sin(an)*r;g.beginPath();g.arc(cx,cy,r,an+Math.PI*.65,an+Math.PI*1.35);g.stroke();}}
  if(fx.includes('gloom')){g.strokeStyle='rgba(110,100,190,.55)';g.lineWidth=d*.02;for(let i=0;i<7;i++){const x=hx-d*.75+i*d*.25;g.beginPath();g.moveTo(x,top+d*.25);g.lineTo(x,top+d*(.55+(i%3)*.12));g.stroke();}}
  if(fx.includes('cold')){g.fillStyle='rgba(180,220,255,.8)';for(let i=0;i<6;i++){const p=((t*.4)+i/6)%1;g.beginPath();g.arc(hx-d+i*d*.4,top+p*d*2,d*.025,0,7);g.fill();}}
}
function heart(g,x,y,r){g.fillStyle='#ff5f7e';g.beginPath();g.moveTo(x,y+r*.9);g.bezierCurveTo(x-r*1.6,y-r*.2,x-r*.6,y-r*1.3,x,y-r*.35);g.bezierCurveTo(x+r*.6,y-r*1.3,x+r*1.6,y-r*.2,x,y+r*.9);g.fill();}
function star(g,x,y,r){g.fillStyle='#ffd447';g.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,rr=i%2?r*.35:r;g[i?'lineTo':'moveTo'](x+Math.cos(a)*rr,y+Math.sin(a)*rr);}g.fill();}
// draw char into canvas ctx fitted in (W,H), feet at bottom
function drawChar(ctx,C,mot,t,W,H){const m=C.m;if(!C.img)return;const p=mot.f(t)||{};
  const fx=p.fx||[],eyes=p.eyes||'open',mouth=p.mouth||'';
  const staticFx=fx.filter(f=>['blush','blushX','tears','tearsBig','redden'].includes(f)),liveFx=fx.filter(f=>!staticFx.includes(f));
  const lay=C.layer(eyes,mouth,staticFx);
  const s=Math.min(W*.86/m.w,H*.8/m.h);
  ctx.clearRect(0,0,W,H);ctx.save();
  ctx.translate(W/2+(p.dx||0)*W,H*.94+(p.dy||0)*H);ctx.rotate((p.r||0)*Math.PI/180);ctx.scale(s*(p.sx||1)*(p.flip?-1:1),s*(p.sy||1));
  ctx.translate(-m.feet.x,-m.feet.y);ctx.imageSmoothingQuality='high';ctx.drawImage(lay,0,0);
  if(p.flip){ctx.translate(m.feet.x,0);ctx.scale(-1,1);ctx.translate(-m.feet.x,0);}
  drawLiveFx(ctx,m,liveFx,t,{top:m.top||0});ctx.restore();}

/* ================= background removal + feet ================= */
function cutout(im,tol){const W=im.naturalWidth,H=im.naturalHeight,MAX=2000,sc=Math.min(1,MAX/Math.max(W,H));
  const w=Math.round(W*sc),h=Math.round(H*sc);const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(im,0,0,w,h);
  const id=g.getImageData(0,0,w,h),D=id.data,N=w*h;
  // background colour = median of border pixels
  const bs=[];for(let x=0;x<w;x+=4){bs.push(x*4,((h-1)*w+x)*4);}for(let y=0;y<h;y+=4){bs.push(y*w*4,(y*w+w-1)*4);}
  const med=k=>{const a=bs.map(i=>D[i+k]).sort((x,y)=>x-y);return a[a.length>>1];};const br=med(0),bgc=med(1),bb=med(2);
  const near=new Uint8Array(N);for(let i=0;i<N;i++){const dr=D[i*4]-br,dg=D[i*4+1]-bgc,db=D[i*4+2]-bb;if(D[i*4+3]<20||dr*dr+dg*dg+db*db<tol*tol)near[i]=1;}
  const bg=new Uint8Array(N),st=new Int32Array(N);let sp=0;const push=i=>{if(near[i]&&!bg[i]){bg[i]=1;st[sp++]=i;}};
  for(let x=0;x<w;x++){push(x);push((h-1)*w+x);}for(let y=0;y<h;y++){push(y*w);push(y*w+w-1);}
  while(sp){const i=st[--sp],x=i%w;if(x>0)push(i-1);if(x<w-1)push(i+1);if(i>=w)push(i-w);if(i<N-w)push(i+w);}
  // bounding box of figure
  let x0=w,x1=0,y0=h,y1=0;for(let i=0;i<N;i++)if(!bg[i]){const x=i%w,y=(i/w)|0;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  // enclosed near-bg pockets in the top 22% (e.g. inside a hair loop) -> background
  const lab=new Int32Array(N);let nl=0;const top=y0+(y1-y0)*.22;
  for(let s0=0;s0<N;s0++){if(!near[s0]||bg[s0]||lab[s0])continue;nl++;let q=[s0],k=0,cnt=0,minY=h,minX=w,maxX=0;lab[s0]=nl;
    while(k<q.length){const i=q[k++];cnt++;const y=(i/w)|0;if(y<minY)minY=y;const x=i%w;if(x<minX)minX=x;if(x>maxX)maxX=x;for(const j of [x>0?i-1:-1,x<w-1?i+1:-1,i-w,i+w]){if(j>=0&&j<N&&near[j]&&!bg[j]&&!lab[j]){lab[j]=nl;q.push(j);}}}
    const side=(x1-x0)*.2;if(cnt<N*.02&&(minY<top||minX<x0+side||maxX>x1-side))for(const i of q)bg[i]=1;}
  for(let i=0;i<N;i++){if(bg[i])D[i*4+3]=0;else{const x=i%w;const e=(x>0&&bg[i-1])||(x<w-1&&bg[i+1])||(i>=w&&bg[i-w])||(i<N-w&&bg[i+w]);if(e)D[i*4+3]=150;}}
  g.putImageData(id,0,0);
  // crop with margin
  const pad=Math.round(Math.max(x1-x0,y1-y0)*.04);const cx0=Math.max(0,x0-pad),cy0=Math.max(0,y0-pad),cw=Math.min(w,x1+pad)-cx0,ch=Math.min(h,y1+pad+1)-cy0;
  const o=document.createElement('canvas');o.width=cw;o.height=ch;o.getContext('2d').drawImage(c,cx0,cy0,cw,ch,0,0,cw,ch);
  // feet: centre of the lowest 3% opaque rows
  const od=o.getContext('2d').getImageData(0,0,cw,ch).data;let fy=0;outer:for(let y=ch-1;y>=0;y--)for(let x=0;x<cw;x++)if(od[(y*cw+x)*4+3]>128){fy=y;break outer;}
  let sx=0,n=0;for(let y=Math.max(0,fy-Math.round(ch*.03));y<=fy;y++)for(let x=0;x<cw;x++)if(od[(y*cw+x)*4+3]>128){sx+=x;n++;}
  let ty=0;outer2:for(let y=0;y<ch;y++)for(let x=0;x<cw;x++)if(od[(y*cw+x)*4+3]>128){ty=y;break outer2;}
  return {canvas:o,w:cw,h:ch,feet:{x:n?sx/n:cw/2,y:fy},top:ty,bg:[br,bgc,bb]};}
function sampleSkin(c,x,y,r){const g=c.getContext('2d');const d=g.getImageData(Math.max(0,x-r),Math.max(0,y-r),r*2,r*2).data;const px=[];
  for(let i=0;i<d.length;i+=4){if(d[i+3]<200)continue;const s=d[i]+d[i+1]+d[i+2];px.push([s,d[i],d[i+1],d[i+2]]);}px.sort((a,b)=>b[0]-a[0]);
  const top=px.slice(0,Math.max(1,px.length*.4|0));const avg=k=>Math.round(top.reduce((a,p)=>a+p[k],0)/top.length);return `rgb(${avg(1)},${avg(2)},${avg(3)})`;}
function sampleLine(c,e){const g=c.getContext('2d');const d=g.getImageData(Math.max(0,e.x-e.rx|0),Math.max(0,e.y-e.ry|0),e.rx*2|0,e.ry|0).data;let best=[255,255,255],bs=999;
  for(let i=0;i<d.length;i+=4){if(d[i+3]<200)continue;const s=d[i]+d[i+1]+d[i+2];if(s<bs){bs=s;best=[d[i],d[i+1],d[i+2]];}}return `rgb(${best.join(',')})`;}

/* ================= screens ================= */
let draft=null, rafs=[];
function stopAnims(){rafs.forEach(cancelAnimationFrame);rafs=[];}
function steps(n){const S=['1 อัปรูป','2 แตะตา-ปาก','3 ดูท่าทาง','4 บันทึก/ส่งให้ Claude'];return `<div class="steps">${S.map((s,i)=>`<span class="${i+1===n?'on':i+1<n?'done':''}">${i+1<n?'✓ ':''}${s}</span>`).join('')}</div>`;}

async function home(){stopAnims();draft=null;const L=await listChars().catch(()=>[]);
  app.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><h2>ตัวละครของเรา</h2><button class="btn ghost" id="imp">📂 เปิดไฟล์โมเดล</button></div>
  <p class="muted" style="margin:0 0 14px">อัปรูปตัวละครจาก GPT (พื้นขาวเรียบ เต็มตัว) → เว็บทำท่าทางให้ ${MOTIONS.length} แบบอัตโนมัติ → ส่งให้ Claude เอาไปทำวิดีโอ</p>
  <div class="grid"><button class="ccard new" id="add">＋<br>สร้างตัวละครใหม่</button>${L.sort((a,b)=>b.created-a.created).map(c=>`<button class="ccard" data-id="${c.id}"><img src="${c.img}" alt=""><b>${esc(c.name)}</b><span class="muted" style="font-size:14px">${MOTIONS.length} ท่า${c.eyes?'':' · ไม่มีหน้า'}</span></button>`).join('')}</div>`;
  $('#add').onclick=()=>$('#fImg').click();$('#imp').onclick=()=>$('#fModel').click();
  app.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const c=L.find(x=>x.id===b.dataset.id);showMotions(c,true);});}

$('#fImg').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>stepCut(im,f.name.replace(/\.[^.]+$/,''));im.src=r.result;};r.readAsDataURL(f);};
$('#fModel').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=async()=>{try{const m=JSON.parse(r.result);if(m.type!=='ss-char')throw 0;m.id=m.id||String(Date.now());await putChar(m);toast('เพิ่มตัวละคร '+m.name+' แล้ว');home();}catch(x){toast('ไฟล์นี้ไม่ใช่โมเดลตัวละคร');}};r.readAsText(f);};

function stepCut(im,name){stopAnims();let tol=34;
  app.innerHTML=`${steps(1)}<div class="box"><h2>ตัดพื้นหลังอัตโนมัติ</h2><div class="stage"><canvas id="cc"></canvas></div>
   <label>ถ้าพื้นหลังเหลือ เลื่อนไปทางขวา · ถ้าตัวละครแหว่ง เลื่อนไปทางซ้าย<input type="range" id="tol" min="8" max="80" value="${tol}"></label>
   <label>ชื่อตัวละคร<input type="text" id="nm" value="${esc(name)}"></label>
   <div class="row"><button class="btn ghost" id="back">ยกเลิก</button><span style="flex:1"></span><button class="btn main" id="next">ต่อไป →</button></div></div>`;
  let res;const run=()=>{res=cutout(im,tol);const c=$('#cc');c.width=res.w;c.height=res.h;c.getContext('2d').drawImage(res.canvas,0,0);};
  setTimeout(run,30);$('#tol').oninput=e=>{tol=+e.target.value;clearTimeout(run._t);run._t=setTimeout(run,120);};
  $('#back').onclick=home;
  $('#next').onclick=()=>{draft={id:String(Date.now()),type:'ss-char',v:1,name:($('#nm').value||'ตัวละคร').trim(),img:res.canvas.toDataURL('image/png'),w:res.w,h:res.h,feet:res.feet,top:res.top,created:Date.now()};draft._cv=res.canvas;stepFace();};}

function stepFace(){stopAnims();const pts=[];const labels=['แตะ “กลางตาข้างซ้าย” (ฝั่งซ้ายของจอ)','แตะ “กลางตาอีกข้าง”','แตะ “ปาก”'];
  app.innerHTML=`${steps(2)}<div class="box"><h2 id="ask" class="big">${labels[0]}</h2><p class="muted" style="margin:0">ใช้ทำกะพริบตา ขยับปาก และสีหน้าต่างๆ · ถ้าตัวละครไม่มีหน้า กด “ข้าม”</p>
   <div class="stage" id="fs"><canvas id="fc"></canvas></div>
   <label id="szl" hidden>ขนาดวงตา (ให้วงครอบลูกตาพอดี)<input type="range" id="sz" min="40" max="160" value="100"></label>
   <div class="row"><button class="btn ghost" id="redo">แตะใหม่</button><button class="btn ghost" id="skip">ข้าม</button><span style="flex:1"></span><button class="btn main" id="next" disabled>ดูท่าทาง →</button></div></div>`;
  const c=$('#fc'),g=c.getContext('2d');c.width=draft.w;c.height=draft.h;let k=1;
  function paint(){g.clearRect(0,0,c.width,c.height);g.drawImage(draft._cv,0,0);g.lineWidth=Math.max(3,c.width/250);
    if(pts.length>=2){const d=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y);for(const p of pts.slice(0,2)){g.strokeStyle='#22d3ee';g.beginPath();g.ellipse(p.x,p.y,d*.3*k,d*.21*k,0,0,7);g.stroke();}}
    pts.forEach((p,i)=>{g.fillStyle=i<2?'#22d3ee':'#f472b6';g.beginPath();g.arc(p.x,p.y,Math.max(6,c.width/120),0,7);g.fill();});}
  paint();
  c.addEventListener('pointerdown',e=>{if(pts.length>=3)return;const r=c.getBoundingClientRect();pts.push({x:(e.clientX-r.left)/r.width*c.width,y:(e.clientY-r.top)/r.height*c.height});
    if(pts.length===2&&pts[1].x<pts[0].x)pts.reverse();$('#ask').textContent=pts.length<3?labels[pts.length]:'เรียบร้อย ✓ ปรับขนาดวงตาได้ถ้าไม่พอดี';if(pts.length>=2)$('#szl').hidden=false;$('#next').disabled=pts.length<3;paint();});
  $('#sz').oninput=e=>{k=e.target.value/100;paint();};
  $('#redo').onclick=()=>{pts.length=0;$('#ask').textContent=labels[0];$('#next').disabled=true;$('#szl').hidden=true;paint();};
  $('#skip').onclick=()=>{draft.eyes=null;draft.mouth=null;showMotions(draft,false);};
  $('#next').onclick=()=>{const d=Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y);draft.eyes=pts.slice(0,2).map(p=>({x:Math.round(p.x),y:Math.round(p.y),rx:Math.round(d*.3*k),ry:Math.round(d*.21*k)}));
    draft.mouth={x:Math.round(pts[2].x),y:Math.round(pts[2].y)};
    const below=Math.round(draft.eyes[0].y+draft.eyes[0].ry*1.6);draft.skin=sampleSkin(draft._cv,Math.round((pts[0].x+pts[1].x)/2),Math.round((pts[0].y+pts[2].y)/2),Math.max(6,d*.08|0));
    draft.line=sampleLine(draft._cv,draft.eyes[0]);showMotions(draft,false);};}

function showMotions(m,saved){stopAnims();const C=makeChar(m);
  app.innerHTML=`${saved?'':steps(3)}<div class="row" style="justify-content:space-between;margin-bottom:12px"><h2>${esc(m.name)} · ${MOTIONS.length} ท่า</h2><span class="muted">แตะท่าเพื่อดูจอใหญ่</span></div>
   <div class="tiles">${MOTIONS.map(x=>`<div class="tile" data-m="${x.id}"><canvas width="300" height="466"></canvas><b>${x.n}</b></div>`).join('')}</div>
   <div class="box" style="margin-top:16px"><h2>${saved?'โมเดลตัวละครนี้':'4 บันทึกและส่งให้ Claude'}</h2>
   <p class="muted" style="margin:0">ไฟล์โมเดลมีรูปตัวละคร ตำแหน่งตา-ปาก และรายชื่อท่าทั้งหมด ส่งในแชทให้ Claude แล้ว Claude ใช้ตัวละครนี้ทำวิดีโอได้ทุกสถานการณ์ (60fps 1080p)</p>
   <div class="row">${saved?'':`<button class="btn ghost" id="back">← แก้ตา-ปาก</button>`}<span style="flex:1"></span>${saved?`<button class="btn red" id="del">ลบตัวละคร</button>`:`<button class="btn ok" id="save">💾 บันทึกเข้าคลัง</button>`}<button class="btn main" id="send">📤 ส่งโมเดลให้ Claude</button></div>
   ${saved?'<button class="btn ghost" id="home">← ตัวละครทั้งหมด</button>':''}</div>`;
  C.ready.then(()=>{const tiles=[...app.querySelectorAll('.tile')];const t0=performance.now();
    const vis=new Set();const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?vis.add(e.target):vis.delete(e.target)));tiles.forEach(t=>io.observe(t));
    const loop=now=>{const t=(now-t0)/1000;for(const el of vis){const cv=el.querySelector('canvas');drawChar(cv.getContext('2d'),C,MOTIONS.find(x=>x.id===el.dataset.m),t,cv.width,cv.height);}rafs[0]=requestAnimationFrame(loop);};
    rafs[0]=requestAnimationFrame(loop);
    tiles.forEach(el=>el.onclick=()=>viewer(C,MOTIONS.find(x=>x.id===el.dataset.m)));});
  const strip=()=>{const o=Object.assign({},m);delete o._cv;o.motions=MOTIONS.map(x=>({id:x.id,name:x.n}));return o;};
  if($('#back'))$('#back').onclick=stepFace;
  if($('#home'))$('#home').onclick=home;
  if($('#save'))$('#save').onclick=async()=>{await putChar(strip());toast('บันทึก '+m.name+' เข้าคลังแล้ว');showMotions(strip(),true);};
  if($('#del'))$('#del').onclick=async e=>{const b=e.currentTarget;if(!b._s){b._s=1;b.textContent='แตะอีกครั้งเพื่อลบ';setTimeout(()=>{b._s=0;b.textContent='ลบตัวละคร';},3000);return;}await delChar(m.id);home();};
  $('#send').onclick=async()=>{const o=strip();if(!saved)await putChar(o);const blob=new Blob([JSON.stringify(o)],{type:'application/json'});const name=`model-${o.name}.json`;const f=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return;}catch(x){if(x.name==='AbortError')return;}}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);toast('ดาวน์โหลดแล้ว ส่งไฟล์นี้ในแชทให้ Claude ได้เลย');};}

let vraf=0;function viewer(C,mot){const v=$('#viewer');v.style.display='flex';$('#vT').textContent=C.m.name+' · '+mot.n;const cv=$('#vC'),g=cv.getContext('2d');const t0=performance.now();
  const loop=now=>{drawChar(g,C,mot,(now-t0)/1000,cv.width,cv.height);vraf=requestAnimationFrame(loop);};vraf=requestAnimationFrame(loop);}
$('#vX').onclick=()=>{cancelAnimationFrame(vraf);$('#viewer').style.display='none';};

/* for Claude: frame-exact preview rendering */
window.SSChar={make:makeChar,draw:drawChar,motions:MOTIONS};
home();
})();
</script>
