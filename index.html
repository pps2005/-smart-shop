<style>
:root{color-scheme:light dark;--bg:#faf6ec;--ink:#1b1b1b;--mu:#6b655a;--card:#fff;--line:#e4dccb;--ac:#f5c518;--ok:#2e9e5b;--bad:#d9453b}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--ink:#f1ede2;--mu:#a39d90;--card:#1f1f1f;--line:#34322d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Sarabun",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.st{display:flex;gap:8px;align-items:center;justify-content:center;background:#111;color:#eee;font-size:13px;padding:calc(6px + env(safe-area-inset-top)) 10px 6px}
.dot{width:9px;height:9px;border-radius:50%;background:#888}.dot.on{background:var(--ok)}.dot.off{background:var(--bad)}
nav{display:flex;align-items:center;gap:4px;overflow-x:auto;background:var(--card);border-bottom:3px solid var(--ac);padding:8px 10px;position:sticky;top:0;z-index:5}
nav b{font-size:17px;letter-spacing:1px;margin-right:8px;white-space:nowrap}nav b i{background:var(--ac);color:#111;font-style:normal;padding:0 6px;border-radius:4px}
nav a{color:var(--ink);text-decoration:none;padding:6px 12px;border-radius:8px;white-space:nowrap;font-size:15px}nav a.on{background:var(--ac);color:#111;font-weight:700}
.hero{position:relative;height:300px;background:#0d0d10;overflow:hidden;color:#fff}
.sl{position:absolute;inset:0;opacity:0;transition:opacity .8s;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 48px}
.sl.on{opacity:1}.sl svg{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.sl h1,.sl p{position:relative;margin:0;text-shadow:0 2px 8px #000}.sl h1{font-size:28px}.sl p{margin-top:8px;color:#f5c518}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:var(--ac);color:#111;font-size:20px;z-index:2}
.film{height:30px;background:#111;display:flex;align-items:center}
.film div{flex:1;height:14px;background:repeating-linear-gradient(90deg,var(--bg) 0 14px,transparent 14px 28px)}
main{max-width:860px;margin:0 auto;padding:18px 14px 40px}
h2{margin:6px 0 4px;text-align:center;font-size:21px}.sub{text-align:center;color:var(--mu);margin:0 0 16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.g .c{margin:0;text-align:center;border-top:4px solid var(--ac);cursor:pointer}.g .c .e{font-size:38px}
.c h3{margin:0 0 6px;font-size:17px}.mu{color:var(--mu);font-size:14px}
.r{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}.r:first-of-type{border-top:0}
button,.bt{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 14px}
.sw{min-width:64px;font-weight:700}.sw.on{background:var(--ok);color:#fff;border-color:var(--ok)}.sw.off{background:var(--card);color:var(--bad);border-color:var(--bad)}
.pri{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}.dg{border-color:var(--bad);color:var(--bad)}
input,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);margin:4px 0 8px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;margin:2px;border:1px solid var(--line)}.chip.y{background:var(--ok);color:#fff;border-color:var(--ok)}
.er{color:var(--bad);margin:8px 0}.ms{color:var(--ok);margin:8px 0}
#cs{width:min(92vw,calc(70vh*9/16));margin:0 auto;aspect-ratio:9/16;border-radius:18px;overflow:hidden;position:relative;border:3px solid #111;background:#bfe8ff}
#cs svg{width:100%;height:100%;display:block}#csub{position:absolute;left:8px;right:8px;bottom:12px;color:#fff;font-weight:700;font-size:clamp(17px,5vw,24px);line-height:1.35;text-shadow:0 0 4px #000,0 2px 6px #000;min-height:3em}
#cen{position:absolute;left:8px;right:8px;top:10px;color:#222;background:#fffd;border-radius:10px;padding:4px 8px;font-size:14px;display:none}
.sh{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}.sh figure{margin:0;width:30%;min-width:88px}.sh figcaption{font-size:12px;color:var(--mu)}.sh svg{width:100%;height:96px}.pt svg{height:210px;width:auto}
</style></head><body>

<div class="hero" id="hero">

<script>
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cfg=()=>{try{return JSON.parse(localStorage.getItem('ss_imgbot')||'{}')||{}}catch(e){return{}}};
async function api(p,b){const c=cfg();if(!c.url)throw new Error('ยังไม่ได้เชื่อมบอท — ไปที่ 🔌 เชื่อมต่อ');
 const r=await fetch(c.url.replace(/\/+$/,'')+p+(c.key?'?k='+encodeURIComponent(c.key):''),b?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}:{});
 if(r.status===401)throw new Error('รหัสผ่านบอทไม่ถูกต้อง');
 const j=await r.json().catch(()=>({error:'บอทตอบไม่ถูกต้อง (ลิงก์ถูกไหม?)'}));if(!r.ok||j.error)throw new Error(j.error||'HTTP '+r.status);return j}
// ---- สไลด์
let si=0;const sl=[...document.querySelectorAll('.sl')];
function mv(n){sl[si].classList.remove('on');si=(si+n+sl.length)%sl.length;sl[si].classList.add('on')}
setInterval(()=>mv(1),6000);let tx=0;const h=$('#hero');
h.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
h.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>40)mv(d<0?1:-1)});
// ---- สถานะบอท
async function ping(){try{const j=await api('/api/ping');$('#d').className='dot on';$('#dt').textContent='บอทเชื่อมอยู่ · '+(j.ver||'')}catch(e){$('#d').className='dot off';$('#dt').textContent=String(e.message||e)}}
// ---- หน้า
const SWL={master:'ตัวจัดคิวหลัก (ปิดตัวนี้ = หยุดทุกอย่าง)',queue:'รันคิวงาน',kaggle:'ใช้เครื่อง Kaggle',helpers:'ใช้เครื่องผู้ช่วย'};
const KL={image:'🖼 สร้างรูป',video:'🎬 ทำวิดีโอ',voice:'🎙 ทำเสียง',subs:'💬 ทำซับ',text:'✍️ เขียนบท / ตรวจภาพ',edit:'✂️ ตัดต่อ'};
const STL={kwait:'รอเครื่อง Kaggle',queued:'รอ',running:'กำลังทำ',done:'เสร็จ',failed:'พลาด',cancelled:'ยกเลิก'};
const imgUrl=id=>{const c=cfg();return c.url.replace(/\/+$/,'')+'/api/img?id='+id+(c.key?'&k='+encodeURIComponent(c.key):'')};
const P={};
P['']=async()=>`<h2>Welcome to Xiress Studio</h2><p class="sub">เลือกประเภทงาน ใส่โจทย์ แล้วให้ระบบทำให้</p>
<div class="g"><div class="c" onclick="location.hash='#/new'"><div class="e">🎞</div><h3>งานใหม่</h3><div class="mu">สร้างงานเข้าคิว</div></div>
<div class="c" onclick="location.hash='#/queue'"><div class="e">⏱</div><h3>คิวงาน</h3><div class="mu">ดูและยกเลิกรายงาน</div></div>
<div class="c" onclick="location.hash='#/sum'"><div class="e">📋</div><h3>สรุปงาน</h3><div class="mu">สวิตช์ปิด/เปิดรายตัว</div></div></div>`;
P.new=async()=>{let ms=[];try{ms=(await api('/api/status')).models.filter(m=>m.fit=='ok')}catch(e){}
return `<h2>🎞 งานใหม่</h2><p class="sub">เลือกโมเดล แล้วใส่โจทย์ (เปิดสวิตช์โมเดลในสรุปงานก่อน)</p>
<div class="c"><select id="k" style="width:100%;padding:9px;border-radius:9px;margin-bottom:8px"><option value="image">🖼 รูป · FLUX.1 schnell (Workers AI)</option>${ms.map(m=>`<option value="k:${m.id}">${KL[m.kind]||''} · ${E(m.name)} (Kaggle)</option>`).join('')}</select>
<textarea id="i" rows="5" placeholder="รูป: อธิบายภาพ (อังกฤษดีสุด) · ซับ: ลิงก์ไฟล์เสียง/วิดีโอ (URL)"></textarea><button class="pri" id="go">เพิ่มเข้าคิว</button><div id="m"></div></div>`};
P.queue=async()=>{const j=await api('/api/jobs');return `<h2>⏱ คิวงาน</h2><div style="text-align:center;margin-bottom:8px"><button onclick="show()">🔄 รีเฟรช</button></div><div class="c">${j.jobs.length?j.jobs.map(x=>`<div class="r"><div><b>#${x.id} ${E(x.kind)}</b> <span class="chip">${STL[x.status]||x.status}</span>${x.err?`<div class="er">${E(x.err)}</div>`:''}${x.out&&x.out!='img'?`<pre style="white-space:pre-wrap;font:13px/1.5 monospace;margin:6px 0 0">${E(x.out)}</pre>`:''}${x.status=='done'&&(x.kind=='image'||x.out=='img')?`<img src="${imgUrl(x.id)}" style="max-width:100%;border-radius:8px;margin-top:6px">`:''}</div>${['queued','running','kwait'].includes(x.status)?`<button class="dg" data-c="${x.id}">ปิด</button>`:''}</div>`).join(''):'<div class="mu">ยังไม่มีงาน</div>'}</div>`};
P.sum=async()=>{const s=await api('/api/status'),L=s.link,ch=(t,y)=>`<span class="chip ${y?'y':''}">${t}${y?' ✓':' –'}</span>`,
 sw=(n,l,on)=>`<div class="r"><span>${l}</span><button class="sw ${on?'on':'off'}" data-s="${n}" data-v="${on?0:1}">${on?'เปิด':'ปิด'}</button></div>`,
 q=Object.fromEntries(s.jobs.map(x=>[x.status,x.n])),
 mod=Object.keys(KL).map(k=>{const l=(s.models||[]).filter(m=>m.kind==k);return l.length?`<div class="c"><h3>${KL[k]}</h3>${l.map(m=>`<div class="r"><div><b>${E(m.name)}</b> <span class="chip ${m.fit=='ok'||m.fit=='cf'?'y':''}">${{ok:'พร้อมใช้ (Kaggle)',cf:'พร้อมใช้ (Workers AI)',reg:'ลงทะเบียนไว้',big:'ใหญ่เกินเครื่องฟรี'}[m.fit]||m.run}</span><div class="mu">${E(m.note)}${m.hf?'':' · ชื่อรุ่นต้องตรวจก่อนใช้'}</div></div><button class="sw ${m.on?'on':'off'}" data-s="model:${m.id}" data-v="${m.on?0:1}">${m.on?'เปิด':'ปิด'}</button></div>`).join('')}</div>`:''}).join('');
 return `<h2>📋 สรุปงาน</h2>
<div class="c"><h3>การเชื่อมต่อ</h3>${ch('Kaggle',L.kaggle)}${ch('GitHub',L.github)}${ch('Telegram',L.telegram)}${ch('Supabase',L.supabase)}${ch('เสียงพากย์ '+s.voices,s.voices>0)}${ch('เสียงเอฟเฟกต์ '+s.sfx,s.sfx>0)}<div style="margin-top:8px"><button id="kt">ทดสอบ Kaggle</button> <span id="km"></span></div></div>
<div class="c"><h3>ระบบอัตโนมัติ (ปิดไว้ทั้งหมดเป็นค่าเริ่มต้น)</h3>${Object.keys(SWL).map(n=>sw(n,SWL[n],s.sw[n]=='1')).join('')}</div>
${s.helpers.length?`<div class="c"><h3>ผู้ช่วย Kaggle รายตัว</h3>${s.helpers.map(x=>sw('helper:'+x.id,E(x.name||'ผู้ช่วย '+x.id),x.on_==1)).join('')}</div>`:''}
${s.flux.length?`<div class="c"><h3>คีย์ Flux รายตัว</h3>${s.flux.map(x=>sw('flux:'+x.id,E(x.name||'คีย์ '+x.id),x.on_==1)).join('')}</div>`:''}
<h2 style="margin-top:18px">🧠 โมเดล</h2><p class="sub">ลงทะเบียนไว้ ยังไม่มีสูตรงานเรียกใช้ · เปิด = เลือกไว้ใช้</p>${mod}<div class="c"><h3>คิว</h3><div class="mu">รอ ${q.queued||0} · กำลังทำ ${q.running||0} · เสร็จ ${q.done||0} · พลาด ${q.failed||0}</div><div style="margin-top:8px"><button class="dg" id="cl">ปิดงานค้างทั้งหมด</button></div></div>
<div class="c"><h3>ล้างข้อมูลเก่า</h3><div class="mu">ลบตัวละคร, LoRA, ภาพ, วิดีโอ, บท/ซีรีส์ และคิวเก่า · เก็บการเชื่อม เสียงพากย์ เสียงเอฟเฟกต์ไว้ · กู้คืนไม่ได้</div><input id="wc" placeholder="พิมพ์ ลบทั้งหมด เพื่อยืนยัน"><button class="dg" id="wp">ล้างข้อมูลเก่า</button><div id="wm"></div></div>`};
P.conn=async()=>{const c=cfg();return `<h2>🔌 เชื่อมต่อ</h2><div class="c"><input id="bu" placeholder="ลิงก์บอท (https://…workers.dev)" value="${E(c.url)}"><input id="bk" type="password" placeholder="รหัสผ่านบอท" value="${E(c.key)}"><button class="pri" id="bs">บันทึก + ทดสอบ</button><div id="bm"></div></div>
<div class="c"><h3>Kaggle</h3><div class="mu">ใส่ชื่อผู้ใช้และคีย์ API (เก็บในฐานข้อมูลของบอทเหมือนระบบเก่า) · ว่างทั้งคู่แล้วบันทึก = ลบ</div><input id="ku" placeholder="ชื่อผู้ใช้ Kaggle"><input id="kk" type="password" placeholder="คีย์ API Kaggle"><button class="pri" id="ks">บันทึก + ทดสอบ</button><div id="km2"></div></div>`};

// ===== ชุดตัวละครหลักของช่อง (วาดด้วยโค้ด · ใช้ชุดเดียวกันทุกตอน) =====
const NS="http://www.w3.org/2000/svg",EL=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e},LN={stroke:"#5b4b4b","stroke-width":4,"stroke-linecap":"round","stroke-linejoin":"round"},KC="#2b2233";
const CAST=[
{id:"capy",n:"คาปิ",t:"คาปิบาร่าอ้วนกลม ใจเย็นที่สุดในโลก",d:"ไม่สนใจโลก ไม่รีบ ไม่เครียด · ส้มลูกเล็กบนหัวคือเอกลักษณ์ · คำติดปาก: It’s fine.",c:"#c99a6b",b:"#ecd3b0",rx:62,ry:46,p:.8,r:.9},
{id:"cat",n:"มิว",t:"แมวส้มตาปรือ ปากแสบ",d:"ทำหน้านิ่งแล้วสวนทุกประโยค · หนวดกับลายพาดหน้าผากคือเอกลักษณ์ · คำติดปาก: Hmm. No.",c:"#f4c28f",b:"#fff1e0",rx:40,ry:60,p:1.1,r:1},
{id:"dog",n:"โมจิ",t:"ลูกหมาซื่อ รักเพื่อนสุดใจ",d:"พูดความจริงจนทุกคนอึ้ง · แต้มสีน้ำตาลที่ตากับผ้าพันคอแดงคือเอกลักษณ์ · คำติดปาก: Yay!",c:"#f6ead8",b:"#fffaf0",rx:38,ry:44,p:1.7,r:1.15},
{id:"bobo",n:"โบโบ้",t:"ก้อนกลมจอมขี้เกียจ มั่นใจเกินตัว",d:"ผู้นำที่ไม่เคยทำอะไรแต่เชื่อว่าตัวเองขยัน · ใบไม้บนหัวคือเอกลักษณ์ · คำติดปาก: Productive!",c:"#ffae42",b:"#ffe3b0",rx:58,ry:52,p:1.35,r:1.05},
{id:"long",n:"ลอง",t:"กระต่ายสูงหน้านิ่ง ปากแสบ",d:"พูดน้อยแต่ทุกประโยคคือคำสวน · แว่นกลมกับตาปรือคือเอกลักษณ์ · คำติดปาก: Approved.",c:"#a99bff",b:"#e4deff",rx:30,ry:88,p:.55,r:.85},
{id:"pip",n:"ปิ๊ป",t:"ลูกเจี๊ยบจิ๋ว ซื่อจนช็อก",d:"ซื่อไร้พิษภัยแต่พูดความจริงจนทุกคนอึ้ง · เปลือกไข่บนหัวคือเอกลักษณ์ · คำติดปาก: Oopsie!",c:"#ffdc3d",b:"#fff4b0",rx:30,ry:27,p:1.9,r:1.15}];
const XP={"ปกติ":["n","s"],"ดีใจ":["h","o"],"เกรียน":["sm","g"],"ช็อก":["sh","O"],"ง่วง":["z","f"],"วางแผนร้าย":["sm","w"]};
function face(r,k){const o=r.o,x=XP[k]||XP["ปกติ"],f=r.fc,ey=-o.ry*1.25,ex=o.id=="long"?17:Math.max(13,o.rx*.38),my=ey+18,m=x[1];f.textContent="";
 [-1,1].forEach(s=>{const g=EL("g",{transform:`translate(${s*ex} ${ey})`},f),e=x[0];
  if(e=="h")EL("path",{d:"M-8 3 q8 -11 16 0",fill:"none",...LN},g);

 on('[data-s]',b=>b.onclick=async()=>{try{await api('/api/switch',{name:b.dataset.s,on:+b.dataset.v});show()}catch(e){alert(e.message)}});
