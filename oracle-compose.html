 $('#side').innerHTML=h;
}
function ed(){
 var l=sel,h='';
 if(!l){$('#ed').innerHTML='<small>แตะรูป/ข้อความในคลังเพื่อวางบนไพ่ (คอมลากมาวางได้) · แตะชิ้นงานบนไพ่เพื่อแก้ไข · ลากเพื่อย้าย</small>';return}
 if(l.ty==='t'){h+='<input data-f="t" value="'+esc(l.t)+'" placeholder="ชื่อ"><input data-f="e" value="'+esc(l.e)+'" placeholder="English"><input data-f="kw" value="'+esc(l.kw)+'" placeholder="คำคีย์เวิร์ด">'
  +'<div class="r"><input type="range" data-f="sz" min=".03" max=".15" step=".005" value="'+l.sz+'"><input type="color" data-f="c" value="'+l.c+'" style="width:56px"></div>'
  +'<div class="r"><select data-f="f">'+FONTS.map(function(f){return '<option'+(l.f===f?' selected':'')+'>'+f+'</option>'}).join('')+'</select><select data-f="pl"><option value="g"'+(l.pl==='g'?' selected':'')+'>ไล่เฉดดำ</option><option value="b"'+(l.pl==='b'?' selected':'')+'>กล่อง</option><option value="n"'+(l.pl==='n'?' selected':'')+'>เงา</option></select></div>'}
 else h+='<small>ซูมรูป</small><input type="range" data-f="s" min=".5" max="3" step=".01" value="'+l.s+'">';
 h+='<div class="r"><button class="bt" data-a="up">↑ ขึ้น</button><button class="bt" data-a="dn">↓ ลง</button><button class="bt" data-a="rm">ลบ</button></div>';
 $('#ed').innerHTML=h;
}
/* events */
$('#ed').addEventListener('input',function(e){var k=e.target.dataset.f;if(!k||!sel)return;sel[k]=e.target.type==='range'?+e.target.value:e.target.value;draw()});
function pt(e){var r=cv.getBoundingClientRect();return[(e.clientX-r.left)*LW/r.width,(e.clientY-r.top)*LH/r.height]}
cv.onpointerdown=function(e){var p=pt(e);sel=L.slice().reverse().filter(function(l){return l.b&&p[0]>=l.b[0]&&p[0]<=l.b[0]+l.b[2]&&p[1]>=l.b[1]&&p[1]<=l.b[1]+l.b[3]})[0]||null;drag=sel&&{p:p,x:sel.x,y:sel.y};cv.setPointerCapture(e.pointerId);ed();draw()};
cv.onpointermove=function(e){if(!drag)return;var p=pt(e);sel.x=drag.x+(p[0]-drag.p[0])/LW;sel.y=drag.y+(p[1]-drag.p[1])/LH;draw()};
cv.onpointerup=function(){drag=null};
cv.ondragover=function(e){e.preventDefault()};
cv.ondrop=function(e){e.preventDefault();var d=e.dataTransfer.getData('text/plain'),p=pt(e),x=p[0]/LW,y=p[1]/LH,i=+d.slice(1);if(d[0]==='i'&&lib[i])addImg(lib[i],x,y);if(d[0]==='t'&&texts[i])addTxt(texts[i],x,y)};
document.addEventListener('dragstart',function(e){var d=e.target.dataset&&e.target.dataset.d;if(d)e.dataTransfer.setData('text/plain',d)});
document.addEventListener('change',function(e){if(e.target.id!=='up')return;Array.prototype.forEach.call(e.target.files,function(f){var u=URL.createObjectURL(f);lib.unshift({u:u,load:function(){return imgFrom(u)}})});side()});
function save(){localStorage.oc_texts=JSON.stringify(texts)}
var A={
 tab:function(v){T=v;side()},
 addi:function(v){addImg(lib[+v])},addt:function(v){addTxt(texts[+v])},
 nt:function(){$('#nt').value.split('\n').forEach(function(r){var p=r.split('|').map(function(s){return s.trim()});if(p[0])texts.push({t:p[0],e:p[1]||'',kw:p[2]||''})});save();side()},
 seed:function(){var n=0;SEED.forEach(function(x){if(!texts.some(function(t){return t.t===x[0]&&t.e===x[1]})){texts.push({t:x[0],e:x[1],kw:x[2]});n++}});save();side();toast('เพิ่ม '+n+' ข้อความ')},
 dt:function(v){texts.splice(+v,1);save();side()},
 up:function(){var i=L.indexOf(sel);if(i>=0&&i<L.length-1){L.splice(i+1,0,L.splice(i,1)[0]);draw()}},
 dn:function(){var i=L.indexOf(sel);if(i>0){L.splice(i-1,0,L.splice(i,1)[0]);draw()}},
 rm:function(){L=L.filter(function(l){return l!==sel});sel=null;ed();draw()},
 usef:function(v){var x=fin[+v];addImg({load:function(){return imgFrom(x.u)}})},
 df:function(v){var x=fin[+v];tx('readwrite',function(s){return s.delete(x.id)}).then(loadFin)}
};
document.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(t&&A[t.dataset.a]){e.stopPropagation();A[t.dataset.a](t.dataset.v)}});
/* ยืนยัน: รวมเป็นรูปใหม่ 300dpi */
$('#ok').onclick=function(){
 if(!L.length){toast('ยังไม่มีอะไรบนไพ่');return}
 sel=null;
 Promise.all(FONTS.map(function(f){return document.fonts.load('700 20px '+f)})).then(function(){
  var S=Math.round(SZ[$('#sz').value][0]/25.4*300)/LW,c=document.createElement('canvas');c.width=Math.round(LW*S);c.height=Math.round(LH*S);paint(c.getContext('2d'),S,0);
  return new Promise(function(r){c.toBlob(r,'image/png')})
 }).then(function(b){return tx('readwrite',function(s){return s.add({b:b,t:Date.now()})}).then(function(){var u=URL.createObjectURL(b);return imgFrom(u).then(function(im){L=[{ty:'i',im:im,s:1,x:.5,y:.5}];sel=null;ed();draw();return loadFin()})})}).then(function(){T='f';side();toast('บันทึกเป็นรูปใหม่แล้ว (แท็บ "เสร็จแล้ว" โหลดได้)')}).catch(function(){toast('สร้างรูปไม่สำเร็จ (รูปจากบอทอาจติด CORS)')});
};
$('#sz').onchange=setSz;
/* รูปจากบอท */
if(cfg().url)fetch(U('/api/state')).then(function(r){return r.json()}).then(function(S){
 (S.images||[]).filter(function(i){return /^oracle\|/.test(i.project)}).sort(function(a,b){return b.id-a.id}).slice(0,150).forEach(function(i){var u=U('/img/'+i.id);lib.push({u:u,load:function(){return fetch(u).then(function(r){return r.blob()}).then(function(b){return imgFrom(URL.createObjectURL(b))})}})});side()
}).catch(function(){});
function hh(){document.documentElement.style.setProperty('--hh',document.querySelector('header').offsetHeight+'px')}hh();addEventListener('resize',hh);
setSz();side();ed();loadFin();
})();
