<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Xire.ai</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Kanit', sans-serif; background: #f8f6f3; color: #2c2c2c; }
header { position: absolute; top: 0; left: 0; right: 0; z-index: 10; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(0,0,0,0.35), transparent); }
.logo { font-family: 'Playfair Display', serif; font-size: 28px; color: #fff; font-weight: 600; letter-spacing: 1px; }
nav a { color: #fff; text-decoration: none; margin-left: 28px; font-size: 15px; opacity: 0.9; }
nav a:hover { opacity: 1; }
.hero { height: 100vh; position: relative; display: flex; align-items: center; justify-content: center; color: #fff; text-align: center; overflow: hidden; }
.hero video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(0,0,0,0.5)); }
.hero-content { position: relative; z-index: 2; }
.hero h1 { font-family: 'Playfair Display', serif; font-size: clamp(48px, 8vw, 90px); font-weight: 500; text-shadow: 0 2px 20px rgba(0,0,0,0.5); }
.section { padding: 80px 40px; max-width: 1200px; margin: 0 auto; }
.section h2 { font-family: 'Playfair Display', serif; font-size: 36px; text-align: center; margin-bottom: 12px; color: #3a3a3a; }
.section .sub { text-align: center; color: #777; margin-bottom: 48px; font-size: 16px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
.card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,0.08); transition: transform 0.3s; }
.card:hover { transform: translateY(-6px); }
.card img { width: 100%; height: 320px; object-fit: cover; }
.card-body { padding: 18px 20px; }
.card-body h3 { font-size: 18px; margin-bottom: 6px; }
.card-body p { color: #777; font-size: 14px; }
.cta-box { text-align: center; padding: 60px 20px; background: #fff; }
.btn { display: inline-block; background: #2c2c2c; color: #fff; padding: 14px 36px; border-radius: 999px; text-decoration: none; font-size: 15px; margin-top: 16px; }
.btn:hover { background: #444; }
footer { text-align: center; padding: 40px; color: #999; font-size: 13px; background: #fff; }
</style>
</head>
<body>
<header>
<div class="logo">Xire.ai</div>
<nav>
<a href="#stories">เรื่อง</a>
<a href="#gallery">แกลเลอรี</a>
<a href="anime-studio.html">สตูดิโอ</a>
</nav>
</header>

<section class="hero">
<video autoplay muted loop playsinline>
<source src="https://cdn.coverr.co/videos/coverr-a-woman-walking-on-a-city-street-1573/1080p.mp4" type="video/mp4">
</video>
<div class="hero-content">
<h1>Xire.ai</h1>
</div>
</section>

<section class="section" id="stories">
<h2>ตัวละคร</h2>
<p class="sub">สร้างด้วย Xire.ai</p>
<div class="gallery">
<div class="card">
<img src="https://picsum.photos/id/1011/600/800" alt="ตัวละครหลัก" />
<div class="card-body">
<h3>ตัวละครหลัก</h3>
<p>สไตล์สมจริง · พร้อมใช้</p>
</div>
</div>
<div class="card">
<img src="https://picsum.photos/id/1012/600/800" alt="ฉาก" />
<div class="card-body">
<h3>ฉากตัวอย่าง</h3>
<p>ภาพสวย · 16:9</p>
</div>
</div>
<div class="card">
<img src="https://picsum.photos/id/1016/800/500" alt="ซีรีส์" />
<div class="card-body">
<h3>ซีรีส์ใหม่</h3>
<p>กำลังสร้าง</p>
</div>
</div>
</div>
</section>

<div class="cta-box">
<h2 style="font-family:'Playfair Display',serif;margin-bottom:8px;">เริ่มสร้าง</h2>
<p style="color:#777;margin-bottom:20px;">เข้าสู่สตูดิโอเพื่อสร้างซีรีส์ วิดีโอ และภาพด้วย Xire.ai</p>
<a href="anime-studio.html" class="btn">เข้าสู่สตูดิโอ</a>
</div>

<footer>Xire.ai</footer>
</body>
</html>
